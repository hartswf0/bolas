<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:,">
<title>WYGWYL Levels</title>
<style>
/* Layout: a shelf of fourteen poems, then a stage: the poem's scenes as painted tableaux, the reading as the clock,
   the line being read as the subtitle, a marker on the floor to stand on while it is read. */
:root{--bg:#0b0d10;--panel:#141920;--line:#2a313c;--ink:#e8ecf1;--muted:#9aa4b2;--brass:#d8ab4f;--brass-soft:#3a3020;--ok:#6cc28f;--bad:#ec7a6e;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;--body:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{overflow:hidden}button{font:inherit;color:inherit}
#shelf{position:fixed;inset:0;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
header{max-width:1000px;margin:0 auto 14px}
h1{font-family:var(--display);font-size:1.7rem;margin:.2rem 0}
p{color:var(--muted);margin:0 0 .4rem;max-width:62ch;line-height:1.45}a{color:#8fb8ff}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;cursor:pointer;display:grid;min-width:0}
.lv:focus-visible,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.lv img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0f1319}
.lv div{padding:8px 10px 10px;display:grid;gap:3px}.lv b{font-family:var(--display);font-size:1rem}.lv small{color:var(--muted);font-size:.78rem;line-height:1.3}
.lv .best{color:var(--brass)}
#stage{position:fixed;inset:0;display:none;touch-action:none;user-select:none;-webkit-user-select:none;background:#07080b}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));pointer-events:none;background:linear-gradient(#000a,#0000)}
.top>*{pointer-events:auto}
.btn{background:#141920e6;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:.88rem;cursor:pointer;min-height:40px}
.btn.on{background:var(--brass-soft);border-color:var(--brass)}
#ttl{flex:1;min-width:0;font-family:var(--display);font-size:.82rem;line-height:1.15;text-shadow:0 1px 4px #000}
#scn{position:absolute;left:max(10px,env(safe-area-inset-left,0px));color:#ffffffb8;font-size:.74rem;text-shadow:0 1px 4px #000;pointer-events:none}
#score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brass);text-shadow:0 1px 4px #000;white-space:nowrap}
#sub{position:absolute;left:0;right:0;pointer-events:none;padding:0 max(14px,env(safe-area-inset-left,0px));text-align:center;font-family:var(--display);font-size:clamp(1.05rem,4.3vw,1.5rem);line-height:1.3;text-shadow:0 2px 8px #000,0 0 3px #000;color:#ffffff88}
#sub span{transition:color .08s}#sub span.on{color:#fff}
#pad{position:absolute;left:0;right:0;top:64px;bottom:calc(76px + env(safe-area-inset-bottom,0px));touch-action:none}
#knob{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff14;display:none;pointer-events:none}
#knob i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#ffffff66}
#acts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px max(10px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,#0b0d10f2,#0b0d10b0 70%,#0b0d1000);scrollbar-width:none}
#acts::-webkit-scrollbar{display:none}#acts .btn{flex:0 0 auto;min-height:48px;padding:10px 16px;white-space:nowrap}
.veil{position:absolute;inset:0;display:none;place-items:center;background:#0b0d10d9;padding:20px;text-align:center}
.veil .box{max-width:420px;display:grid;gap:12px;justify-items:center}
.veil h2{font-family:var(--display);margin:0;font-size:1.5rem}.veil .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stars{font-size:2rem;letter-spacing:.2em;color:var(--brass)}
</style></head><body>
<section id="shelf"><header>
  <h1>WYGWYL Levels</h1>
  <p>Each poem is a level. Her reading is the clock: the scenes change as the poem moves. A glowing marker shows where to stand while each line is read. Stand on it for most of the line to catch it.</p>
  <p><a href="./">← Characters</a> · <a href="../">Workshop</a></p>
</header><div class="grid" id="lv"></div></section>

<section id="stage">
  <canvas id="cv"></canvas>
  <div class="top"><button class="btn" id="back">‹ Poems</button><div id="ttl"></div><div id="score"></div><button class="btn" id="pause">Pause</button></div>
  <div id="scn"></div>
  <div id="sub"></div>
  <div id="pad"><div id="knob"><i></i></div></div>
  <div id="acts"></div>
  <div class="veil" id="start"><div class="box"><h2 id="stt"></h2><p id="stn"></p><button class="btn on" id="go">Start the reading</button><button class="btn" id="who"></button></div></div>
  <div class="veil" id="end"><div class="box"><h2>The poem ends</h2><div class="stars" id="stars"></div><p id="endn"></p><div class="row"><button class="btn on" id="again">Play again</button><button class="btn" id="next">Next poem</button><button class="btn" id="home">Poems</button></div></div></div>
</section>

<script src="anim.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let CHARS = [], INDEX = [], L = null, actor = null, scenes = [], sceneImgs = [], audio = null, castIdx = 0;
let W=0,H=0,DPR=1; const cv = $('cv'), ctx = cv.getContext('2d');
let move = 0, lastT = 0, running = false, paused = false, ended = false, started = false;
let cur = {i:-1, fade:0}, stats = [], score = 0, total = 0, camLeft = 0, lineOf = null, subKey = '';
const keys = {};

function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); }
addEventListener('resize', resize);

/* ---------- shelf ---------- */
function buildShelf(){
  const g = $('lv');
  INDEX.forEach(p=>{
    const b = document.createElement('button'); b.className = 'lv';
    const best = store.get('wy.best.'+p.num);
    b.innerHTML = `<img loading="lazy" alt="" src="levels/${p.thumb}"><div><b></b><small></small><small class="best"></small></div>`;
    b.querySelector('b').textContent = p.num + ' · ' + p.title;
    b.querySelector('small').textContent = `${Math.round(p.duration)} s · ${p.scenes} scenes · ${p.lines} lines · ${p.cast} to play as`;
    b.querySelector('.best').textContent = best ? ('Best: ' + best + ' lines caught') : '';
    b.addEventListener('click', ()=>openLevel(p.num));
    g.append(b);
  });
}

/* ---------- opening a level ---------- */
async function openLevel(num){
  $('shelf').style.display = 'none'; $('stage').style.display = 'block'; resize();
  L = await (await fetch(`levels/${num}/level.json`)).json();
  scenes = L.scenes;
  sceneImgs = await Promise.all(scenes.map(s=>WY.loadImg(`levels/${num}/${s.img}`)));
  const pref = L.cast.findIndex(c=>c.key==='poet/red_black_sunglasses');
  castIdx = pref >= 0 ? pref : 0;
  await setActor(castIdx);
  stats = scenes.map(s=>s.lines.map(()=>({inT:0, done:false, ok:false, shown:-1e9})));
  total = scenes.reduce((n,s)=>n+s.lines.length,0); score = 0; ended = false; started = false; paused = false; cur = {i:-1, fade:0};
  if (audio){ audio.pause(); audio = null; }
  audio = new Audio(`levels/${num}/${L.audio}`); audio.preload = 'auto';
  audio.addEventListener('ended', finish);
  $('ttl').textContent = `${L.num} · ${L.title}`;
  $('stt').textContent = `${L.num} · ${L.title}`;
  $('stn').textContent = `${Math.round(L.duration)} seconds, ${scenes.length} scenes, ${total} lines. Headphones help.`;
  $('start').style.display = 'grid'; $('end').style.display = 'none'; updateScore();
  actor.x = 300; actor.dir = 1; camLeft = 0; lastT = performance.now(); running = true; requestAnimationFrame(frame);
}

async function setActor(i){
  castIdx = (i + L.cast.length) % L.cast.length;
  const c = L.cast[castIdx]; const ch = CHARS.find(x=>x.key===c.key);
  const imgs = await Promise.all(ch.draws.map(d=>WY.loadImg(`assets/${ch.dir}/${d.f}`)));
  const keepX = actor ? actor.x : 300, keepDir = actor ? actor.dir : 1;
  actor = new WY.Actor(ch, imgs); actor.x = keepX; actor.dir = keepDir;
  $('who').textContent = 'Play as: ' + ch.name.replace(/\s*\(.*$/,'');
  buildButtons();
}
function buildButtons(){
  const box = $('acts'); box.innerHTML = '';
  actor.buttons().forEach(b=>{ const e = document.createElement('button'); e.className = 'btn'; e.textContent = b.label; e.addEventListener('pointerdown', ev=>{ ev.preventDefault(); b.fn(); }); box.append(e); });
}

/* ---------- the clock is the reading ---------- */
function now_t(){ return audio ? audio.currentTime : 0; }
function sceneAt(t){ let k = 0; for (let i=0;i<scenes.length;i++) if (t >= scenes[i].t0) k = i; return k; }
function updateScore(){ $('score').textContent = `${score}/${total}`; }

function frame(ts){
  if (!running) return;
  const dt = Math.min(0.05, (ts - lastT)/1000); lastT = ts;
  const t = now_t(), live = started && !paused && !ended;
  const k = sceneAt(t);
  if (k !== cur.i){ cur = {i:k, fade:1}; $('scn').textContent = scenes[k].name; subKey = ''; }
  cur.fade = Math.max(0, cur.fade - dt*3);
  const sc = scenes[k], fw = L.frame[0];
  // input and walking
  const kx = (keys.ArrowRight||keys.d?1:0) - (keys.ArrowLeft||keys.a?1:0);
  const m = kx !== 0 ? kx : move, eff = Math.abs(m) < 0.15 ? 0 : m;
  if (eff !== 0){ actor.dir = eff > 0 ? 1 : -1; actor.x = Math.max(40, Math.min(fw-40, actor.x + eff * 125 * sc.ppc * dt)); }
  // markers: stand on one while its line is read
  const near = lx => Math.abs(actor.x - lx) < 90 * sc.ppc;
  sc.lines.forEach((ln, j)=>{
    const st = stats[k][j];
    if (live && !st.done && t >= ln.t && t <= ln.e && near(ln.mx)) st.inT += dt;
    if (live && !st.done && t > ln.e){ st.done = true; st.ok = st.inT >= 0.4 * Math.max(0.4, ln.e - ln.t); st.shown = performance.now(); if (st.ok){ score++; updateScore(); } }
  });
  // earlier scenes' unfinished lines are closed when the scene changes
  for (let i=0;i<k;i++) stats[i].forEach((st, j)=>{ if (!st.done){ const ln = scenes[i].lines[j]; st.done = true; st.ok = false; st.shown = performance.now(); } });
  draw(sc, k, t, eff, ts);
  requestAnimationFrame(frame);
}

function draw(sc, k, t, moving, ts){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H); ctx.fillStyle = '#07080b'; ctx.fillRect(0,0,W,H);
  const fw = L.frame[0], fh = L.frame[1];
  const land = W > H*1.2, stageH = land ? H - 54 - 76 : Math.min(H*0.74, H - 64 - 130), s = stageH / fh, y0 = 54, vw = W / s;
  $('scn').style.top = (y0 + stageH - 22) + 'px';
  const target = Math.max(0, Math.min(fw - vw, actor.x - vw/2)); camLeft += (vw >= fw ? (0 - camLeft) : (target - camLeft)) * 0.12;
  const offX = vw >= fw ? (W - fw*s)/2 : 0, left = vw >= fw ? 0 : camLeft;
  const img = sceneImgs[k];
  ctx.save(); ctx.beginPath(); ctx.rect(offX, y0, Math.min(W, fw*s), stageH); ctx.clip();
  if (img) ctx.drawImage(img, offX - left*s, y0, fw*s, fh*s);
  const fy = y0 + sc.floor*s, px = x => offX + (x - left)*s;
  // light pool so a dark character is never lost
  const pool = ctx.createRadialGradient(px(actor.x), fy-4, 4, px(actor.x), fy-4, 130*sc.ppc*s);
  pool.addColorStop(0,'rgba(255,240,200,.30)'); pool.addColorStop(1,'rgba(255,240,200,0)');
  ctx.save(); ctx.translate(0, fy-4); ctx.scale(1,0.22); ctx.translate(0,-(fy-4)); ctx.fillStyle = pool; ctx.fillRect(px(actor.x)-300, fy-300, 600, 600); ctx.restore();
  // markers
  sc.lines.forEach((ln, j)=>{
    const st = stats[k][j]; const vis = (t >= ln.t - 2.6 && t <= ln.e + 0.4) || (st.done && performance.now() - st.shown < 900);
    if (!vis) return;
    const active = t >= ln.t && t <= ln.e, x = px(ln.mx), r = 90*sc.ppc*s;
    const col = st.done ? (st.ok ? '108,194,143' : '236,122,110') : '216,171,79';
    const pulse = active ? 0.55 + 0.25*Math.sin(ts/140) : 0.28 + 0.12*Math.sin(ts/300);
    ctx.save(); ctx.translate(x, fy); ctx.scale(1, 0.24);
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fillStyle = `rgba(${col},${pulse*0.45})`; ctx.fill(); ctx.lineWidth = 4/0.24*0.6; ctx.strokeStyle = `rgba(${col},${Math.min(1,pulse+0.25)})`; ctx.stroke(); ctx.restore();
    const g = ctx.createLinearGradient(0, fy-170*s*sc.ppc/ sc.ppc*0.6, 0, fy); g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(1, `rgba(${col},${pulse*0.5})`);
    ctx.fillStyle = g; ctx.fillRect(x-r*0.18, fy-160*s, r*0.36, 160*s);
    if (active){ // how much of the line you have covered
      const frac = Math.min(1, st.inT / Math.max(0.4, (ln.e - ln.t) * 0.4)); ctx.fillStyle = `rgba(${col},.9)`; ctx.fillRect(x-r*0.6, fy+10*s, r*1.2*frac, 5);
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.strokeRect(x-r*0.6, fy+10*s, r*1.2, 5);
    }
  });
  // the player
  const c = actor.pick(performance.now(), moving !== 0);
  actor.draw(ctx, c, px(actor.x), fy, sc.ppc*s, performance.now());
  ctx.restore();
  if (cur.fade > 0){ ctx.fillStyle = `rgba(7,8,11,${cur.fade})`; ctx.fillRect(0,0,W,H); }
  // subtitle
  let line = null; for (const ln of sc.lines) if (t >= ln.t - 0.15 && t <= ln.e + 0.6) line = ln;
  const sub = $('sub'); sub.style.top = (land ? y0 + stageH - 64 : y0 + stageH + 8) + 'px';
  const key = line ? sc.key + '|' + line.t : '';
  if (key !== subKey){ subKey = key; sub.innerHTML = ''; if (line){ for (let w = line.w0; w <= line.w1; w++){ const sp = document.createElement('span'); sp.textContent = L.words[w][0] + ' '; sp.dataset.s = L.words[w][1]; sub.append(sp); } } }
  for (const sp of sub.children) sp.classList.toggle('on', t >= parseFloat(sp.dataset.s));
}

/* ---------- finish ---------- */
function finish(){
  ended = true; started = false;
  const pct = total ? score/total : 0, stars = pct >= 0.8 ? 3 : pct >= 0.5 ? 2 : 1;
  $('stars').textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
  $('endn').textContent = `You caught ${score} of ${total} lines.`;
  const b = parseInt(store.get('wy.best.'+L.num) || '0', 10); if (score > b) store.set('wy.best.'+L.num, String(score));
  $('end').style.display = 'grid';
}

/* ---------- ui ---------- */
$('go').addEventListener('click', ()=>{ $('start').style.display = 'none'; started = true; audio.currentTime = 0; audio.play().catch(()=>{ $('stn').textContent = 'The reading could not play: tap Start again.'; $('start').style.display = 'grid'; started = false; }); });
$('who').addEventListener('click', ()=>setActor(castIdx+1));
$('pause').addEventListener('click', ()=>{ if (ended || !started && !paused) return; paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; if (paused) audio.pause(); else audio.play(); });
$('back').addEventListener('click', ()=>{ running = false; if (audio) audio.pause(); $('stage').style.display = 'none'; $('shelf').style.display = 'block'; $('lv').innerHTML = ''; buildShelf(); });
$('home').addEventListener('click', ()=>$('back').click());
$('again').addEventListener('click', ()=>{ running = false; openLevel(L.num); });
$('next').addEventListener('click', ()=>{ const i = INDEX.findIndex(p=>p.num===L.num); running = false; openLevel(INDEX[(i+1)%INDEX.length].num); });
const pad = $('pad'), knob = $('knob'); let padId = null, ox = 0;
pad.addEventListener('pointerdown', e=>{ padId = e.pointerId; pad.setPointerCapture(e.pointerId); const r = pad.getBoundingClientRect(); ox = e.clientX; knob.style.display = 'block'; knob.style.left = (e.clientX-r.left)+'px'; knob.style.top = (e.clientY-r.top)+'px'; });
pad.addEventListener('pointermove', e=>{ if (e.pointerId!==padId) return; move = Math.max(-1, Math.min(1, (e.clientX-ox)/55)); knob.firstElementChild.style.transform = `translateX(${Math.max(-40,Math.min(40,e.clientX-ox))}px)`; });
const endPad = e=>{ if (e.pointerId!==padId) return; padId = null; move = 0; knob.style.display = 'none'; knob.firstElementChild.style.transform = ''; };
pad.addEventListener('pointerup', endPad); pad.addEventListener('pointercancel', endPad);
addEventListener('keydown', e=>{ keys[e.key] = true; }); addEventListener('keyup', e=>{ keys[e.key] = false; });
document.addEventListener('gesturestart', e=>e.preventDefault());

(async function(){
  try {
    CHARS = (await (await fetch('data.json')).json()).characters;
    INDEX = await (await fetch('levels/index.json')).json();
    buildShelf();
    const q = new URLSearchParams(location.search).get('p'); if (q) openLevel(q);
  } catch(e){ document.querySelector('#shelf header p').textContent = 'The level data did not load: ' + e.message; }
})();
</script></body></html>
