<style>
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-style:normal;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400 500;font-display:swap}
:root{--paper:#ebe3cf;--ink:#1c1814;--soft:#6f6656;--faint:#b9af99;--bar:52px;--fi:17px}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.6 "IM Fell English",Georgia,serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sc{text-transform:uppercase;font-size:.8em;letter-spacing:.16em}
.mono{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.08em}
@media (max-width:640px){:root{--fi:9px;--bar:46px}body{font-size:18px}}

/* the frame, as on every film's title card */
.frame{position:fixed;inset:0;pointer-events:none;z-index:60}
.frame i{position:absolute;display:block;border:1px solid var(--ink)}
.frame i.o{inset:calc(var(--fi) - 7px);z-index:2}
.frame i.n{inset:var(--fi);border-width:2px;box-shadow:0 0 0 60px var(--paper)}
@media (max-width:640px){.frame i.o{inset:4px}.frame i.n{border-width:1.5px}}
.unfold .frame i{animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.unfold .frame i.n{animation-delay:.15s}
@keyframes draw{from{clip-path:inset(50% 50% 50% 50%)}to{clip-path:inset(-90px -90px -90px -90px)}}

/* ---------- the title page ---------- */
.splash{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 28px;position:relative}
.splash h1{font-weight:400;font-size:clamp(46px,10vw,124px);line-height:1;margin:0;letter-spacing:.015em}
.splash h1 span{display:inline-block}
.unfold .splash h1 span{animation:ink .9s ease-out both;animation-delay:calc(.7s + var(--i) * .07s)}
@keyframes ink{from{opacity:0;color:var(--faint);transform:translateY(.06em)}to{opacity:1;color:var(--ink);transform:none}}
.splash .it{font-style:italic;font-size:clamp(21px,2.8vw,32px);margin:22px 0 6px}
.splash .by{font-style:italic;font-size:18px;color:var(--soft);margin:0}
.unfold .splash .it,.unfold .splash .by,.unfold .splash .cue{animation:fade 1.2s ease both}
.unfold .splash .it{animation-delay:1.8s}.unfold .splash .by{animation-delay:2.2s}.unfold .splash .cue{animation-delay:3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cue{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--soft);text-decoration:none}
.cue b{width:1px;height:36px;background:var(--ink);position:relative;animation:drop 2.4s ease-in-out infinite}
.cue b::after{content:"";position:absolute;left:-4px;bottom:0;width:7px;height:7px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg)}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.toc{max-width:780px;margin:0 auto;padding:40px 28px 40px}
.toc h2{font-weight:400;text-align:center;font-size:15px;letter-spacing:.24em;margin:0 0 30px}
.gh{text-align:center;margin:54px 0 18px}.gh:first-child{margin-top:0}.gh .sc{color:var(--soft)}.gh h3{font-weight:400;font-size:clamp(24px,4vw,34px);margin:8px 0 6px;letter-spacing:.02em}.gh p{font-style:italic;font-size:16.5px;color:var(--soft);margin:0 auto;max-width:34em;line-height:1.45}
.row{display:grid;grid-template-columns:2.6em 96px 1fr auto;gap:0 16px;align-items:center;padding:10px 0;text-decoration:none;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
.row.seen,.no-anim .row{opacity:1;transform:none}
.row .rn{font-size:15px;color:var(--soft);text-align:right}
.row .th{width:96px;aspect-ratio:16/9;border:1px solid var(--ink);object-fit:cover;display:block}
.row .th.none{border:1px dashed var(--faint)}
.row .nm{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .nm i{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-5px);min-width:20px}
.row .tm{font:500 12px "IBM Plex Mono",monospace;min-width:3.4em;text-align:right}
.row .sub{grid-column:3/5;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.07em;color:var(--soft);margin-top:2px}
.row .pg{grid-column:3/5;height:1px;background:var(--faint);margin-top:6px;position:relative}
.row .pg b{position:absolute;left:0;top:-.5px;height:2px;background:var(--ink)}
a.row:hover .nm span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
a.row:hover .th{outline:2px solid var(--ink)}
.row.todo,.row.todo .tm,.row.todo .sub{color:var(--faint)}
@media (max-width:640px){.row{grid-template-columns:1.7em 68px 1fr auto;gap:0 10px}.row .th{width:68px}.row .nm{font-size:16.5px}.row .nm i{display:none}}
.colophon{max-width:560px;margin:50px auto 0;text-align:center;font-style:italic;font-size:17px;color:var(--soft);padding:0 24px 100px}
.colophon .mono{display:block;font-style:normal;margin-top:18px;line-height:1.9}
.colophon a{text-underline-offset:3px}

/* ---------- the chapter bar ---------- */
.bar{position:fixed;left:calc(var(--fi) + 2px);right:calc(var(--fi) + 2px);top:calc(var(--fi) + 2px);height:var(--bar);z-index:55;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--ink)}
.bar .here{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.bar .here span{color:var(--soft);margin-right:.6em}
.bar .pr{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ink);width:0}
.bar .nav{display:flex;gap:6px;align-items:center}
.chev{width:34px;height:34px;display:grid;place-items:center}
.chev::before{content:"";width:9px;height:9px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.chev.l::before{transform:translateX(2px) rotate(45deg)}.chev.r::before{transform:translateX(-2px) rotate(-135deg)}
.chev[disabled]{opacity:.25;pointer-events:none}
.modes{display:flex;gap:14px;margin-right:6px}
.modes button{color:var(--soft);border-bottom:1px solid transparent}
.modes button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tocb i{display:none;width:18px;height:12px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);position:relative}
.tocb i::after{content:"";position:absolute;left:0;right:0;top:4px;border-top:1.5px solid var(--ink)}
@media (max-width:640px){.tocb .lbl{display:none}.tocb i{display:block}.tocb.x i{border:0}.tocb.x i::after{transform:rotate(45deg);top:5px}.tocb.x i::before{content:"";position:absolute;left:0;right:0;top:5px;border-top:1.5px solid var(--ink);transform:rotate(-45deg)}.bar{padding:0 8px;gap:6px}.bar .here{font-size:14px}.bar .here span{display:none}.modes{gap:10px;margin-right:0}}

/* ---------- the chapter ---------- */
.chapter{padding-top:calc(var(--bar) + var(--fi) + 10px)}
.chead{text-align:center;margin:0 auto;padding:46px 28px 40px;max-width:900px}
.chead .rn{font-size:15px;letter-spacing:.24em;color:var(--soft)}
.chead h1{font-weight:400;font-size:clamp(32px,5.6vw,66px);line-height:1.05;margin:10px 0 12px;letter-spacing:.01em}
.chead h1 span{display:inline-block;animation:ink .8s ease-out both;animation-delay:calc(.15s + var(--i) * .035s)}
.chead .it{font-style:italic;font-size:21px;margin:0;animation:fade 1s ease both .6s}
.book{max-width:1260px;margin:0 auto;padding:0 44px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px}
.screen{position:sticky;top:calc(var(--bar) + var(--fi) + 26px);align-self:start}
.vbox{position:relative;border:1px solid var(--ink);background:var(--paper)}
video{width:100%;display:block;aspect-ratio:16/9;background:var(--paper)}
.ctl{display:flex;align-items:center;gap:14px;margin-top:10px;color:var(--soft)}
.play{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;flex:none}
.play::before{content:"";width:0;height:0;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.play.on::before{width:10px;height:12px;border:0;border-left:3px solid var(--ink);border-right:3px solid var(--ink);margin:0}
.ctl .tc{flex:1}
.ctl .hint{font-style:italic;font-size:15px}
.text{max-width:33em;padding-bottom:30vh}
.text p{margin:0;padding:.42em 0;cursor:pointer;transition:color .5s;position:relative;hyphens:auto}
.text p .w{text-transform:uppercase;font-size:.72em;letter-spacing:.13em;margin-right:.5em}
.text p.n{text-indent:1.4em}
.text p.first{text-indent:0}
.text p.first::first-letter{font-size:3.1em;float:left;line-height:.85;margin:.06em .08em 0 0}
.text p.f{font-size:1.2em;line-height:1.4;padding:.9em 1.2em 1em;text-align:center}
.text p.f .w{display:block;font-size:.62em;margin:0 0 .3em}
.text p.tape{font:500 12.5px/1.5 "IBM Plex Mono",monospace;letter-spacing:.03em;padding:.15em 0 .15em 1.6em;text-transform:uppercase}
.text p{color:var(--faint)}
.text p.said{color:var(--ink)}
.text p.now::before{content:"";position:absolute;left:-20px;top:.6em;bottom:.6em;border-left:2px solid var(--ink)}
.text p.f.now::before{left:0}
.gap{position:relative}
.gap::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;border-left:1px dotted var(--faint)}
.gap.said::before{border-left-color:var(--ink)}
.gap .brk{position:absolute;left:50%;top:50%;width:56px;height:16px;margin:-8px 0 0 -28px;background:linear-gradient(var(--ink),var(--ink)) center/44px 1px no-repeat,var(--paper)}
.after{max-width:33em;margin:40px auto 0;padding:0 28px}
.after h2{font-weight:400;font-size:14px;letter-spacing:.24em;text-align:center;margin:0 0 20px}
.after dt{font-size:13px;letter-spacing:.2em;color:var(--soft);margin:16px 0 2px}
.after dd{margin:0;font-size:17px;line-height:1.55}
.after .more{text-align:center;margin:26px 0 0;font-style:italic}
.nextcard{display:block;text-decoration:none;text-align:center;margin:90px auto 0;padding:60px 28px 120px;max-width:900px;border-top:1px solid var(--ink)}
.nextcard .sc{color:var(--soft)}
.nextcard h3{font-weight:400;font-size:clamp(28px,4.6vw,52px);line-height:1.08;margin:14px 0 10px}
.nextcard p{font-style:italic;margin:0 0 26px}
.nextcard img{width:min(520px,100%);border:1px solid var(--ink);display:block;margin:0 auto}
.nextcard:hover h3{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.caption{display:none;text-align:center;max-width:780px;margin:22px auto 0;min-height:4.4em;font-size:24px;line-height:1.35}
.caption .w{display:block;font-size:13px;letter-spacing:.2em;color:var(--soft);text-transform:uppercase;margin-bottom:4px}
/* film mode: the film alone, with its line under it */
.m-film .book{grid-template-columns:minmax(0,1fr);max-width:min(1160px,calc((100svh - var(--bar) - 220px) * 16 / 9 + 90px))}
.m-film .text{display:none}
.m-film .screen{position:static}
.m-film .caption{display:block}
.m-film .ctl .hint{display:none}
@media (max-width:900px){
  .book{grid-template-columns:minmax(0,1fr);gap:0;padding:0 calc(var(--fi) + 6px)}
  .screen{top:calc(var(--bar) + var(--fi) + 1px);z-index:20;background:var(--paper);padding:8px 0 6px;margin:0 -4px;border-bottom:1px solid var(--faint)}
  .ctl{margin-top:6px}.play{width:34px;height:34px}
  .text{padding-top:18px;margin:0 auto;padding-left:14px;padding-right:6px}
  .text p.now::before{left:-12px}
  .chead{padding:30px 22px 24px}
}
/* contents sheet */
.sheet{position:fixed;inset:0;z-index:58;background:var(--paper);overflow:auto;padding:calc(var(--bar) + var(--fi) + 20px) 0 40px;display:none}
.sheet.open{display:block}
.sheet .toc{padding-top:10px}
.sheet .row{opacity:1;transform:none}
.sheet .row.cur .nm span{text-decoration:underline;text-underline-offset:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.row{opacity:1;transform:none}}
</style>

es the light we see?", "f": true, "tape": false}, {"t0": 12.6, "t1": 15.5, "who": "", "say": "MOON · Moon And Cloud 4", "f": false, "tape": true}, {"t0": 15.6, "t1": 19.4, "who": "", "say": "MIRROR · Going Steady?", "f": false, "tape": true}, {"t0": 19.35, "t1": 24.2, "who": "FOCUS", "say": "What changes when light is gathered?", "f": true, "tape": false}, {"t0": 19.5, "t1": 24.4, "who": "", "say": "SUNSET · Legacy for Wings", "f": false, "tape": true}, {"t0": 24.35, "t1": 28.8, "who": "REVEAL", "say": "What does an instrument make knowable?", "f": true, "tape": false}, {"t0": 24.5, "t1": 29.0, "who": "", "say": "BARN · Anatomy Of An Ancient Barn 6 - Rafters", "f": false, "tape": true}, {"t0": 28.95, "t1": 34.4, "who": "ANSWER", "say": "When does a light become a message?", "f": true, "tape": false}, {"t0": 29.1, "t1": 31.6, "who": "", "say": "ROAD · We Drivers (1935 edition)", "f": false, "tape": true}, {"t0": 31.7, "t1": 34.6, "who": "", "say": "NEON · How Man Made Day", "f": false, "tape": true}, {"t0": 34.55, "t1": 38.2, "who": "EMBODY", "say": "How does a body negotiate exposure?", "f": true, "tape": false}, {"t0": 34.7, "t1": 38.4, "who": "", "say": "FACE · Episode 10 - The EFNEP Program", "f": false, "tape": true}, {"t0": 38.35, "t1": 44.2, "who": "REMAIN", "say": "What survives when the source is absent?", "f": true, "tape": false}, {"t0": 38.5, "t1": 44.4, "who": "", "say": "STONE · Small Sun, the stone", "f": false, "tape": true}], [{"t0": 44.4, "t1": 51.75, "who": "", "say": "MONTAGE · every volume twice, face-on then side-on, cuts tightening to a quarter second", "f": false, "tape": true}, {"t0": 53.05, "t1": 59.25, "who": "", "say": "AFTERLIGHT", "f": true, "tape": false}, {"t0": 54.55, "t1": 59.25, "who": "", "say": "Twelve short films. One feature.", "f": false, "tape": false}, {"t0": 59.25, "t1": 62.05, "who": "", "say": "A FILM CONCEPT BY SOSUKE & WATSON · CRASH LAB · PAELEO", "f": false, "tape": true}]]}, "04-afterlife-essay": {"title": "The Afterlife of Light", "sub": "the story of these stories", "idea": "The archive is light that was kept", "dur": 222.22, "video": "../media/afterlight/afl-04-afterlife-essay.mp4", "poster": "../media/afterlight/thumbs/afl-04-afterlife-essay.jpg", "page": "v/04-afterlife-essay/", "picture": "Eleven chapters from the archive. Typed paper slips over archive plates; every shot marked PHOTOGRAPHED in the margin, every drawn insert marked INVENTED.", "sound": "A quiet bed that rises at each chapter and drops out for the magic mirror and the Kyoto fires.", "code": "An edit decision list: 270 archive shots screened, nine used, each with its source and in-point.", "after": "Make the story of these stories, from the archive.", "scenes": [[{"t0": 0.3, "t1": 6, "who": "", "say": "The Afterlife of Light", "f": true, "tape": false}, {"t0": 6.0, "t1": 12.0, "who": "", "say": "PHOTOGRAPHED · Sun Peeks Outs From Behind Clouds", "f": false, "tape": true}, {"t0": 6.8, "t1": 11.3, "who": "", "say": "Every story here begins with the same light.", "f": false, "tape": false}, {"t0": 12.0, "t1": 16.0, "who": "", "say": "PHOTOGRAPHED · Legacy for Wings", "f": false, "tape": true}, {"t0": 12.4, "t1": 16.0, "who": "", "say": "People kept asking it one question.", "f": false, "tape": false}], [{"t0": 16.0, "t1": 19.4, "who": "", "say": "What survives when the source is gone?", "f": true, "tape": false}], [{"t0": 19.6, "t1": 23.0, "who": "I", "say": "Borrowed light", "f": true, "tape": false}, {"t0": 22.0, "t1": 27.0, "who": "", "say": "PHOTOGRAPHED · Moon And Cloud 4", "f": false, "tape": true}, {"t0": 22.3, "t1": 26.8, "who": "", "say": "The Moon makes no light of its own. It returns about a tenth of the sunlight that reaches it.", "f": false, "tape": false}, {"t0": 27.0, "t1": 36.0, "who": "", "say": "INVENTED · drawn insert, earthshine", "f": false, "tape": true}, {"t0": 27.6, "t1": 32.1, "who": "", "say": "On a thin crescent the dark part glows faintly: sunlight off the Earth, carried back.", "f": false, "tape": false}, {"t0": 31.6, "t1": 36.0, "who": "", "say": "Leonardo worked this out around 1510.", "f": false, "tape": false}, {"t0": 33.8, "t1": 36.0, "who": "", "say": "What survives: sunlight, passed on twice.", "f": false, "tape": false}], [{"t0": 36.0, "t1": 39.4, "who": "II", "say": "A face in black glass", "f": true, "tape": false}, {"t0": 38.4, "t1": 46.4, "who": "", "say": "INVENTED · drawn insert, obsidian", "f": false, "tape": true}, {"t0": 38.9, "t1": 43.4, "who": "", "say": "Çatalhöyük, around 6000 BCE. Obsidian is ground until it shows a face.", "f": false, "tape": false}, {"t0": 44.0, "t1": 46.4, "who": "", "say": "What survives: a face, buried with its owner.", "f": false, "tape": false}, {"t0": 46.4, "t1": 51.4, "who": "", "say": "PHOTOGRAPHED · Going Steady?", "f": false, "tape": true}, {"t0": 46.8, "t1": 51.3, "who": "", "say": "A mirror shows its owner the one face they cannot otherwise see.", "f": false, "tape": false}], [{"t0": 51.4, "t1": 54.8, "who": "III", "say": "The hidden picture", "f": true, "tape": false}, {"t0": 53.8, "t1": 65.8, "who": "", "say": "INVENTED · drawn insert, makyo", "f": false, "tape": true}, {"t0": 54.2, "t1": 58.7, "who": "", "say": "China, then Japan: the makyō, or magic mirror. It looks plain.", "f": false, "tape": false}, {"t0": 60.1, "t1": 64.6, "who": "", "say": "In sunlight it throws a figure onto the wall.", "f": false, "tape": false}, {"t0": 62.9, "t1": 65.8, "who": "", "say": "What survives: a picture hidden in the shape of a surface.", "f": false, "tape": false}], [{"t0": 65.8, "t1": 69.2, "who": "IV", "say": "Fire from the Sun, water from the Moon", "f": true, "tape": false}, {"t0": 68.4, "t1": 72.4, "who": "", "say": "PHOTOGRAPHED · Anatomy Of An Ancient Barn 6 - Rafters", "f": false, "tape": true}, {"t0": 68.7, "t1": 72.4, "who": "", "say": "China, 2nd century BCE. The Huainanzi pairs two bronze instruments.", "f": false, "tape": false}, {"t0": 72.4, "t1": 79.4, "who": "", "say": "INVENTED · drawn insert, yangsui", "f": false, "tape": true}, {"t0": 73.2, "t1": 77.7, "who": "", "say": "A concave mirror takes fire from the Sun.", "f": false, "tape": false}, {"t0": 77.7, "t1": 79.4, "who": "", "say": "The fire is real.", "f": false, "tape": false}, {"t0": 79.7, "t1": 84.2, "who": "", "say": "A square vessel takes dew from the Moon.", "f": false, "tape": false}, {"t0": 82.8, "t1": 87.3, "who": "", "say": "The dew comes from a clear night sky. The Moon gets the credit.", "f": false, "tape": false}, {"t0": 85.9, "t1": 88.4, "who": "", "say": "What survives: the credit, given to the wrong source.", "f": false, "tape": false}], [{"t0": 88.4, "t1": 91.8, "who": "V", "say": "The debt that melted", "f": true, "tape": false}, {"t0": 91.1, "t1": 95.6, "who": "", "say": "Athens, 423 BCE. In Aristophanes' Clouds a debtor plans to melt the letters of his lawsuit with a burning stone.", "f": false, "tape": false}, {"t0": 97.1, "t1": 101.6, "who": "", "say": "Melting the letters would not cancel the debt.", "f": false, "tape": false}, {"t0": 99.6, "t1": 102.0, "who": "", "say": "What survives: the obligation, not the writing.", "f": false, "tape": false}], [{"t0": 102.0, "t1": 105.4, "who": "VI", "say": "Past the red", "f": true, "tape": false}, {"t0": 104.4, "t1": 110.4, "who": "", "say": "INVENTED · drawn insert, prism", "f": false, "tape": true}, {"t0": 105.0, "t1": 109.5, "who": "", "say": "Newton, 1666–72: the colours were already in the sunlight.", "f": false, "tape": false}, {"t0": 110.7, "t1": 115.2, "who": "", "say": "1800. Herschel sets a thermometer past the red. Nothing shows there. It rises.", "f": false, "tape": false}, {"t0": 115.0, "t1": 117.4, "who": "", "say": "What survives: heat where nothing shows.", "f": false, "tape": false}], [{"t0": 117.4, "t1": 120.8, "who": "VII", "say": "Light without fire", "f": true, "tape": false}, {"t0": 119.8, "t1": 129.8, "who": "", "say": "INVENTED · drawn insert, fireflies", "f": false, "tape": true}, {"t0": 120.2, "t1": 124.7, "who": "", "say": "Fireflies make light with almost no heat.", "f": false, "tape": false}, {"t0": 123.0, "t1": 127.5, "who": "", "say": "A Chinese saying, 囊螢映雪: one poor student read by a bag of fireflies, another by snowlight.", "f": false, "tape": false}, {"t0": 127.6, "t1": 129.8, "who": "", "say": "What survives: what they read.", "f": false, "tape": false}], [{"t0": 129.8, "t1": 133.2, "who": "VIII", "say": "Fires that are not there", "f": true, "tape": false}, {"t0": 132.2, "t1": 141.7, "who": "", "say": "INVENTED · drawn insert, mirage", "f": false, "tape": true}, {"t0": 132.7, "t1": 137.2, "who": "", "say": "On the Yatsushiro Sea, fishermen see lights where no boat is: shiranui.", "f": false, "tape": false}, {"t0": 136.2, "t1": 140.7, "who": "", "say": "Layers of warm and cold air bend the light of distant lamps and multiply it.", "f": false, "tape": false}, {"t0": 139.4, "t1": 141.7, "who": "", "say": "What survives: a lamp, seen where it never was.", "f": false, "tape": false}], [{"t0": 141.7, "t1": 145.1, "who": "IX", "say": "The body", "f": true, "tape": false}, {"t0": 144.1, "t1": 148.6, "who": "", "say": "PHOTOGRAPHED · Cabeza Prieta National Wildlife Refuge Desert Wilderness", "f": false, "tape": true}, {"t0": 144.5, "t1": 148.6, "who": "", "say": "Bodies lost most of their fur and learned to sweat. Heat leaves as water.", "f": false, "tape": false}, {"t0": 148.6, "t1": 152.4, "who": "", "say": "PHOTOGRAPHED · Care of the Skin", "f": false, "tape": true}, {"t0": 148.9, "t1": 152.4, "who": "", "say": "Skin uses ultraviolet light to make vitamin D, and darkens to limit it.", "f": false, "tape": false}, {"t0": 152.4, "t1": 156.6, "who": "", "say": "PHOTOGRAPHED · Small Steps...Giant Strides", "f": false, "tape": true}, {"t0": 152.7, "t1": 156.6, "who": "", "say": "What survives: sunlight, written into skin over many generations.", "f": false, "tape": false}], [{"t0": 156.6, "t1": 160.0, "who": "X", "say": "Light for the dead", "f": true, "tape": false}, {"t0": 159.0, "t1": 171.0, "who": "", "say": "INVENTED · drawn insert, daimonji", "f": false, "tape": true}, {"t0": 159.5, "t1": 164.0, "who": "", "say": "Kyoto, every 16 August.", "f": false, "tape": false}, {"t0": 163.6, "t1": 168.1, "who": "", "say": "Fires on the hills send the visiting dead back.", "f": false, "tape": false}, {"t0": 167.6, "t1": 171.0, "who": "", "say": "What survives: a bond with the dead, kept by fire.", "f": false, "tape": false}], [{"t0": 171.0, "t1": 174.4, "who": "XI", "say": "A letter from a star", "f": true, "tape": false}, {"t0": 173.4, "t1": 178.4, "who": "", "say": "PHOTOGRAPHED · The Eclipse", "f": false, "tape": true}, {"t0": 173.8, "t1": 178.3, "who": "", "say": "Starlight can arrive after its source has changed.", "f": false, "tape": false}, {"t0": 178.7, "t1": 183.2, "who": "", "say": "Supernova 1987A. The light seen in 1987 left about 168,000 years earlier.", "f": false, "tape": false}, {"t0": 183.7, "t1": 187.6, "who": "", "say": "What survives: an image of a star that is no longer the same.", "f": false, "tape": false}], [{"t0": 187.6, "t1": 191.0, "who": "", "say": "What survives when the source is gone?", "f": true, "tape": false}, {"t0": 190.95, "t1": 192.7, "who": "", "say": "Sunlight, passed on.", "f": false, "tape": false}, {"t0": 192.85, "t1": 194.5, "who": "", "say": "A face.", "f": false, "tape": false}, {"t0": 194.65, "t1": 196.3, "who": "", "say": "A hidden picture.", "f": false, "tape": false}, {"t0": 196.45, "t1": 198.1, "who": "", "say": "Credit, misplaced.", "f": false, "tape": false}, {"t0": 198.25, "t1": 199.8, "who": "", "say": "An obligation.", "f": false, "tape": false}, {"t0": 199.95, "t1": 201.5, "who": "", "say": "Heat no one can see.", "f": false, "tape": false}, {"t0": 201.65, "t1": 203.1, "who": "", "say": "What was read.", "f": false, "tape": false}, {"t0": 203.25, "t1": 204.7, "who": "", "say": "A lamp out of place.", "f": false, "tape": false}, {"t0": 204.85, "t1": 206.3, "who": "", "say": "Skin.", "f": false, "tape": false}, {"t0": 206.45, "t1": 207.9, "who": "", "say": "A bond.", "f": false, "tape": false}, {"t0": 208.05, "t1": 209.7, "who": "", "say": "An old image.", "f": false, "tape": false}, {"t0": 209.7, "t1": 215.7, "who": "", "say": "PHOTOGRAPHED · Sun Peeks Outs From Behind Clouds", "f": false, "tape": true}, {"t0": 210.2, "t1": 214.7, "who": "", "say": "Something always survives.", "f": false, "tape": false}, {"t0": 212.8, "t1": 215.7, "who": "", "say": "Rarely the thing that gets the credit.", "f": false, "tape": false}, {"t0": 215.7, "t1": 224.7, "who": "", "say": "INVENTED · drawn insert, end", "f": false, "tape": true}]]}, "08-warm-cave": {"title": "Warm Cave", "sub": "what the prisoners’ skin knew", "idea": "Scanline arrival, infrared memory", "dur": 81.25, "video": "../media/afterlight/afl-08-warm-cave.mp4", "poster": "../media/afterlight/thumbs/afl-08-warm-cave.jpg", "page": "v/08-warm-cave/", "picture": "Plato’s cave asked what the prisoners felt. Each clip arrives on a scanline; older frames glow infrared; when the source goes out the room keeps its heat. Then the twenty-four swarms wake, faster and faster, down to one ember.", "sound": "A plunderphonic score from archive recordings: a riser, a drop on the FOCUS cut, a build into the avalanche, then 1.3 s of silence.", "code": "One timeline file shared by picture and score. Each shot has a decode time and a heat value for how much of its past still glows.", "after": "A soundtrack in the manner of The Avalanches, built from archive sound. Explore the 24 swarms with no film yet. “Make this haunting and give goosebumps, hope and heat.”", "scenes": [[{"t0": 2.6, "t1": 12.8, "who": "", "say": "RUNNER · Small Steps...Giant Strides · decoded by a scanline, the past kept as infrared", "f": false, "tape": true}, {"t0": 3.6, "t1": 6.4, "who": "", "say": "Plato’s prisoners watched shadows.", "f": false, "tape": false}, {"t0": 6.8, "t1": 9.4, "who": "", "say": "The fire was behind their backs." t0": 48.8, "t1": 54.8, "who": "Cataloochee - The Center of the World", "say": "But as we reflect on those who came before, sights and sounds of an earlier time echo through this valley.", "f": false, "tape": false}, {"t0": 55.6, "t1": 56.5, "who": "Party Magic (Beich Screen Ad--\"Whiz\" Bar)", "say": "only an echo.", "f": false, "tape": false}], [{"t0": 56.2, "t1": 68.8, "who": "", "say": "THE AVALANCHE · twenty-four swarms, layered, two or three glowing at once", "f": false, "tape": true}, {"t0": 70.2, "t1": 71.2, "who": "", "say": "Good night.", "f": false, "tape": false}, {"t0": 70.8, "t1": 77.3, "who": "", "say": "AFTERLIGHT", "f": true, "tape": false}, {"t0": 77.3, "t1": 82.8, "who": "", "say": "A FILM CONCEPT BY SOSUKE & WATSON · CRASH LAB · PAELEO · CINEOSIS LAB", "f": false, "tape": true}]]}, "02-cold-hand": {"title": "The Cold Hand", "sub": "case 04, the square receptacle", "idea": "A score of six choices", "dur": 38.01, "video": "../media/afterlight/afl-02-cold-hand.mp4", "poster": "../media/afterlight/thumbs/afl-02-cold-hand.jpg", "page": "v/02-cold-hand/", "picture": "A bronze mirror, the fangzhu, set out under the moon to gather dew, in silhouette theatre. One red material for the teller, who names the moon as the cause.", "sound": "Six timed choices of a hand, each landing within a few hundredths of a second of the score.", "code": "The scene can be rendered again under different conditions: take the moon away, clear every cloud, remove the teller. The page tests that the teller’s marks never touch the world.", "after": "“Uninspired and unwatchable.” Make it a story that can be rendered again and again across all the cases.", "scenes": [[{"t0": 0.2, "t1": 3, "who": "", "say": "The Cold Hand", "f": true, "tape": false}, {"t0": 0.6, "t1": 3, "who": "", "say": "afterlight · case 04 · the square receptacle · 方諸", "f": false, "tape": true}, {"t0": 4.0, "t1": 4.9, "who": "", "say": "CHOICE 1 · Reaches for the brightest thing.", "f": false, "tape": true}, {"t0": 4.1, "t1": 7.5, "who": "", "say": "The full moon. Nothing reaches the hand.", "f": false, "tape": false}, {"t0": 6.4, "t1": 7.3, "who": "", "say": "CHOICE 2 · Holds still, hand open.", "f": false, "tape": true}, {"t0": 6.5, "t1": 9.9, "who": "", "say": "Moonlight on the palm. No warmth, no water.", "f": false, "tape": false}, {"t0": 10.5, "t1": 11.4, "who": "", "say": "CHOICE 3 · Turns its back on the bright thing.", "f": false, "tape": true}, {"t0": 10.6, "t1": 14.0, "who": "", "say": "Lifts the square bronze mirror to face the open sky.", "f": false, "tape": false}, {"t0": 17.7, "t1": 18.6, "who": "", "say": "CHOICE 4 · Receives what the case delivers.", "f": false, "tape": true}, {"t0": 17.8, "t1": 21.2, "who": "", "say": "Touches the plate and finds it dry. The dew dried off under cloud while the moon shone. The metal is barely cool; the open hand lingers and withdraws with nothing.", "f": false, "tape": false}, {"t0": 22.0, "t1": 22.9, "who": "", "say": "CHOICE 5 · Is told the cause.", "f": false, "tape": true}, {"t0": 22.1, "t1": 25.5, "who": "", "say": "The official names the moon while the moon is behind a cloud and the dew runs. He tips the plate into his vessel with its rim.", "f": false, "tape": false}, {"t0": 26.8, "t1": 27.7, "who": "", "say": "CHOICE 6 · Covers, closes, or switches off.", "f": false, "tape": true}, {"t0": 26.9, "t1": 30.3, "who": "", "say": "After asking with an open hand and getting nothing, covers the plate. No more water for the hall. Dew stops, though the moon is back.", "f": false, "tape": false}], [{"t0": 35.0, "t1": 38, "who": "", "say": "The dew comes from a clear night sky. The moon gets the credit.", "f": false, "tape": false}]]}, "05-small-sun": {"title": "Small Sun", "sub": "the stone that remembered", "idea": "Warmth kept in a stone", "dur": 151.02, "video": "../media/afterlight/afl-05-small-sun.mp4", "poster": "../media/afterlight/thumbs/afl-05-small-sun.jpg", "page": "v/05-small-sun/", "picture": "A child, her grandm IS LAB", "f": false, "tape": true}]]}, "11-light-alone": {"title": "Light Alone", "sub": "nothing but space, light and warmth", "idea": "One field of embers in wind", "dur": 78.0, "video": "../media/afterlight/afl-11-light-alone.mp4", "poster": "../media/afterlight/thumbs/afl-11-light-alone.jpg", "page": "v/11-light-alone/", "picture": "Only light. A fire bed below the frame feeds one field of embers in wind. Each voice is drawn as a thread of light traced from its own waveform.", "sound": "The song drives the field: the kick spawns, the hat sparks, the bass lifts. A close Kokoro voice leads; archive voices answer.", "code": "A particle simulation with curl-noise wind, deterministic per render worker; section changes set its speed.", "after": "The animations don’t correspond and the words are “sort of meaningless.” Make it react to the beat, “no sense of anything but space and light and warmth,” led by better voices or a Kokoro script.", "scenes": [[{"t0": 0.05, "t1": 2.5, "who": "", "say": "SONG · A · intro: embers gather above the fire bed", "f": false, "tape": true}, {"t0": 0.8, "t1": 4.2, "who": "The voice", "say": "Every light you have ever seen had already left.", "f": false, "tape": false}, {"t0": 4.4, "t1": 7.5, "who": "The voice", "say": "The sun on your face is eight minutes old.", "f": false, "tape": false}, {"t0": 7.5, "t1": 9.68, "who": "Legacy for Wings", "say": "When the Earth was already old...", "f": false, "tape": false}, {"t0": 10.2, "t1": 12.7, "who": "The voice", "say": "Before lamps, there was the dark.", "f": false, "tape": false}, {"t0": 12.7, "t1": 16.06, "who": "How Man Made Day", "say": "Man was using fire to create light.", "f": false, "tape": false}, {"t0": 16.4, "t1": 19.8, "who": "The voice", "say": "A stone left in the sun gives the afternoon back at night.", "f": false, "tape": false}, {"t0": 20.7, "t1": 22.78, "who": "Fire, 1946", "say": "Finally, the branches begin to burn.", "f": false, "tape": false}, {"t0": 22.45, "t1": 24.9, "w 4 semitones and crushed to 12 bits, over dry 88 bpm boom-bap. Two sung phrases from Copper Glow, one per four bars. Reverb only in the dome.", "code": "compose.py logs every hit to score.json; render.py draws each frame from that log with no state between frames. The caustics are computed by refracting a grid of rays through a moving water surface.", "after": "“The mix of all of them … is crowded and the video is too dark.” Think like the One-Note Soul Prism genome: one radiant strike refracted by pitch over raw boom-bap; and like a sunset set by the sea, embers rising into stars, sun glitter, caustic nets of light.", "scenes": [[{"t0": 0.65, "t1": 3.1, "who": "I", "say": "One strike", "f": true, "tape": false}, {"t0": 1.0, "t1": 6.6, "who": "", "say": "The first second of Warm Dome & Golden Record, needle-dropped on its own, with room between.", "f": false, "tape": false}, {"t0": 1.6, "t1": 8.6, "who": "", "say": "A PALE PAPER GROUND. ONE SUN. EACH STRIKE THROWS SPARKS AND A RING OF LIGHT.", "f": false, "tape": true}], [{"t0": 11.56, "t1": 14.01, "who": "II", "say": "The prism", "f": true, "tape": false}, {"t0": 11.91, "t1": 17.51, "who": "", "say": "The strike splits into three pitches: as found, two semitones down, four down.", "f": false, "tape": false}, {"t0": 12.51, "t1": 19.51, "who": "", "say": "THE SUN SPLITS INTO THREE LIGHTS, ONE PER PITCH, EACH WITH ITS OWN BEAM.", "f": false, "tape": true}], [{"t0": 22.47, "t1": 24.92, "who": "III", "say": "The drop", "f": true, "tape": false}, {"t0": 22.82, "t1": 28.42, "who": "", "say": "Dry boom-bap at 88 bpm under the figure; the kick is the kick from Sun in Your Eyes.", "f": false, "tape": false}, {"t0": 23.42, "t1": 30.42, "who": "", "say": "A SUNSET OVER THE SEA. THE KICK FLASHES THE GLITTER PATH; EACH SNARE THROWS SPARKS UP OFF THE WATER.", "f": false, "tape": true}, {"t0": 31.96, "t1": 33.62, "who": "Copper Glow, 0:45.9", "say": "carry the glow", "f": false, "tape": false}, {"t0": 42.87, "t1": 44.56, "who": "Copper Glow, 2:17.1", "say": "golden record", "f": false, "tape": false}], [{"t0": 44.29, "t1": 46.74, "who": "IV", "say": "The call", "f": true, "tape": false}, {"t0": 44.64, "t1": 50.24, "who": "", "say": "Copper Glow answers once every four bars, never two phrases at once.", "f": false, "tape": false}, {"t0": 45.24, "t1": 52.24, "who": "", "say": "DUSK. A FIRE BELOW THE FRAME; EMBERS RISE INTO THE STARS; EACH SUNG PHRASE WRITES A STREAM OF SPARKS.", "f": false, "tape": true}, {"t0": 53.78, "t1": 55.44, "who": "Copper Glow, 0:45.9", "say": "carry the glow", "f": false, "tape": false}, {"t0": 64.69, "t1": 66.38, "who": "Copper Glow, 2:17.1", "say": "golden record", "f": false, "tape": false}], [{"t0": 66.1, "t1": 68.55, "who": "V", "say": "The dome", "f": true, "tape": false}, {"t0": 66.45, "t1": 72.05, "who": "", "say": "Drums out. The dome itself comes back under the figure an octave down, with the only reverb in the track.", "f": false, "tape": false}, {"t0": 67.05, "t1": 74.05, "who": "", "say": "UNDER WATER: A NET OF CAUSTIC LIGHT. EMBERS SINK AND CATCH ON THE NET.", "f": false, "tape": true}], [{"t0": 77.01, "t1": 79.46, "who": "VI", "say": "The return", "f": true, "tape": false}, {"t0": 77.36, "t1": 82.96, "who": "", "say": "Everything at once: the sea, the fire, the net of light.", "f": false, "tape": false}, {"t0": 77.96, "t1": 84.96, "who": "", "say": "THE SEA AT SUNSET WITH THE FIRE’S EMBERS OVER IT AND CAUSTICS ON THE WATER.", "f": false, "tape": true}, {"t0": 86.51, "t1": 88.17, "who": "Copper Glow, 0:45.9", "say": "carry the glow", "f": false, "tape": false}, {"t0": 97.42, "t1": 99.11, "who": "Copper Glow, 2:17.1", "say": "golden record", "f": false, "tape": false}], [{"t0": 98.83, "t1": 101.28, "who": "VII", "say": "One note", "f": true, "tape": false}, {"t0": 99.18, "t1": 104.78, "who": "", "say": "Back to the single strike, left ringing.", "f": false, "tape": false}, {"t0": 99.78, "t1": 106.78, "who": "", "say": "THE PAPER AGAIN, AND THE ONE SUN.", " function tocRows(cur) {
  let rows = '';
  GROUPS.forEach((g, gi) => {
    rows += `<header class="gh"><span class="sc">${esc(g.label)}</span>${g.title ? `<h3>${esc(g.title)}</h3>` : ''}<p>${esc(g.blurb)}</p></header>`;

/* ================= a chapter =================

      <section class="after"><h2 class="sc">On the film</h2><dl>
        <dt class="sc">Picture</dt><dd>${esc(f.picture)}</dd><dt class="sc">Sound</dt><dd>${esc(f.sound)}</dd>
        <dt class="sc">How it was made</dt><dd>${esc(f.code)}</dd><dt class="sc">The note that asked for it</dt><dd>${esc(f.after)}</dd></dl>
        <p class="more"><a href="${f.page}">The prompts, process images, critics and code</a></p></section>
      ${next ? `<a class="nextcard" href="#/${next}"><span class="sc">Next chapter · ${NUM[next]}</span><h3>${esc(D.films[next].title)}</h3><p>${esc(D.films[next].sub)}</p><img src="${D.films[next].poster}" alt="" loading="lazy"></a>` : `<a class="nextcard" href="#/"><span class="sc">The end of the filmed chapters</span><h3>Contents</h3><p>the instrument and the storyboard come before the films</p></a>`}
    </article>`;

  const v = $('#v'), ch = $('#ch'), els = $$('#text p, #text .gap'), ps = $$('#text p'), pr = $('#pr'), tc = $('#tc'), pb = $('#pb'), cap = $('#cap'), hint = $('#hint');
  // ---------- the map between page position and film time ----------
  let A = [];   // [{y, t}] sorted
  const layout = () => {
    A = [];
    for (const el of els) { const r = el.getBoundingClientRect(), y = r.top + scrollY;
      if (el.classList.contains('gap')) { A.push({ y, t: +el.dataset.t0 }); A.push({ y: y + r.height, t: +el.dataset.t1 }); }
      else { const l = flat[+el.dataset.j]; A.push({ y, t: l.t0 }); } }
    A.sort((a, b) => a.y - b.y);
    for (let k = 1; k < A.length; k++) if (A[k].t < A[k - 1].t) A[k].t = A[k - 1].t;
  };
  const off = () => { if (!A.length) return 0; const o = Math.max(0, scrollY * 0 + readY() + 0 - (A[0].y - 0)); return o * Math.max(0, 1 - scrollY / Math.max(200, A[0].y)); };
  const tAt = (y) => { if (!A.length || y <= A[0].y) return 0; for (let k = 1; k < A.length; k++) if (y < A[k].y) { const a = A[k - 1], b = A[k]; return a.t + (b.t - a.t) * (y - a.y) / Math.max(1, b.y - a.y); } return f.dur; };
  const yAt = (t) => { if (!A.length) return 0; if (t <= A[0].t) return A[0].y; for (let k = 1; k < A.length; k++) if (t < A[k].t) { const a = A[k - 1], b = A[k]; return a.y + (b.y - a.y) * (t - a.t) / Math.max(1e-6, b.t - a.t); } return A[A.length - 1].y; };
  const readY = () => { if (innerWidth < 900) { const s = $('.screen').getBoundingClientRect(); return s.bottom + (innerHeight - s.bottom) * 0.3; } return innerHeight * 0.42; };
  // ---------- showing a time on the page ----------
  let lastNow = -1;
  const show = (t) => {
    for (const p of ps) p.classList.toggle('said', flat[+p.dataset.j].t0 <= t + 0.05);
    for (const g of $$('#text .gap')) g.classList.toggle('said', +g.dataset.t1 <= t + 0.05);
    let now = -1; for (let j = 0; j < flat.length; j++) { if (flat[j].tape) continue; if (flat[j].t0 <= t + 0.05) now = j; }
    if (now !== lastNow) { $$('#text p.now').forEach((p) => p.classList.remove('now')); const p = ps.find((q) => +q.dataset.j === now); if (p) p.classList.add('now'); lastNow = now; }
    let live = null; for (const l of flat) if (!l.tape && t >= l.t0 - 0.05 && t <= l.t1 + 0.5) live = l;
    cap.innerHTML = live ? `${live.who ? `<span class="w">${esc(live.who)}</span>` : ''}${esc(live.say)}` : '';
    tc.textContent = `${mmss(t)} / ${mmss(f.dur)}`; pr.style.width = (100 * t / f.dur).toFixed(2) + '%';
    if (t > store.get('afl-p-' + slug, 0)) store.set('afl-p-' + slug, Math.round(t));
  };
  // ---------- scroll moves the film ----------
  let target = 0, seeking = false, idle = 0, following = false, primed = false;
  const seek = (t, exact) => {
    target = t; if (seeking && !exact) return;
    if (Math.abs(v.currentTime - t) < 0.03) return;
    seeking = true;
    if (!exact && v.fastSeek && Math.abs(v.currentTime - t) > 2.5) v.fastSeek(t); else v.currentTime = t;
  };
  v.addEventListener('seeked', () => { seeking = false; if (!following && Math.abs(v.currentTime - target) > 0.05) seek(target, true); });
  const prime = () => { if (primed) return; primed = true; const p = v.play(); if (p) p.then(() => { if (!following) v.pause(); }).catch(() => {}); };
  let raf = 0;
  const onScroll = () => {
    if (following || ch.classList.contains('m-film')) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const t = tAt(scrollY + readY() - off()); show(t); seek(t, false); clearTimeout(idle); idle = setTimeout(() => seek(t, true), 160); });
  };
  // ---------- play moves the page ----------
  let fr = 0, autoY = -1;
  const follow = () => {
    const t = v.currentTime; show(t);
    if (!ch.classList.contains('m-film')) { const y = Math.max(0, yAt(t) - readY()); autoY = y; scrollTo(0, y); }
    fr = requestAnimationFrame(follow);
  };
  const play = () => { primed = true; v.muted = false; following = true; pb.classList.add('on'); pb.setAttribute('aria-label', 'Pause'); hint.textContent = 'Scroll to take the film back'; v.play().catch(() => { stop(); }); cancelAnimationFrame(fr); follow(); };
  const stop = () => { following = false; v.pause(); cancelAnimationFrame(fr); pb.classList.remove('on'); pb.setAttribute('aria-label', 'Play'); hint.textContent = 'Scroll to move through the film'; };
  pb.addEventListener('click', () => (following ? stop() : play()));
  v.addEventListener('ended', stop);
  const userMove = () => { prime(); if (following && !ch.classList.contains('m-film')) stop(); };
  addEventListener('wheel', userMove, { passive: true }); addEventListener('touchstart', userMove, { passive: true });
  const onKey = (e) => { if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End'].includes(e.key)) userMove(); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); following ? stop() : play(); } };
  addEventListener('keydown', onKey);
  addEventListener('scroll', onScroll, { passive: true });
  ps.forEach((p) => p.addEventListener('click', () => { const l = flat[+p.dataset.j]; stop(); scrollTo({ top: Math.max(0, yAt(l.t0) - readY()), behavior: 'smooth' }); }));
  // ---------- modes, contents, resize ----------
  const setMode = (m) => { ch.classList.toggle('m-film', m === 'film'); ch.classList.toggle('m-book', m !== 'film'); $$('.modes button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === m)); store.set('afl-mode', m);
    v.controls = m === 'film'; hint.style.display = m === 'film' ? 'none' : ''; requestAnimationFrame(() => { layout(); if (m !== 'film' && !following) onScroll(); }); };
  $$('.modes button').forEach((b) => b.addEventListener('click', () => { const t = v.currentTime; setMode(b.dataset.m); if (b.dataset.m === 'film') { requestAnimationFrame(() => scrollTo(0, Math.max(0, $('.screen').getBoundingClientRect().top + scrollY - parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar')) - 40))); show(t); } else requestAnimationFrame(() => scrollTo(0, Math.max(0, yAt(t) - readY()))); }));
  v.addEventListener('play', () => { if (ch.classList.contains('m-film')) { following = true; v.muted = false; pb.classList.add('on'); cancelAnimationFrame(fr); follow(); } });
  v.addEventListener('pause', () => { if (ch.classList.contains('m-film')) { following = false; cancelAnimationFrame(fr); pb.classList.remove('on'); } });
  const sheet = $('#sheet'); $('#tocb').addEventListener('click', () => { sheet.classList.toggle('open'); $('#tocb .lbl').textContent = sheet.classList.contains('open') ? 'Close' : 'Contents'; $('#tocb').classList.toggle('x', sheet.classList.contains('open')); });
  const onResize = () => { layout(); if (!following) onScroll(); };
  addEventListener('resize', onResize);
  setMode(mode);
  document.fonts && document.fonts.ready.then(() => { layout(); onScroll(); });
  cleanup = () => { stop(); removeEventListener('scroll', onScroll); removeEventListener('wheel', userMove); removeEventListener('touchstart', userMove); removeEventListener('keydown', onKey); removeEventListener('resize', onResize); };
  show(0);
}

function route() {
  { const o = location.hash.match(/^#(\d\d-[\w-]+)$/); if (o) { if (D.films[o[1]]) { location.replace('#/' + o[1]); return; } location.replace('v/' + o[1] + '/'); return; } }
  if (cleanup) { cleanup(); cleanup = null; }
  const m = location.hash.match(/^#\/([\w-]+)/);
  if (m && D.films[m[1]]) chapter(m[1]); else home();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
