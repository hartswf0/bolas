<!doctype html>
<html lang="en">
<head>
<meta name="crank-mirror" content="bolas">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch · The Crank Boy</title>
<meta name="description" content="Every film of the Crank Boy and Bolas in one theatre, in watching order, each with the process behind it.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="room/room.css">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--table)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;background:var(--table)}
a{color:var(--ink);text-decoration-color:var(--red);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:6px 16px 60px}
h1{font-size:34px;margin:8px 0 2px}.lede{max-width:70ch;margin:4px 0 14px;color:#4a3f36}
.theatre{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:22px;align-items:start}
.stage{position:sticky;top:8px;min-width:0}
.screen{background:#000;border:1.5px solid var(--ink);aspect-ratio:16/9;width:100%;display:block}
.screen video,.screen img{width:100%;height:100%;object-fit:contain;display:block}
.nowline{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;margin:8px 0 2px}
.nowline h2{font-size:25px;line-height:1.1}
.tag{font-family:var(--display);font-size:13px;letter-spacing:.06em;background:var(--red);color:#fff;padding:1px 8px}
.meta{color:var(--muted);font-size:14.5px}
.btn{font-family:var(--display);letter-spacing:.05em;border:1.5px solid var(--ink);background:var(--paper);padding:5px 12px;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{background:var(--wall)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.how{border-left:3px solid var(--red);padding:2px 12px;margin:8px 0;font-style:italic}
.proc{background:var(--paper);border:1.5px solid var(--ink);padding:10px 16px 12px;margin-top:10px}
.proc h3{font-size:19px;margin-bottom:4px}
.proc ol{margin:4px 0 8px 20px;padding:0}.proc li{margin:3px 0}
.proc .k{font-family:var(--display);font-size:13.5px;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.list{min-width:0}
.list h2{font-size:21px;margin:18px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
.list h2:first-child{margin-top:0}
.list h3{font-size:16.5px;margin:12px 0 0}.list .wl{font-size:14.5px;color:var(--muted);margin:0 0 4px}
.it{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(43,35,32,.18);padding:6px 4px;align-items:start}
.it:hover{background:rgba(255,255,255,.35)}.it[aria-current=true]{background:var(--paper);box-shadow:inset 4px 0 0 var(--red)}
.it img{width:96px;aspect-ratio:16/9;object-fit:cover;background:#cbbd9c;border:1px solid var(--ink);display:block}
.it b{font-family:var(--display);font-weight:400;font-size:15.5px;line-height:1.12;display:block}
.it span{font-size:13.5px;color:var(--muted)}
.auto{display:inline-flex;gap:6px;align-items:center;font-size:14.5px}
@media (max-width:860px){.theatre{grid-template-columns:1fr}.stage{position:static}}
</style>
</head>
<body>
<script src="room/site.js" data-root="" data-here="watch"></script>
<main class="wrap">
<h1>Watch</h1>
<p class="lede">Every film in one place, in the order to watch them, with the process under each one. Films that belong together are numbered; each says how it follows the one before. Bolas films stream from Bolas.</p>
<div class="theatre">
<section class="stage" aria-label="Player">
 <div class="screen" id="screen"></div>
 <div class="nowline"><span class="tag" id="role"></span><h2 id="title"></h2></div>
 <div class="meta" id="facts"></div>
 <p class="how" id="how" hidden></p>
 <p id="line"></p>
 <div class="acts" id="acts"></div>
 <label class="auto"><input type="checkbox" id="auto" checked> Play the next film automatically</label>
 <div class="proc" id="proc"></div>
</section>
<nav class="list" id="list" aria-label="Playlist"></nav>
</div>
</main>
<script src="registry/films.js"></script>
<script>
(() => {
const F = window.CRANK_FILMS, S = window.CRANK_SITE, BOLAS = S.bolas;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const FBY = Object.fromEntries(F.films.map(f => [f.id, f]));
const fmt = d => { d = Math.round(d || 0); return Math.floor(d / 60) + ':' + String(d % 60).padStart(2, '0'); };
const src = f => f.src ? (f.src.local ? S.root + f.src.local : BOLAS + f.src.bolas) : null;
const hrefOf = l => l.href ? (l.href.startsWith('http') ? l.href : S.root + l.href.replace(/^index\.html/, S.mirror ? 'album.html' : 'index.html')) : BOLAS + l.bolas;
const playable = f => !!src(f);
// playlist order: each group, its works in order, then its single films
const order = [];
const sections = F.groups.map(g => {
  const inG = F.films.filter(f => f.group === g.id && playable(f));
  const ws = (F.works || []).filter(w => w.group === g.id).map(w => ({ w, fs: w.members.map(m => FBY[m]).filter(playable) }));
  const inW = new Set(ws.flatMap(x => x.fs.map(f => f.id)));
  const singles = inG.filter(f => !inW.has(f.id));
  [...ws.flatMap(x => x.fs), ...singles].forEach(f => order.push(f));
  return { g, ws, singles };
}).filter(s => s.ws.length || s.singles.length);
const item = f => `<button type="button" class="it" data-id="${esc(f.id)}"><img src="${esc(S.root + f.thumb)}" alt="" loading="lazy"><div><b>${f.step ? f.step + '. ' : ''}${esc(f.role || f.title)}</b><span>${f.role ? esc(f.title) + ' · ' : ''}${fmt(f.dur)}</span></div></button>`;
$('list').innerHTML = sections.map(({ g, ws, singles }) => `<h2>${esc(g.title)}</h2>` + ws.map(x => `<h3>${esc(x.w.title)}</h3><p class="wl">${x.fs.length} films in order</p>` + x.fs.map(item).join('')).join('') + (ws.length && singles.length ? `<h3>Other films</h3>` : '') + singles.map(item).join('')).join('');
function steps(f) {
  const m = f.made, links = (f.links || []).filter(l => /how it was made|notes|composition|method|call sheets/i.test(l.label));
  let h = `<h3>How it was made</h3>`;
  if (m) {
    h += `<div class="meta">${esc(m.op)}${m.plates && m.plates.length ? ' · archive: ' + esc(m.plates.join(', ')) : ''}</div><ol>${m.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
    if (m.critic) h += `<div class="k">THE CRITIC SAID (${esc(m.critic.verdict)})</div><div>${esc(m.critic.found)} <i>Fixed: ${esc(m.critic.fixed)}</i></div>`;
    if (m.learned) h += `<div class="k">WHAT WE LEARNED</div><div>${esc(m.learned)}</div>`;
  } else h += `<div>${esc(f.line)}</div>` + (f.cast && f.cast.length ? `<div class="k">CAST</div><div>${esc(f.cast.join(', '))}</div>` : '');
  h += `<div class="acts">${links.map(l => `<a class="btn" href="${esc(hrefOf(l))}">${esc(l.label)}</a>`).join('')}</div>`;
  if (!m) h += `<div class="meta">The full process, with every prompt, critic round and sheet, is on the Bolas pages above.</div>`;
  return h;
}
let cur = null;
function show(id, go) {
  const f = FBY[id] && playable(FBY[id]) ? FBY[id] : order[0]; cur = f;
  const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.poster = S.root + f.thumb; v.src = src(f); v.setAttribute('aria-label', f.title);
  v.onended = () => { if ($('auto').checked) { const n = order[order.indexOf(f) + 1]; if (n) show(n.id, true); } };
  $('screen').replaceChildren(v); if (go) v.play().catch(() => {});
  $('role').textContent = f.role || ({ short: 'Short', proof: 'Proof scene', cartoon: 'Cartoon', game: 'Game, played' }[f.kind] || 'Film'); $('title').textContent = f.title;
  $('facts').textContent = [fmt(f.dur), f.date, f.mb ? f.mb + ' MB' : ''].filter(Boolean).join(' · ') + (f.work ? ' · part ' + f.step + ' of ' + f.of : '');
  $('how').hidden = !f.how; $('how').textContent = f.how || ''; $('line').textContent = f.line;
  const w = f.work && F.works.find(x => x.id === f.work), i = order.indexOf(f), p = order[i - 1], n = order[i + 1];
  $('acts').innerHTML = (p ? `<button class="btn" data-go="${esc(p.id)}">← Before</button>` : '') + (n ? `<button class="btn" data-go="${esc(n.id)}">Next →</button>` : '') + (w ? `<a class="btn" href="films.html#w:${esc(w.id)}">The whole work</a>` : '');
  $('proc').innerHTML = steps(f);
  document.querySelectorAll('.it').forEach(b => b.setAttribute('aria-current', b.dataset.id === f.id ? 'true' : 'false'));
  history.replaceState(null, '', '#' + f.id); document.title = f.title + ' · Watch · The Crank Boy';
}
document.addEventListener('click', e => { const b = e.target.closest('[data-id],[data-go]'); if (!b) return; show(b.dataset.id || b.dataset.go, true); if (innerWidth < 860) $('screen').scrollIntoView({ block: 'start' }); });
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
})();
</script>
</body>
</html>
