<!doctype html>
<html lang="en">
<head>
<meta name="crank-mirror" content="bolas">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Films · The Crank Boy</title>
<meta name="description" content="Every film in the Crank Boy and in Bolas, in one place: the opening film, the Futuretown shorts and the Town, the crash-test family, CINEOSIS, the Found Odyssey and WYGWYL.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="stylesheet" href="room/room.css">
<style>
@font-face{font-family:'IM Fell English';src:url(assets/shorts/fonts/IMFellEnglish.ttf) format('truetype');font-display:swap}
@font-face{font-family:'IM Fell English SC';src:url(assets/shorts/fonts/IMFellEnglishSC.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--table)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;background:var(--table)}
a{color:var(--ink);text-decoration-color:var(--red);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:6px 16px 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0}
h1{font-size:36px;margin:8px 0 2px}
.lede{max-width:70ch;margin:4px 0 14px;color:#4a3f36}
.sum{font-family:var(--display);font-size:14px;color:var(--muted);letter-spacing:.05em}

/* controls */
.tools{position:sticky;top:0;z-index:5;background:var(--table);padding:8px 0 10px;border-bottom:1px solid rgba(43,35,32,.18);margin-bottom:6px}
.row{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
.search{flex:1 1 220px;min-width:0;font:inherit;border:1.5px solid var(--ink);background:var(--paper);padding:6px 10px;color:var(--ink)}
.sel{font:inherit;font-size:15px;border:1.5px solid var(--ink);background:var(--paper);padding:5px 8px;color:var(--ink)}
.btn,.chip{font-family:var(--display);letter-spacing:.05em;border:1.5px solid var(--ink);background:var(--paper);padding:5px 12px;font-size:14px;text-decoration:none;display:inline-block;box-shadow:2px 2px 0 var(--ink)}
.chip{box-shadow:none;border-radius:999px;padding:3px 11px;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip i{font-style:normal;opacity:.65;margin-left:5px}
.btn:hover{background:var(--wall)}
.seg{display:inline-flex}.seg button{border:1.5px solid var(--ink);background:var(--paper);padding:4px 10px;font-family:var(--display);font-size:13.5px}.seg button+button{border-left:0}.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* sections and cards */
.group{margin:26px 0 0;--c:var(--red)}
.group>header{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;border-bottom:3px solid var(--c);padding-bottom:4px;margin-bottom:14px}
.group h2{font-size:25px}
.group header p{margin:0;font-size:15px;color:#4a3f36;flex:1 1 300px}
.group header a{font-family:var(--display);font-size:13.5px;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.film{display:flex;flex-direction:column;gap:5px;min-width:0;--c:var(--red)}
.poster{position:relative;display:block;width:100%;padding:0;border:1.5px solid var(--ink);background:#1e1713;aspect-ratio:16/10;overflow:hidden;box-shadow:3px 3px 0 var(--ink)}
.poster img{display:block;width:100%;height:100%;object-fit:cover}
.poster:hover img{filter:brightness(1.08)}
.poster .play{position:absolute;left:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(243,236,216,.92);display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink)}
.poster .play::after{content:"";margin-left:3px;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
.poster .dur{position:absolute;right:8px;bottom:8px;font-family:var(--display);font-size:13px;background:rgba(30,23,19,.85);color:var(--paper);padding:1px 7px}
.poster .kind{position:absolute;left:8px;top:8px;font-family:var(--display);font-size:11.5px;letter-spacing:.08em;background:var(--c);color:#fff;padding:1px 7px}
.poster.ph{display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink)}
.poster.ph svg{width:46%;height:auto}
.film h3{font-size:18.5px;line-height:1.12}
.film h3 button{text-align:left;background:none;border:0;padding:0;font:inherit;letter-spacing:inherit}
.film h3 button:hover{text-decoration:underline;text-decoration-color:var(--red)}
.film .m{font-family:var(--display);font-size:12.5px;letter-spacing:.05em;color:var(--muted)}
.film p{margin:0;font-size:14.5px;line-height:1.38;color:#3d332b;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.film .ls{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13.5px}
.list .grid{grid-template-columns:1fr;gap:14px}
.list .film{flex-direction:row;gap:14px;align-items:flex-start}
.list .film .poster{flex:0 0 190px;width:190px}
.list .film .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.list .film p{-webkit-line-clamp:3}
.empty{padding:30px 0;color:var(--muted);font-style:italic}

/* player */
dialog{width:min(960px,96vw);max-height:96dvh;padding:0;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink);overflow:auto}
dialog::backdrop{background:rgba(30,23,19,.72)}
dialog video{display:block;width:100%;background:#000;aspect-ratio:16/9;max-height:62dvh}
.pl-body{padding:12px 16px 14px;display:grid;gap:8px}
.pl-top{display:flex;gap:10px;align-items:flex-start}
.pl-top h2{font-size:24px;line-height:1.1;flex:1}
.pl-meta{font-family:var(--display);font-size:13.5px;letter-spacing:.05em;color:var(--muted)}
.pl-line{margin:0;max-width:75ch}
.pl-facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:15px}
.pl-facts dt{font-family:var(--display);font-size:12.5px;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.pl-facts dd{margin:0}
.pl-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl-nav label{font-size:14.5px;display:flex;gap:6px;align-items:center}
.pl-err{border-left:3px solid var(--red);padding:2px 10px;background:#fbf0e6;font-size:15px}
.foot{margin-top:40px;font-size:14.5px;color:#4a3f36;max-width:80ch}
@media (max-width:700px){
  h1{font-size:28px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px 12px}
  .film h3{font-size:16px}.film p{-webkit-line-clamp:3;font-size:13.5px}
  .list .film .poster{flex-basis:128px;width:128px}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border:0;box-shadow:none;margin:0}
  dialog video{max-height:40dvh}
  .tools{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script src="room/site.js" data-root="" data-here="films"></script>
<div class="wrap">
<h1>Films</h1>
<p class="lede" id="lede"></p>
<p class="sum" id="sum" aria-live="polite"></p>

<div class="tools">
  <div class="row"><input class="search" id="q" type="search" placeholder="Search titles, lines, operators, archive films, cast" aria-label="Search the films" autocomplete="off">
    <select class="sel" id="kind" aria-label="Kind"></select>
    <select class="sel" id="sort" aria-label="Sort"><option value="group">By program</option><option value="new">Newest first</option><option value="long">Longest first</option><option value="az">A to Z</option></select>
    <span class="seg" role="group" aria-label="Layout"><button type="button" id="lg" aria-pressed="true">Grid</button><button type="button" id="ll" aria-pressed="false">List</button></span>
    <button class="btn" type="button" id="playall">Play all shown</button></div>
  <div class="row" id="chips" role="group" aria-label="Programs"></div>
</div>

<main id="out"></main>

<p class="foot" id="foot"></p>
</div>

<dialog id="pl" aria-label="Film player">
  <video id="pv" controls playsinline preload="metadata"></video>
  <div class="pl-body">
    <div class="pl-top"><h2 id="pt"></h2><button class="btn" type="button" id="pc">Close</button></div>
    <div class="pl-meta" id="pm"></div>
    <p class="pl-line" id="pline"></p>
    <div class="pl-err" id="perr" hidden></div>
    <dl class="pl-facts" id="pf"></dl>
    <div class="pl-nav"><button class="btn" type="button" id="pp">Previous</button><button class="btn" type="button" id="pn">Next</button><label><input type="checkbox" id="pa"> Play the next film when this one ends</label></div>
  </div>
</dialog>

<script src="registry/films.js"></script>
<script>
(() => {
const F = window.CRANK_FILMS, S = window.CRANK_SITE;
const BOLAS = S.bolas;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const COLOR = { crankboy: '#C9733A', futuretown: '#B44A3C', family: '#B8901F', cineosis: '#2E8E80', odyssey: '#9A4A36', wygwyl: '#7B68B8', elsewhere: '#76685A' };
const KIND = { live: 'Live film', film: 'Film', short: 'Short', proof: 'Proof scene', cartoon: 'Cartoon', game: 'Game, played', reel: 'Reel', test: 'Test', external: 'Elsewhere' };
const G = Object.fromEntries(F.groups.map(g => [g.id, g]));
const films = F.films;
const fmt = d => { if (!d) return ''; d = Math.round(d); const h = Math.floor(d / 3600), m = Math.floor(d % 3600 / 60), s = d % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
const fmtLong = d => { const h = Math.floor(d / 3600), m = Math.round(d % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const src = f => f.src ? (f.src.local ? S.root + f.src.local : BOLAS + f.src.bolas) : null;
const hrefOf = l => l.href ? (l.href.startsWith('http') ? l.href : S.root + l.href.replace(/^index\.html/, S.mirror ? 'album.html' : 'index.html')) : BOLAS + l.bolas;
const thumb = f => f.thumb ? S.root + f.thumb : null;
const external = f => !!f.external;
const live = f => !!f.open;
const state = { q: '', group: 'all', kind: 'all', sort: 'group', layout: 'grid' };
try { const l = localStorage.getItem('crank.films.layout'); if (l === 'list') state.layout = 'list'; } catch (e) {}
const TECTI = '<svg viewBox="-14 -14 28 28" aria-hidden="true"><g fill="none" stroke="#C0573A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 0 L0 -9 L10 0 M-7.8 0 V9.5 M7.8 0 V9.5 M0 -9 V-5.5"/></g><circle cx="-3" cy="2.8" r="1" fill="#C0573A"/><circle cx="3" cy="2.8" r="1" fill="#C0573A"/></svg>';

$('lede').textContent = 'Every film we have made, in one place: the opening film and the games played by a script; the Futuretown shorts, the Town and the proof scenes; and the four programs of Bolas, the crash-test family, CINEOSIS, the Found Odyssey and WYGWYL. Pick one to watch it here.';
const playable = films.filter(f => src(f));
const totalDur = films.reduce((a, f) => a + (f.dur || 0), 0), totalMb = films.reduce((a, f) => a + (f.mb || 0), 0);
$('sum').textContent = `${films.filter(f => !external(f)).length} films · ${fmtLong(totalDur)} · ${Math.round(totalMb)} MB · ${films.filter(external).length} more elsewhere`;
$('foot').innerHTML = `The Bolas films stream from Bolas (${S.mirror ? 'this site is mirrored inside it' : '<a href="' + esc(BOLAS) + '">hartswf0.github.io/bolas</a>'}) and are not copied here. Archive footage in them comes from the cineosis-lab library and is credited inside each film. The Futuretown films use cards from <i>En l'an 2000</i> (attributed to Villemard, about 1910), plates from the same library, and doodles from Quick, Draw! (CC BY 4.0). The list is <code>registry/films.js</code>, built by <code>registry/build_films.py</code>.`;

// ---- controls
const kinds = [...new Set(films.map(f => f.kind))];
$('kind').innerHTML = '<option value="all">All kinds</option>' + kinds.map(k => `<option value="${k}">${KIND[k] || k}</option>`).join('');
function chips() {
  const n = g => films.filter(f => g === 'all' || f.group === g).length;
  $('chips').innerHTML = [['all', 'All']].concat(F.groups.map(g => [g.id, g.title])).map(([id, t]) => `<button class="chip" type="button" data-g="${id}" aria-pressed="${state.group === id}">${esc(t)}<i>${n(id)}</i></button>`).join('');
  $('chips').querySelectorAll('button').forEach(b => b.onclick = () => { state.group = b.dataset.g; render(); });
}
$('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
$('kind').onchange = e => { state.kind = e.target.value; render(); };
$('sort').onchange = e => { state.sort = e.target.value; render(); };
$('lg').onclick = () => setLayout('grid'); $('ll').onclick = () => setLayout('list');
function setLayout(l) { state.layout = l; try { localStorage.setItem('crank.films.layout', l); } catch (e) {} render(); }

// ---- the list
const hay = f => [f.title, f.line, f.op, (f.plates || []).join(' '), (f.cast || []).join(' '), (f.tags || []).join(' '), KIND[f.kind], G[f.group].title, f.date].join(' ').toLowerCase();
const HAY = new Map(films.map(f => [f.id, hay(f)]));
let shown = [];
function filtered() {
  let r = films.filter(f => (state.group === 'all' || f.group === state.group) && (state.kind === 'all' || f.kind === state.kind) && (!state.q || state.q.split(/\s+/).every(w => HAY.get(f.id).includes(w))));
  if (state.sort === 'new') r = r.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.title.localeCompare(b.title));
  else if (state.sort === 'long') r = r.slice().sort((a, b) => (b.dur || 0) - (a.dur || 0));
  else if (state.sort === 'az') r = r.slice().sort((a, b) => a.title.localeCompare(b.title));
  return r;
}
function card(f) {
  const t = thumb(f), c = COLOR[f.group], isExt = external(f), a = isExt ? f.external : live(f) ? S.root + f.open.replace(/^index\.html/, S.mirror ? 'album.html' : 'index.html') : null;
  const poster = `<${a ? 'a href="' + esc(a) + '"' + (isExt ? ' target="_blank" rel="noopener"' : '') : 'button type="button" data-open="' + f.id + '" aria-label="Watch ' + esc(f.title) + '"'} class="poster${t ? '' : ' ph'}">${t ? `<img src="${esc(t)}" alt="" loading="lazy" width="640" height="400">` : TECTI}<span class="kind">${esc(KIND[f.kind] || f.kind)}</span>${f.dur ? `<span class="dur">${fmt(f.dur)}</span>` : ''}${isExt ? '' : '<span class="play" aria-hidden="true"></span>'}</${a ? 'a' : 'button'}>`;
  const title = a ? `<a href="${esc(a)}"${isExt ? ' target="_blank" rel="noopener"' : ''}>${esc(f.title)}${isExt ? ' ↗' : ''}</a>` : `<button type="button" data-open="${f.id}">${esc(f.title)}</button>`;
  const meta = [G[f.group].title, f.date, f.mb ? f.mb + ' MB' : ''].filter(Boolean).join(' · ');
  return `<article class="film" id="f-${f.id}" style="--c:${c}">${poster}<div class="body"><h3>${title}</h3><div class="m">${esc(meta)}</div><p>${esc(f.line)}</p></div></article>`;
}
function render() {
  shown = filtered();
  document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === state.group)));
  $('lg').setAttribute('aria-pressed', String(state.layout === 'grid')); $('ll').setAttribute('aria-pressed', String(state.layout === 'list'));
  const out = $('out'); out.className = state.layout === 'list' ? 'list' : '';
  if (!shown.length) { out.innerHTML = '<p class="empty">No film matches. Clear the search or choose All.</p>'; }
  else if (state.sort === 'group') {
    out.innerHTML = F.groups.map(g => { const fs = shown.filter(f => f.group === g.id); if (!fs.length) return '';
      const link = g.path ? `<a href="${esc(BOLAS + g.path)}">${esc(g.title)} in Bolas</a>` : '';
      return `<section class="group" style="--c:${COLOR[g.id]}" aria-label="${esc(g.title)}"><header><h2>${esc(g.title)}</h2><p>${esc(g.line)}</p>${link}</header><div class="grid">${fs.map(card).join('')}</div></section>`; }).join('');
  } else out.innerHTML = `<div class="group"><div class="grid">${shown.map(card).join('')}</div></div>`;
  out.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openFilm(b.dataset.open));
  const pl = shown.filter(f => src(f)), tot = pl.reduce((a, f) => a + (f.dur || 0), 0);
  $('playall').hidden = !pl.length; $('playall').textContent = `Play all shown (${pl.length}${tot ? ', ' + fmtLong(tot) : ''})`;
}

// ---- the player
const dlg = $('pl'), vid = $('pv');
let cur = null, queue = [];
function openFilm(id, list) {
  const f = films.find(x => x.id === id); if (!f || !src(f)) return;
  queue = (list || shown).filter(x => src(x)); if (!queue.includes(f)) queue = playable.slice();
  cur = f; $('perr').hidden = true;
  $('pt').textContent = f.title; $('pm').textContent = [KIND[f.kind], G[f.group].title, f.date, f.dur ? fmt(f.dur) : '', f.mb ? f.mb + ' MB' : ''].filter(Boolean).join(' · '); $('pline').textContent = f.line;
  const facts = [];
  if (f.op) facts.push(['Operator', f.op]);
  if (f.plates && f.plates.length) facts.push(['Archive', f.plates.join('; ')]);
  if (f.cast && f.cast.length) facts.push(['Cast', f.cast.join(', ')]);
  facts.push(['More', (f.links || []).map(l => `<a href="${esc(hrefOf(l))}">${esc(l.label)}</a>`).join(' · ') + ` · <a href="${esc(src(f))}">The file</a>`]);
  $('pf').innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${k === 'More' ? v : esc(v)}</dd>`).join('');
  const i = queue.indexOf(f); $('pp').disabled = i <= 0; $('pn').disabled = i >= queue.length - 1;
  vid.poster = thumb(f) || ''; vid.src = src(f);
  if (!dlg.open) dlg.showModal();
  vid.play().catch(() => {});
  history.replaceState(null, '', '#' + f.id);
}
vid.addEventListener('error', () => { if (!cur) return; const e = $('perr'); e.hidden = false;
  e.innerHTML = `This film could not be loaded here. It lives in ${cur.src.bolas ? 'Bolas' : 'this repository'}: <a href="${esc(src(cur))}">open the file</a>${cur.src.bolas ? ' or <a href="' + esc(BOLAS + 'films/' + cur.id + '/') + '">its page in Bolas</a>' : ''}.`; });
function step(d) { const i = queue.indexOf(cur) + d; if (i >= 0 && i < queue.length) openFilm(queue[i].id, queue); }
$('pp').onclick = () => step(-1); $('pn').onclick = () => step(1);
vid.addEventListener('ended', () => { if ($('pa').checked) step(1); });
$('pc').onclick = () => dlg.close();
dlg.addEventListener('close', () => { vid.pause(); vid.removeAttribute('src'); vid.load(); cur = null; history.replaceState(null, '', location.pathname + location.search); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('keydown', e => { if (e.key === 'ArrowRight' && e.altKey) step(1); if (e.key === 'ArrowLeft' && e.altKey) step(-1); });
$('playall').onclick = () => { const pl = shown.filter(f => src(f)); if (!pl.length) return; $('pa').checked = true; openFilm(pl[0].id, pl); };

// ---- start: #film-id opens a film; #g:program filters
chips(); render();
const h = decodeURIComponent(location.hash.slice(1));
if (h.startsWith('g:') && G[h.slice(2)]) { state.group = h.slice(2); render(); }
else if (h && films.some(f => f.id === h && src(f))) openFilm(h, films.filter(src));
})();
</script>
</body>
</html>
