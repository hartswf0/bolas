<!doctype html>
<html lang="en">
<head>
<meta name="crank-mirror" content="bolas">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Town · seven cards, one crank</title>
<meta name="description" content="The seven En l'an 2000 cards as one playable world, joined by a drawn power line from the crank boy's machine. Each card is a game.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/favicon-180.png">
<link rel="stylesheet" href="../room/room.css">
<link rel="stylesheet" href="shorts.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100dvh}
.play{display:flex;flex-direction:column;gap:8px;max-width:1040px;width:100%;margin:0 auto;padding:10px 16px 16px;flex:1}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:24px;margin:0 auto 0 0}
canvas#stage{touch-action:none;cursor:crosshair}
.deck{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start}
.deck>div{min-width:0}
.cast select{max-width:100%}
#wheelbox{display:flex;flex-direction:column;align-items:center;gap:2px}
#dial{width:170px;height:170px;touch-action:none;cursor:grab;display:block;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wcap{display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap}.wcap .up{color:#A5452B}.wcap .dn{color:#4C7448}
.screen{display:block}
#dial:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:50%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;padding:4px 8px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.goal{font-size:16px;margin:2px 0}
.op{font-family:var(--display);font-size:14px;color:var(--red);margin:0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ctl button{font-size:16px;padding:8px 14px;touch-action:none}
.cast{display:flex;gap:6px;align-items:center;font-family:var(--display);font-size:14px;flex-wrap:wrap}
.cast select{font-family:var(--body);font-size:15px;border:1.5px solid var(--ink);background:var(--paper);padding:2px 4px}
.help{font-size:14px;color:var(--muted);margin:4px 0 0}
@media (max-width:760px){
html,body{background:#e6e0d0}
.play{padding:8px 10px 0;gap:8px}
.bar h1{font-size:19px}.bar .btn{font-size:13px;padding:3px 9px}
.screen{background:#17181a;border-radius:20px;padding:9px;box-shadow:inset 0 0 0 2px #3a3a3a,0 2px 0 #b9b09a}
canvas#stage{border:0;border-radius:6px}
.deck{display:flex;flex-direction:column-reverse;gap:10px;align-items:stretch}
.deck>div:last-child{display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
.goal,.op,.help{white-space:normal;overflow-wrap:anywhere}
.op{display:none}
.goal{font-size:15px;line-height:1.3}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px;padding:0 10px}.chips button{flex:none;font-size:14px;padding:6px 12px}
.ctl button{font-size:17px;padding:12px 18px}.goal{font-size:16px}
.help{display:none}.op{font-size:13px}
#wheelbox{position:sticky;bottom:0;z-index:4;margin:0 -10px;padding:10px 0 calc(6px + env(safe-area-inset-bottom));background:#e9e3d3;border-radius:22px 22px 0 0;box-shadow:0 -2px 0 #b9b09a,0 -10px 18px rgba(43,35,32,.18)}
#dial{width:min(56vw,230px);height:min(56vw,230px)}
#wheelbox .ctl{justify-content:center;margin:0 10px 6px;gap:8px}#wheelbox .ctl button{flex:1 1 0;font-size:15px;padding:6px 4px;min-height:0;height:46px;white-space:nowrap}
.cast{font-size:13px}.cast select{font-size:14px}
.wcap{font-size:12.5px}
}
</style>
</head>
<body>
<div class="play">
<div class="bar"><a class="room-return" href="index.html#world">The shorts</a><h1>The Town</h1><a class="btn" href="index.html#world">Watch the cartoon</a></div>
<div class="screen"><canvas id="stage" aria-label="The town: seven cards in a row under one drawn power line. Select a card to play it."></canvas></div>
<div class="deck">
<div id="wheelbox"><svg id="dial" viewBox="-110 -110 220 220" tabindex="0" role="slider" aria-label="The crank wheel. Drag around it, or hold C, to send power down the line. The handle is heavy: it is hard going up the left side and it falls down the right." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
<circle r="108" fill="#e9e3d3" stroke="#b9b09a" stroke-width="2"/><circle r="104" fill="#26231f"/>
<circle id="mom" r="106" fill="none" stroke="#F3A640" stroke-width="4" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90)"/>
<circle r="97" fill="none" stroke="#cfc6b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 8.1" opacity=".7"/>
<path d="M0 -62 A62 62 0 0 0 0 62" fill="none" stroke="#C0573A" stroke-width="9" opacity=".45"/><path d="M0 -62 A62 62 0 0 1 0 62" fill="none" stroke="#7FA37A" stroke-width="9" opacity=".5"/>
<g fill="#e9e3d3" font-family="IM Fell English SC,Georgia,serif" font-size="9" text-anchor="middle" letter-spacing="1"><text y="-80">MENU</text><text x="-80" y="3">◀◀</text><text x="80" y="3">▶▶</text><text y="90" id="buzzl">BUZZ</text></g>
<g id="grav" fill="none" stroke-linecap="round"><line id="gdown" stroke="#e9e3d3" stroke-width="3" opacity=".8"/><line id="gpush" stroke="#F3A640" stroke-width="3.5"/></g>
<g id="knob"><circle cy="-62" r="14" fill="#C9733A" stroke="#2B2320" stroke-width="3"/><circle cy="-62" r="4" fill="#2B2320"/></g>
<circle id="ok" r="33" fill="#e9e3d3" stroke="#b9b09a" stroke-width="2"/><text id="okl" y="4" fill="#4a3f36" font-family="IM Fell English SC,Georgia,serif" font-size="11" text-anchor="middle" letter-spacing=".5">CHOOSE</text></svg>
<div class="wcap"><span class="up">▲ up the left is heavy</span><span class="dn">▼ down the right it falls</span></div></div>
<div>
<div class="chips" id="chips"></div>
<p class="op" id="op"></p>
<p class="goal" id="goal">Turn the crank: nothing in the town runs unless somebody turns it. Then choose a card.</p>
<div class="ctl" id="ctl"></div>
<div class="cast" id="cast"></div>
<p class="help" id="help">Keys: hold C to crank. ← → move along the town when no card is chosen.</p>
</div>
</div>
</div>
<script src="stage.js"></script>
<script>
// the controls; the world is in world.js
// the crank wheel: a heavy handle on a flywheel. Dragging turns it; let go and it keeps its speed, slows, and the weight of the handle swings it
// back to the bottom. The handle is hard to lift up the left side and falls down the right side, so a steady crank is a push up and a let-fall.
const WHEEL = (() => {
  const G = 7, FR = .55, TICK = Math.PI / 6;   // gravity (rad/s^2), friction (1/s), a haptic tick every 30 degrees
  let svg, cb, th = Math.PI, w = 0, drag = null, last = 0, sector = Math.floor(Math.PI / TICK), lastBuzz = 0, ios = null, pw = 0;
  const api = { buzzOn: true };
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  api.buzz = (ms, force) => {
    if (!api.buzzOn && !force) return;
    const n = performance.now(); if (n - lastBuzz < 28 && !force) return; lastBuzz = n;
    if (navigator.vibrate) { navigator.vibrate(ms); return; }
    try { if (!ios) { ios = document.createElement('label'); ios.style.cssText = 'position:fixed;left:-99px;top:0;opacity:0;pointer-events:none'; ios.innerHTML = '<input type="checkbox" switch>'; document.body.append(ios); } ios.click(); } catch (e) {}
  };
  const at = e => { const r = svg.getBoundingClientRect(), k = 220 / r.width; return { x: (e.clientX - r.left - r.width / 2) * k, y: (e.clientY - r.top - r.height / 2) * k }; };
  api.init = (el, o) => {
    svg = el; cb = o;
    svg.addEventListener('pointerdown', e => {
      const p = at(e), d = Math.hypot(p.x, p.y); cb.wake();
      drag = { a: Math.atan2(p.x, -p.y), t: performance.now(), moved: 0, p, d, tm: performance.now() }; svg.setPointerCapture(e.pointerId); e.preventDefault();
    });
    svg.addEventListener('pointermove', e => {
      if (!drag) return; const p = at(e), a = Math.atan2(p.x, -p.y), da = wrap(a - drag.a), n = performance.now(), dt = Math.max(8, n - drag.tm) / 1000;
      if (drag.d > 36) { th += da; w = .55 * w + .45 * da / dt; }
      drag.moved += Math.abs(da); drag.a = a; drag.tm = n;
    });
    const up = e => {
      if (!drag) return; const d = drag; drag = null;
      if (d.moved < .3 && performance.now() - d.t < 350) {   // a tap, not a turn
        w = 0; const p = d.p; let k;
        if (d.d <= 36) k = 'ok'; else k = Math.abs(p.x) > Math.abs(p.y) ? (p.x < 0 ? 'prev' : 'next') : (p.y < 0 ? 'menu' : 'buzz');
        api.buzz(14, true); cb.onTap(k);
      }
    };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', () => { drag = null; });
    requestAnimationFrame(tick);
  };
  api.power = p => { pw = p; const m = svg && svg.querySelector('#mom'); if (m) m.setAttribute('stroke-dasharray', (p * 100).toFixed(1) + ' 100'); };
  function tick(now) {
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
    if (drag) { if (now - drag.tm > 90) w *= .6; }   // a held finger that stops stops the wheel
    else { w += G * Math.sin(th) * dt; w -= w * FR * dt; if (Math.abs(w) < .02 && Math.abs(wrap(th - Math.PI)) < .03) w = 0; th += w * dt; }
    // haptics: a tick every 30 degrees, a clunk each time the handle passes over the top going forward
    const s = Math.floor(th / TICK);
    if (s !== sector) {
      const top = Math.floor(th / (2 * Math.PI)) !== Math.floor(sector * TICK / (2 * Math.PI));
      if (Math.abs(w) > .3 || drag) api.buzz(top ? 26 : 9, top);
      sector = s;
    }
    const a = th, kx = Math.sin(a) * 62, ky = -Math.cos(a) * 62, push = Math.sin(a);
    svg.querySelector('#knob').setAttribute('transform', `rotate(${a * 180 / Math.PI})`);
    const gd = svg.querySelector('#gdown'), gp = svg.querySelector('#gpush');   // the weight, and the push of the weight along the track
    gd.setAttribute('x1', kx); gd.setAttribute('y1', ky + 16); gd.setAttribute('x2', kx); gd.setAttribute('y2', ky + 25);
    gp.setAttribute('x1', kx); gp.setAttribute('y1', ky); gp.setAttribute('x2', kx + Math.cos(a) * push * 24); gp.setAttribute('y2', ky + Math.sin(a) * push * 24);
    const f = Math.abs(w) / (2 * Math.PI);
    cb.crank(Math.min(2, Math.max(0, f - .06)));
    requestAnimationFrame(tick);
  }
  return api;
})();
const UI = (() => {
  let O, wheelV = 0, keyC = false, ci = 0;
  const $ = id => document.getElementById(id);
  const btn = (label, down, up) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.addEventListener('pointerdown', e => { e.preventDefault(); O.wake(); down(); }); if (up) { b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); } return b; };
  const ctl = {
    school: () => [], scrubber: () => [],
    barber: () => [btn('Left arm (F)', () => O.IN.tap.push('L')), btn('Right arm (J)', () => O.IN.tap.push('R'))],
    'phono-cinema': () => [btn('Hold to speak (Space)', () => O.IN.speak = true, () => O.IN.speak = false), btn('Use the microphone', mic),
      ...O.ANSWERERS.map(([k, n]) => btn('Answer: ' + n, () => { O.G['phono-cinema'].who = k; }))],
    'air-cabs': () => [btn('Up (↑)', () => O.IN.keys.ArrowUp = true, () => O.IN.keys.ArrowUp = false), btn('Down (↓)', () => O.IN.keys.ArrowDown = true, () => O.IN.keys.ArrowDown = false)],
    firemen: () => [btn('Aim up (↑)', () => O.IN.keys.ArrowUp = true, () => O.IN.keys.ArrowUp = false), btn('Aim down (↓)', () => O.IN.keys.ArrowDown = true, () => O.IN.keys.ArrowDown = false)],
    skates: () => [btn('Left foot (←)', () => O.IN.tap.push('L')), btn('Right foot (→)', () => O.IN.tap.push('R'))]
  };
  const help = { school: 'Turn the dial. Each full turn is one book down one wire.', scrubber: 'Press on the picture near a brush and drag. The brush follows as far as the legs reach.',
    barber: 'Watch the red hand and the gauge: press its side as it lands.', 'phono-cinema': 'Hold Speak or talk into the microphone. Let go and the screen answers.',
    'air-cabs': 'Press above or below the cab, or hold Up or Down.', firemen: 'Press on the fire to aim the hose there, and keep the crank turning for pressure.', skates: 'Alternate left and right, a stride every half second or so.' };
  let micOn = false;
  async function mic() { if (micOn) return; try { const st = await navigator.mediaDevices.getUserMedia({ audio: true }); const ac = new AudioContext(), an = ac.createAnalyser(); ac.createMediaStreamSource(st).connect(an);
    const buf = new Float32Array(an.fftSize); micOn = true; const tick = () => { an.getFloatTimeDomainData(buf); let r = 0; for (const v of buf) r += v * v; O.IN.speak = Math.sqrt(r / buf.length) > .03; requestAnimationFrame(tick); }; tick(); } catch (e) { $('help').textContent = 'The microphone is not available here; hold Speak instead.'; } }
  function focus(d) {
    document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', String((d && b.dataset.id === d.id) || (!d && b.dataset.id === 'town'))));
    $('op').textContent = d ? 'Operator: ' + d.op : 'Operator: the line. Power reaches each card later the farther it is from the crank.';
    $('goal').textContent = d ? d.goal : 'Turn the crank: nothing in the town runs unless somebody turns it. Then choose a card.';
    const c = $('ctl'); c.innerHTML = ''; if (d) ctl[d.id]().forEach(b => c.append(b));
    $('help').textContent = d ? help[d.id] + ' Keys: hold C to crank.' : 'Keys: hold C to crank. ← → move along the town when no card is chosen.';
    const cs = $('cast'); cs.innerHTML = '';
    if (d && O.cast[d.id]) { cs.append('Who holds the handle here: '); const s = document.createElement('select'); s.setAttribute('aria-label', 'Who holds the handle');
      for (const [k, a] of Object.entries(O.ACTORS)) { const o = document.createElement('option'); o.value = k; o.textContent = a.name + (a.card === d.id ? ' (from this card)' : ' (from ' + O.D.find(q => q.id === a.card).title + ')'); s.append(o); }
      s.value = O.cast[d.id]; s.onchange = () => { O.cast[d.id] = s.value; }; cs.append(s, ' The performance stays the same; only the cast changes.'); }
    $('okl').textContent = d ? 'TOWN' : 'CHOOSE';
    history.replaceState(null, '', d ? '?d=' + d.id : location.pathname);
  }
  function wheelTap(k) {   // the four labels on the ring and the middle button
    const n = O.D.length, f = O.getFocus();
    if (f) ci = O.D.indexOf(f);
    if (k === 'menu') O.setFocus(null);
    else if (k === 'prev') { ci = (ci + n - 1) % n; O.setFocus(O.D[ci]); }
    else if (k === 'next') { ci = (ci + 1) % n; O.setFocus(O.D[ci]); }
    else if (k === 'ok') O.setFocus(f ? null : O.D[ci]);
    else if (k === 'buzz') { WHEEL.buzzOn = !WHEEL.buzzOn; $('buzzl').textContent = WHEEL.buzzOn ? 'BUZZ' : 'QUIET'; WHEEL.buzz(30, true); }
  }
  return {
    init(o) { O = o; const ch = $('chips');
      const all = [['town', 'The whole town']].concat(o.D.map(d => [d.id, d.title]));
      for (const [id, t] of all) { const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id; b.textContent = t; b.onclick = () => { o.wake(); o.setFocus(id === 'town' ? null : o.D.find(d => d.id === id)); }; ch.append(b); }
      addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') keyC = true; if (!O.getFocus()) { if (e.key === 'ArrowRight') TOWN.pan(220); if (e.key === 'ArrowLeft') TOWN.pan(-220); } });
      addEventListener('keyup', e => { if (e.key === 'c' || e.key === 'C') keyC = false; });
      WHEEL.init($('dial'), { onTap: wheelTap, wake: o.wake, crank: v => { wheelV = v; } });
      setInterval(() => { O.IN.crank = keyC ? 1.1 : wheelV; }, 40);
      const mq = matchMedia('(max-width:760px)'), home = $('ctl').parentNode, ref = $('ctl').nextSibling;   // on a phone the card's buttons ride above the wheel, always in reach
      const place = () => { if (mq.matches) $('wheelbox').insertBefore($('ctl'), $('dial')); else home.insertBefore($('ctl'), ref); }; place(); mq.addEventListener('change', place);
      focus(o.getFocus());
    },
    focus, update(status, P) { WHEEL.power(P.power); $('dial').setAttribute('aria-valuenow', String(Math.round(P.power * 100))); }
  };
})();
</script>
<script src="world.js"></script>
</body>
</html>
