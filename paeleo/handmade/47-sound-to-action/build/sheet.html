<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#888">
<canvas id="c" width="1600" height="1000"></canvas>
<script src="dog.js"></script>
<script>
window.sheet = (keys, cols, K, bg) => {
  const c = document.getElementById('c'), x = c.getContext('2d');
  const W = K * 1.9, H = K * 1.4, rows = Math.ceil(keys.length / cols);
  c.width = W * cols; c.height = (H + 14) * rows;
  x.fillStyle = bg || '#6d7a8c'; x.fillRect(0, 0, c.width, c.height);
  keys.forEach((k, i) => {
    const s = DOG.sprite(k, K, 'ink'), cx = (i % cols) * W, cy = Math.floor(i / cols) * (H + 14);
    x.drawImage(s.c, cx, cy); x.fillStyle = '#000'; x.font = '10px monospace'; x.fillText(String(i), cx + 3, cy + H + 10);
  });
  return c.toDataURL('image/png');
};
</script></body></html>
