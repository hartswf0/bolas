<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// SCION 41 renderer: projects the solved 3D primitives (spheres, capsules, chains, the door leaf) with a pinhole camera,
// lights them with a cool dusk ambient and the warm lamp light that passes the doorway (top-view visibility through the
// opening, minus the door leaf and whoever stands in it), and measures the dog from its own drawn layer.
const W = 1280, H = 720, cv = document.getElementById('c'), g = cv.getContext('2d');
const dogC = document.createElement('canvas'); dogC.width = W; dogC.height = H; const dg = dogC.getContext('2d');
const lightC = document.createElement('canvas'); lightC.width = W; lightC.height = H; const lg = lightC.getContext('2d');
const meas = document.createElement('canvas'); meas.width = 320; meas.height = 180; const mg = meas.getContext('2d', { willReadFrequently: true });
let S = null, CAM = null;
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2], len = a => Math.hypot(...a), norm = a => mul(a, 1 / (len(a) || 1));
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)], clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
function setCam(c) { const fwd = norm(sub(c.at, c.pos)), right = norm(cross(fwd, [0, 1, 0])), up = cross(right, fwd); CAM = { pos: c.pos, fwd, right, up, f: (H / 2) / Math.tan(c.vfov / 2) }; }
function P(p) { const d = sub(p, CAM.pos), z = dot(d, CAM.fwd); return [W / 2 + CAM.f * dot(d, CAM.right) / z, H / 2 - CAM.f * dot(d, CAM.up) / z, z, CAM.f / z]; }
function unprojectToZ(sx, sy, Z) { const dx = (sx - W / 2) / CAM.f, dy = -(sy - H / 2) / CAM.f; const dir = add(CAM.fwd, add(mul(CAM.right, dx), mul(CAM.up, dy))); const s = (Z - CAM.pos[2]) / dir[2]; return add(CAM.pos, mul(dir, s)); }
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`, hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function poly(ctx, pts3, fill, stroke, lw = 1) { ctx.beginPath(); pts3.forEach((p, k) => { const q = P(p); k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function line3(ctx, a, b, col, lw) { const p = P(a), q = P(b); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }

// ---------------- light: the lamp, the opening, the leaf, whoever stands in the doorway ----------------
let LIGHT = null;
function lightSetup(f) {
  const Wd = S.world, L = Wd.lamp, ang = (x, z) => Math.atan2(z - L[2], x - L[0]);
  const lo = Math.max(ang(Wd.wallIn, Wd.open[0]), ang(Wd.wallOut, Wd.open[0])), hi = Math.min(ang(Wd.wallIn, Wd.open[1]), ang(Wd.wallOut, Wd.open[1]));
  const h = Wd.hinge, a = f.door, Fe = [h[0] - Wd.leaf * Math.sin(a), h[2] + Wd.hingeDir * Wd.leaf * Math.cos(a)];
  const l1 = ang(h[0], h[2]), l2 = ang(Fe[0], Fe[1]);
  const pp = f.person.chest, pr = Math.atan2(0.2, Math.hypot(pp[0] - L[0], pp[2] - L[2])), pa = ang(pp[0], pp[2]), standing = f.person.hip[1] > 0.5;
  LIGHT = { L, lo, hi, leaf: [Math.min(l1, l2), Math.max(l1, l2)], h, Fe, person: standing ? [pa - pr, pa + pr] : null };
}
function visAngle(th, x, z) { // fraction of the lamp's light reaching top-view direction th (beyond the wall)
  const Lt = LIGHT; if (th < Lt.lo || th > Lt.hi) return 0; let v = 1;
  if (th > Lt.leaf[0] && th < Lt.leaf[1]) { // through the glazed leaf: muntins shadow, glass passes a third
    const u = leafU(th); v = (u > 0.07 && u < 0.93 && Math.abs(u - 0.5) > 0.035) ? 0.30 : 0.04; }
  if (Lt.person && th > Lt.person[0] && th < Lt.person[1]) v *= 0.12;
  return v;
}
function leafU(th) { const Lt = LIGHT, d = [Math.cos(th), Math.sin(th)], e = [Lt.Fe[0] - Lt.h[0], Lt.Fe[1] - Lt.h[2]], w = [Lt.h[0] - Lt.L[0], Lt.h[2] - Lt.L[2]];
  const den = d[0] * e[1] - d[1] * e[0]; return den ? (d[1] * w[0] - d[0] * w[1]) / den * -1 : 0; }
function warmAt(p) { // warm light intensity at a world point
  const Lt = LIGHT; if (p[0] < S.world.wallIn) { const d = len(sub(p, Lt.L)); return 0.9 / (1 + d * d * 0.35); }
  const th = Math.atan2(p[2] - Lt.L[2], p[0] - Lt.L[0]); const v = visAngle(th, p[0], p[2]); if (!v) return 0;
  const d = Math.hypot(p[0] - S.world.wallOut, p[2] * 0.6); return v * 0.95 / (1 + d * d * 0.16);
}
const AMB = [0.56, 0.60, 0.78], WARM = [1.0, 0.70, 0.40];
function lit(base, p, boost = 1) { const w = Math.min(0.75, warmAt(p) * boost) * 0.9; return [Math.min(255, base[0] * (AMB[0] + WARM[0] * w)), Math.min(255, base[1] * (AMB[1] + WARM[1] * w)), Math.min(255, base[2] * (AMB[2] + WARM[2] * w))]; }

// ---------------- shape helpers: capsule hulls and union parts ----------------
function hull(path, a, b) { // a, b: projected [x, y, r]
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
  if (d + Math.min(a[2], b[2]) <= Math.max(a[2], b[2]) + 0.01) { const c = a[2] >= b[2] ? a : b; path.moveTo(c[0] + c[2], c[1]); path.arc(c[0], c[1], c[2], 0, 2 * Math.PI); return; }
  const ph = Math.atan2(dy, dx), al = Math.acos(clamp((a[2] - b[2]) / d, -1, 1));
  path.moveTo(a[0] + a[2] * Math.cos(ph + al), a[1] + a[2] * Math.sin(ph + al));
  path.arc(a[0], a[1], a[2], ph + al, ph - al + 2 * Math.PI); path.arc(b[0], b[1], b[2], ph - al, ph + al); path.closePath();
}
function proj(c, r) { const q = P(c); return [q[0], q[1], Math.max(0.6, r * q[3]), q[2]]; }
// a part: list of prims [kind, A, ra, B, rb]; drawn as one silhouette with an outline, a fill and soft volume shading
function drawPart(ctx, prims, o) {
  const pr = prims.map(([A, ra, B, rb]) => [proj(A, ra), proj(B || A, rb || ra)]);
  const outl = new Path2D(), fill = new Path2D(), olw = o.outline ?? 1.6;
  for (const [a, b] of pr) { hull(outl, [a[0], a[1], a[2] + olw], [b[0], b[1], b[2] + olw]); hull(fill, a, b); }
  ctx.fillStyle = o.ol || 'rgba(20,14,12,0.9)'; ctx.fill(outl); ctx.fillStyle = rgb(o.col); ctx.fill(fill);
  ctx.save(); ctx.clip(fill);
  for (const [a, b] of pr) { // volume: light from above (the sky) and the warm side (the door), darker underneath
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, r = Math.max(a[2], b[2]) + Math.hypot(a[0] - b[0], a[1] - b[1]) / 2;
    const gr = ctx.createLinearGradient(cx, cy - r, cx, cy + r); gr.addColorStop(0, rgb(o.hi || [255, 255, 255], o.hiA ?? 0.16)); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, rgb([10, 8, 20], o.loA ?? 0.32));
    ctx.fillStyle = gr; const p2 = new Path2D(); hull(p2, a, b); ctx.fill(p2);
  }
  if (o.after) o.after(ctx, pr, fill);
  ctx.restore();
  return { fill, pr };
}

// ---------------- the world ----------------
let TREES = null;
function rnd(s) { let x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function drawSky(f) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#151b36'); gr.addColorStop(0.35, '#2a3056'); gr.addColorStop(0.6, '#56557a'); gr.addColorStop(0.75, '#93748a'); gr.addColorStop(0.86, '#c08a78'); gr.addColorStop(1, '#4a3a44');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // a far treeline: canopies (seeded), trunks, at Z = −14 .. −18
  g.fillStyle = '#171a25';
  for (let k = 0; k < 60; k++) { const X = -22 + k * 0.8 + rnd(k) * 0.6, Z = -30 - rnd(k + 50) * 5, h = 1.2 + rnd(k + 9) * 2.2 + (rnd(k + 77) > 0.8 ? 1.5 : 0), r = 0.6 + rnd(k + 3) * 0.9;
    const q = P([X, h - 0.42, Z]), s = q[3]; g.beginPath(); g.arc(q[0], q[1], r * s, 0, 7); g.arc(q[0] + 0.6 * r * s, q[1] + 0.35 * r * s, 0.7 * r * s, 0, 7); g.arc(q[0] - 0.55 * r * s, q[1] + 0.4 * r * s, 0.65 * r * s, 0, 7); g.fill();
    const b0 = P([X, -0.42, Z]); g.fillRect(q[0] - 0.08 * s, q[1], 0.16 * s, b0[1] - q[1]); }
  { const a0 = P([-30, -0.42, -30]), a1 = P([30, -0.42, -30]); g.fillRect(0, Math.min(a0[1], a1[1]) - 2, W, H); }
  poly(g, [[-30, -0.42, -30], [30, -0.42, -30], [30, -0.42, 2], [-30, -0.42, 2]], '#1b1e28');
}
function drawInterior(f) {
  const Wd = S.world, x0 = -3.6, x1 = Wd.wallIn, zB = -2.3, zF = 0.62, top = 2.62;
  const lampP = P(Wd.lamp);
  // back wall, lit by the lamp
  poly(g, [[x0, 0, zB], [x1, 0, zB], [x1, top, zB], [x0, top, zB]], '#7c5b3c');
  const rg = g.createRadialGradient(lampP[0], lampP[1] + 20, 5, lampP[0], lampP[1] + 40, 520); rg.addColorStop(0, 'rgba(255,214,150,0.75)'); rg.addColorStop(0.45, 'rgba(230,160,90,0.35)'); rg.addColorStop(1, 'rgba(60,30,20,0)');
  g.save(); g.beginPath(); [[x0, 0, zB], [x1, 0, zB], [x1, top, zB], [x0, top, zB]].forEach((p, k) => { const q = P(p); k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.closePath(); g.clip(); g.fillStyle = rg; g.fillRect(0, 0, W, H); g.restore();
  // a framed picture and a coat on a hook (drawn here, not found)
  poly(g, [[-2.3, 1.25, zB + 0.01], [-1.75, 1.25, zB + 0.01], [-1.75, 1.7, zB + 0.01], [-2.3, 1.7, zB + 0.01]], '#3b2a1c'); poly(g, [[-2.25, 1.3, zB + 0.02], [-1.8, 1.3, zB + 0.02], [-1.8, 1.65, zB + 0.02], [-2.25, 1.65, zB + 0.02]], '#a08a62');
  poly(g, [[-2.2, 1.38, zB + 0.03], [-1.9, 1.52, zB + 0.03], [-1.85, 1.38, zB + 0.03]], '#6d7a5a');
  // floor
  poly(g, [[x0, 0, zB], [x1, 0, zB], [x1, 0, zF], [x0, 0, zF]], '#5a3d27');
  for (let z = zB; z < zF; z += 0.16) line3(g, [x0, 0, z], [x1, 0, z], 'rgba(30,18,10,0.35)', 1);
  const fg = g.createRadialGradient(P([Wd.lamp[0], 0, Wd.lamp[2]])[0], P([Wd.lamp[0], 0, Wd.lamp[2]])[1], 4, P([Wd.lamp[0], 0, Wd.lamp[2]])[0], P([Wd.lamp[0], 0, Wd.lamp[2]])[1], 420);
  fg.addColorStop(0, 'rgba(255,200,130,0.45)'); fg.addColorStop(1, 'rgba(255,200,130,0)');
  g.save(); g.beginPath(); [[x0, 0, zB], [x1, 0, zB], [x1, 0, zF], [x0, 0, zF]].forEach((p, k) => { const q = P(p); k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.closePath(); g.clip(); g.fillStyle = fg; g.fillRect(0, 0, W, H); g.restore();

  g.beginPath(); for (let k = 0; k <= 40; k++) { const a = k / 40 * 2 * Math.PI, q = P([-1.3 + 0.75 * Math.cos(a), 0.004, -0.55 + 0.5 * Math.sin(a)]); k ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); } g.fillStyle = 'rgba(122,52,40,0.75)'; g.fill();
  // ceiling in section and the lamp
  poly(g, [[x0, top, zF], [x1 + 0.2, top, zF], [x1 + 0.2, top + 0.4, zF], [x0, top + 0.4, zF]], '#17120f');
  line3(g, [Wd.lamp[0], top, Wd.lamp[2]], add(Wd.lamp, [0, 0.12, 0]), '#2a211b', 2);
  poly(g, [add(Wd.lamp, [-0.17, -0.02, 0]), add(Wd.lamp, [0.17, -0.02, 0]), add(Wd.lamp, [0.06, 0.13, 0]), add(Wd.lamp, [-0.06, 0.13, 0])], '#3a2c22');
  const bg = g.createRadialGradient(lampP[0], lampP[1] + 6, 1, lampP[0], lampP[1] + 6, 60); bg.addColorStop(0, 'rgba(255,240,200,1)'); bg.addColorStop(0.3, 'rgba(255,200,120,0.6)'); bg.addColorStop(1, 'rgba(255,180,100,0)');
  g.fillStyle = bg; g.beginPath(); g.arc(lampP[0], lampP[1] + 6, 60, 0, 7); g.fill();
}
function drawDoor(f) { // the glazed wooden leaf, hung on the far jamb; it swings into the room and rests, foreshortened, against its stop
  const Wd = S.world, h = Wd.hinge, a = f.door, dz = Wd.hingeDir, d = [-Math.sin(a), 0, dz * Math.cos(a)], n = [Math.cos(a), 0, -dz * Math.sin(a)], T = 0.045, Hd = 2.02, Lf = Wd.leaf;
  const u0 = 0; // the leaf is always whole: it swings into the room and rests against its stop
  const at = (u, y, s = 0) => add(add(h, mul(d, u * Lf)), add([0, y, 0], mul(n, s * T)));
  const face = norm(sub(CAM.pos, at(0.5, 1, 0))), sgn = dot(face, n) > 0 ? 1 : -1; const s = sgn * 0.5;
  const wood = lit(hex('#6b4a2e'), at(0.5, 1, s), 0.6);
  poly(g, [at(1, 0, -s), at(1, 0, s), at(1, Hd, s), at(1, Hd, -s)], rgb(mul(wood, 0.7)));
  poly(g, [at(u0, 0, s), at(1, 0, s), at(1, Hd, s), at(u0, Hd, s)], rgb(wood), 'rgba(20,12,8,0.8)', 1.2);
  for (let cI = 0; cI < 2; cI++) for (let r = 0; r < 3; r++) {
    let p0 = 0.1 + cI * 0.415, p1 = p0 + 0.385; const y0 = 0.95 + r * 0.33, y1 = y0 + 0.29; p0 = Math.max(p0, u0); if (p1 <= p0) continue;
    poly(g, [at(p0, y0, s), at(p1, y0, s), at(p1, y1, s), at(p0, y1, s)], 'rgba(255,196,120,0.38)', 'rgba(25,15,8,0.9)', 1);
  }
  if (u0 < 0.12) poly(g, [at(0.12, 0.15, s), at(0.88, 0.15, s), at(0.88, 0.8, s), at(0.12, 0.8, s)], null, 'rgba(25,15,8,0.6)', 1);
  if (u0 > 0.01) poly(g, [at(u0, 0, -s), at(u0, 0, s), at(u0, Hd, s), at(u0, Hd, -s)], '#1c1716'); // the leaf in section where the cut passes through it
  const kn = P(at(0.9, 0.98, s * 1.4)); g.fillStyle = '#c9a75a'; g.beginPath(); g.arc(kn[0], kn[1], Math.max(1.5, 0.022 * kn[3]), 0, 7); g.fill();
}
function drawHouseShell(f) {
  const Wd = S.world, o = Wd.open;
  // the far jamb's reveal (faces the camera), the far wall's outer face
  poly(g, [[Wd.wallIn, 0, o[0]], [Wd.wallOut, 0, o[0]], [Wd.wallOut, Wd.lintel, o[0]], [Wd.wallIn, Wd.lintel, o[0]]], rgb(lit(hex('#b9a684'), [0.4, 1, o[0]], 0.5)));
  poly(g, [[Wd.wallOut, 0, o[0]], [Wd.wallOut, 0, -2.4], [Wd.wallOut, 2.9, -2.4], [Wd.wallOut, 2.9, o[0]]], '#2c3142');
  for (let y = 0.18; y < 2.9; y += 0.18) line3(g, [Wd.wallOut, y, o[0]], [Wd.wallOut, y, -2.4], 'rgba(12,14,24,0.55)', 1);
  poly(g, [[Wd.wallOut, 2.9, o[0] + 0.1], [Wd.wallOut + 0.35, 2.9, o[0] + 0.1], [Wd.wallOut + 0.35, 2.9, -2.5], [Wd.wallOut, 2.9, -2.5]], '#1b1c26');
}
function drawPorch(f) {
  const Wd = S.world, x0 = Wd.wallOut, x1 = Wd.porchEnd, zF = 0.9, zB = Wd.railZ - 0.08;
  poly(g, [[x0, 0, zB], [x1, 0, zB], [x1, 0, zF], [x0, 0, zF]], '#4d4a52');
  for (let z = zB; z < zF; z += 0.13) line3(g, [x0, 0, z], [x1, 0, z], 'rgba(18,16,22,0.55)', 1);
  // lamp light through the doorway onto the boards, with the shadows of whoever is in it
  lg.clearRect(0, 0, W, H); const Lt = LIGHT, steps = 240, runs = [];
  for (let k = 0; k < steps; k++) { const th = lerp(Lt.lo, Lt.hi, (k + 0.5) / steps), v = visAngle(th); const last = runs[runs.length - 1];
    if (last && Math.abs(last.v - v) < 1e-3) last.k1 = k + 1; else runs.push({ v, k0: k, k1: k + 1 }); }
  const dp = P([x0, 0, 0]), far = P([x1, 0, 0]); const grd = lg.createRadialGradient(dp[0], dp[1], 2, dp[0], dp[1], Math.max(200, Math.abs(far[0] - dp[0]) * 1.05));
  grd.addColorStop(0, 'rgba(255,184,104,0.62)'); grd.addColorStop(0.25, 'rgba(255,170,92,0.42)'); grd.addColorStop(0.7, 'rgba(240,150,80,0.2)'); grd.addColorStop(1, 'rgba(230,140,70,0.08)');
  const ray = (th, X) => [X, 0.001, clamp(Lt.L[2] + (X - Lt.L[0]) * Math.tan(th), zB, zF)];
  for (const r of runs) { if (r.v <= 0) continue; const th0 = lerp(Lt.lo, Lt.hi, r.k0 / steps), th1 = lerp(Lt.lo, Lt.hi, r.k1 / steps);
    const pts = [ray(th0, x0)]; for (let X = x0; X <= x1 + 1e-6; X += 0.25) pts.push(ray(th1, X)); for (let X = x1; X >= x0 - 1e-6; X -= 0.25) pts.push(ray(th0, X));
    lg.globalAlpha = r.v; poly(lg, pts, grd); }
  lg.globalAlpha = 1;
  // shadows cast by the lamp: each sphere of the dog and the person projected from the lamp onto the floor
  lg.globalCompositeOperation = 'destination-out';
  const shadowOf = (c, r) => { if (c[0] < Wd.wallIn) return; const s = Lt.L[1] / (Lt.L[1] - c[1]); if (s <= 0 || s > 12) return; const sp = add(Lt.L, mul(sub(c, Lt.L), s)); const rr = r * s;
    lg.beginPath(); for (let k = 0; k <= 12; k++) { const a = k / 12 * 2 * Math.PI, q = P([sp[0] + rr * Math.cos(a) * 1.2, 0, sp[2] + rr * Math.sin(a)]); k ? lg.lineTo(q[0], q[1]) : lg.moveTo(q[0], q[1]); } lg.fillStyle = 'rgba(0,0,0,0.75)'; lg.fill(); };
  for (const s of f.dog.torso) shadowOf(s, s[3]); shadowOf(f.dog.head, 0.09); for (const l of f.dog.legs) { shadowOf(l.j1, 0.04); shadowOf(l.j2, 0.03); }
  for (const p of f.dog.tail) shadowOf(p, 0.04);
  const pp = f.person; [[pp.head, 0.11], [pp.chest, 0.17], [pp.hip, 0.15], [pp.kL, 0.07], [pp.kR, 0.07], [pp.handR, 0.05], [pp.elR, 0.05]].forEach(([c, r]) => shadowOf(c, r));
  lg.globalCompositeOperation = 'source-over';
  g.save(); g.globalCompositeOperation = 'lighter'; g.drawImage(lightC, 0, 0); g.restore();
  // contact shadows under the dog (ambient occlusion on the boards)
