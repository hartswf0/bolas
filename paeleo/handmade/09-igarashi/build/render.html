<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../../tools/paeleo/fonts/local.css">

</head><body>
<canvas id="out" width="1280" height="720"></canvas>
<script src="drawings.js"></script>
<script src="arap.js"></script>
<script src="rig.js"></script>
<script>
// SCION 09 · Igarashi — the stage. The world (house, door, porch, dusk) is drawn here in canvas as paper and ink; the
// figures are the ARAP-deformed meshes of the source drawings, textured with their own PNGs in WebGL.
const W = 1280, H = 720;
const out = document.getElementById('out'), ctx = out.getContext('2d');
const gl_c = document.createElement('canvas'); gl_c.width = W; gl_c.height = H;
const gl = gl_c.getContext('webgl2', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: true });
let SCORE, MESH, QD, rig, stage;
const X0 = RIG.X0, S = RIG.S, YG = RIG.YG;
const lerp = (a, b, u) => a + (b - a) * u, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const DOOR_L = X0 - 0.46 * S, DOOR_R = X0 + 0.46 * S, DOOR_T = YG - 2.05 * S;
const VP = [640, 300];

// ───────────── GL ─────────────
const VS = `#version 300 es
in vec2 p; in vec2 uv; out vec2 v_uv; uniform vec2 res;
void main(){ v_uv = uv; gl_Position = vec4(p.x / res.x * 2.0 - 1.0, 1.0 - p.y / res.y * 2.0, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float; in vec2 v_uv; uniform sampler2D tex; uniform vec3 amb; uniform vec3 warm; uniform float fl; out vec4 o;
void main(){ vec4 c = texture(tex, v_uv); vec3 l = amb + warm; o = vec4(mix(c.rgb * l, vec3(0.0) * c.a, fl), c.a); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
const loc = { p: gl.getAttribLocation(prog, 'p'), uv: gl.getAttribLocation(prog, 'uv'), res: gl.getUniformLocation(prog, 'res'), amb: gl.getUniformLocation(prog, 'amb'), warm: gl.getUniformLocation(prog, 'warm'), flat: gl.getUniformLocation(prog, "fl") };
gl.uniform2f(loc.res, W, H);
gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
const GM = {};
function glMesh(name, img) {
  const m = MESH[name];
  const uv = new Float32Array(m.verts.length * 2); m.verts.forEach((v, i) => { uv[2 * i] = v[0] / m.w; uv[2 * i + 1] = v[1] / m.h; });
  const idx = new Uint16Array(m.tris.length * 3); m.tris.forEach((t, i) => { idx[3 * i] = t[0]; idx[3 * i + 1] = t[1]; idx[3 * i + 2] = t[2]; });
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, uv.byteLength, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(loc.p); gl.vertexAttribPointer(loc.p, 2, gl.FLOAT, false, 0, 0);
  const ub = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, ub); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(loc.uv); gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  GM[name] = { vao, pb, n: idx.length, tex, buf: new Float32Array(m.verts.length * 2) };
}
function drawPiece(pc, amb, warm, flat = 0) {
  const g = GM[pc.mesh], X = pc.X, pl = pc.place, n = X.length / 2;
  const m = pl.mirror ? -1 : 1, c = Math.cos(pl.rot), s = Math.sin(pl.rot);
  for (let i = 0; i < n; i++) { const dx = (X[2 * i] - pl.ox) * pl.k, dy = (X[2 * i + 1] - pl.oy) * pl.k; g.buf[2 * i] = pl.tx + m * (c * dx - s * dy); g.buf[2 * i + 1] = pl.ty + (s * dx + c * dy); }
  gl.bindVertexArray(g.vao); gl.bindBuffer(gl.ARRAY_BUFFER, g.pb); gl.bufferSubData(gl.ARRAY_BUFFER, 0, g.buf);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, g.tex);
  gl.uniform3fv(loc.amb, amb); gl.uniform3fv(loc.warm, warm); gl.uniform1f(loc.flat, flat);
  gl.drawElements(gl.TRIANGLES, g.n, gl.UNSIGNED_SHORT, 0);
  gl.bindVertexArray(null);
  return g.buf;
}

// ───────────── the world, drawn ─────────────
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const INK = '#17120e';
function strokeP(c, P, w, col, close) { c.beginPath(); c.moveTo(P[0][0], P[0][1]); for (const p of P.slice(1)) c.lineTo(p[0], p[1]); if (close) c.closePath(); c.lineWidth = w; c.strokeStyle = col; c.stroke(); }
function poly(c, P, fill) { c.beginPath(); c.moveTo(P[0][0], P[0][1]); for (const p of P.slice(1)) c.lineTo(p[0], p[1]); c.closePath(); c.fillStyle = fill; c.fill(); }
function wobble(c, x0, y0, x1, y1, w, col, r, a = 1) { // a hand-ruled line
  c.save(); c.globalAlpha = a; c.beginPath(); c.moveTo(x0, y0); const n = 6; for (let k = 1; k <= n; k++) { const u = k / n; c.lineTo(lerp(x0, x1, u) + (r() - .5) * 1.2, lerp(y0, y1, u) + (r() - .5) * 1.2); } c.lineWidth = w; c.strokeStyle = col; c.lineCap = 'round'; c.stroke(); c.restore();
}
let paperTex;
function makePaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const im = g.createImageData(W, H), r = rng(7);
  for (let i = 0; i < W * H; i++) { const v = 128 + (r() - .5) * 34; im.data[4 * i] = v; im.data[4 * i + 1] = v; im.data[4 * i + 2] = v; im.data[4 * i + 3] = 255; }
  g.putImageData(im, 0, 0);
  // fibres
  g.globalAlpha = .08; for (let k = 0; k < 1400; k++) { const x = r() * W, y = r() * H, a = r() * 6.28, l = 6 + r() * 18; g.strokeStyle = r() < .5 ? '#000' : '#fff'; g.lineWidth = .8; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  paperTex = c;
}
let houseLayer;
function makeHouse() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); const r = rng(3);
  const CORNER = 776;
  // wall
  g.fillStyle = '#566676'; g.fillRect(0, 60, CORNER, YG - 60);
  for (let y = 72; y < YG; y += 22) { // lapped siding: a shadow under each board, a ruled ink line
    const grd = g.createLinearGradient(0, y, 0, y + 22); grd.addColorStop(0, 'rgba(0,0,0,.18)'); grd.addColorStop(.25, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(255,255,255,.05)');
    g.fillStyle = grd; g.fillRect(0, y, CORNER, 22);
    wobble(g, 0, y, CORNER, y, 1.3, 'rgba(20,24,30,.55)', r);
  }
  // window, right of the door
  const wx0 = 512, wx1 = 668, wy0 = 278, wy1 = 452;
  g.fillStyle = '#1d1a1a'; g.fillRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
  // corner trim and post
  g.fillStyle = '#d9cfb8'; g.fillRect(CORNER - 16, 60, 18, YG - 60); strokeP(g, [[CORNER - 16, 60], [CORNER - 16, YG]], 1.5, INK);
  // door frame (trim) and the sill
  g.fillStyle = '#e3d8c0'; g.fillRect(DOOR_L - 18, DOOR_T - 26, DOOR_R - DOOR_L + 36, 26); g.fillRect(DOOR_L - 18, DOOR_T, 18, YG - DOOR_T); g.fillRect(DOOR_R, DOOR_T, 18, YG - DOOR_T);
  g.strokeStyle = INK; g.lineWidth = 2; g.strokeRect(DOOR_L - 18, DOOR_T - 26, DOOR_R - DOOR_L + 36, YG - DOOR_T + 26); g.strokeRect(DOOR_L, DOOR_T, DOOR_R - DOOR_L, YG - DOOR_T);
  strokeP(g, [[DOOR_L - 18, DOOR_T - 8], [DOOR_R + 18, DOOR_T - 8]], 1, 'rgba(0,0,0,.5)');
  // window trim
  g.fillStyle = '#e3d8c0'; g.fillRect(wx0 - 12, wy0 - 14, wx1 - wx0 + 24, 14); g.fillRect(wx0 - 12, wy1, wx1 - wx0 + 24, 12); g.fillRect(wx0 - 12, wy0, 12, wy1 - wy0); g.fillRect(wx1, wy0, 12, wy1 - wy0);
  g.strokeRect(wx0 - 12, wy0 - 14, wx1 - wx0 + 24, wy1 - wy0 + 26);
  // porch roof: soffit and beam across the whole width
  g.fillStyle = '#3d3633'; g.fillRect(0, 0, W, 44);
  for (let x = -40; x < W + 40; x += 34) strokeP(g, [[x, 0], [lerp(x, VP[0], .12), 44]], 1, 'rgba(0,0,0,.45)');
  g.fillStyle = '#5b4a3e'; g.fillRect(0, 40, W, 28); strokeP(g, [[0, 40], [W, 40]], 2, INK); strokeP(g, [[0, 68], [W, 68]], 2, INK);
  // posts
  g.fillStyle = '#d6ccb4'; g.fillRect(CORNER, 68, 20, YG - 68); g.strokeRect(CORNER, 68, 20, YG - 68);
  g.fillRect(1238, 68, 24, YG - 60); g.strokeRect(1238, 68, 24, YG - 60);
  // railing between the house corner and the steps
  g.fillStyle = '#cfc4ab';
  g.fillRect(CORNER + 20, 468, 1238 - CORNER - 20, 13); g.strokeRect(CORNER + 20, 468, 1238 - CORNER - 20, 13);
  g.fillRect(CORNER + 20, 570, 1238 - CORNER - 20, 9); g.strokeRect(CORNER + 20, 570, 1238 - CORNER - 20, 9);
  for (let x = CORNER + 34; x < 1232; x += 27) { g.fillRect(x, 481, 8, 89); g.strokeRect(x, 481, 8, 89); }
  // porch floor: boards running toward us from the house
  g.fillStyle = '#5e5045'; g.fillRect(0, YG, W, H - YG);
  for (let x = -900; x < W + 900; x += 36) { const u = (YG - VP[1]); const xb = VP[0] + (x - VP[0]) * (H - VP[1]) / u; wobble(g, x, YG, xb, H, 1.2, 'rgba(15,10,8,.6)', r); }
  for (const y of [622, 668]) wobble(g, 0, y, W, y, 1, 'rgba(15,10,8,.35)', r); // board ends
  // the porch ends at the steps (x = 4.9 m): the floor edge and the treads going down
  const xs = X0 + 4.9 * S;
  g.fillStyle = '#3a312b'; poly(g, [[xs + 10, YG], [W, YG], [W, H], [xs + 70, H]], '#2b2420');
  for (let k = 0; k < 3; k++) { const y = YG + 30 + k * 40; strokeP(g, [[xs + 14 + k * 20, y], [W, y]], 2, 'rgba(210,190,160,.35)'); }
  strokeP(g, [[xs + 10, YG], [xs + 70, H]], 2.4, INK);
  // the crate the person will sit on, beside the door
  const cx0 = X0 - 1.25 * S - 54, cx1 = X0 - 1.25 * S + 52, cy = YG - 60;
  g.fillStyle = '#7b5d40'; g.fillRect(cx0, cy, cx1 - cx0, YG - cy); g.strokeRect(cx0, cy, cx1 - cx0, YG - cy);
  for (let y = cy + 20; y < YG; y += 20) strokeP(g, [[cx0, y], [cx1, y]], 1.2, 'rgba(0,0,0,.5)');
  strokeP(g, [[cx0, cy], [cx1, YG]], 1.4, 'rgba(0,0,0,.35)');
  // the sill: a raised oak strip across the doorway
  g.fillStyle = '#a07a4e'; g.fillRect(DOOR_L - 6, YG - 7, DOOR_R - DOOR_L + 12, 12); g.strokeRect(DOOR_L - 6, YG - 7, DOOR_R - DOOR_L + 12, 12);
  houseLayer = c;
}
function drawQD(g, d, x, y, sc, col, w) {
  for (const s of d.drawing) { g.beginPath(); for (let k = 0; k < s[0].length; k++) { const px = x + s[0][k] * sc, py = y + s[1][k] * sc; if (k) g.lineTo(px, py); else g.moveTo(px, py); } g.lineWidth = w; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }
}
function drawSky(g, dusk) {
  const grd = g.createLinearGradient(0, 60, 0, 480);
  grd.addColorStop(0, `rgb(${lerp(46, 28, dusk)},${lerp(48, 32, dusk)},${lerp(88, 66, dusk)})`);
  grd.addColorStop(.6, `rgb(${lerp(122, 84, dusk)},${lerp(92, 66, dusk)},${lerp(118, 96, dusk)})`);
  grd.addColorStop(1, `rgb(${lerp(226, 170, dusk)},${lerp(150, 104, dusk)},${lerp(104, 86, dusk)})`);
  g.fillStyle = grd; g.fillRect(776, 60, W - 776, 430);
  // the moon (a Quick, Draw! crescent, key 6698312558182400) and trees (Quick, Draw!), drawn as chalk on the dusk
  const moon = QD.find(d => d.word === 'moon');
  g.save(); g.globalAlpha = lerp(.55, .9, dusk); drawQD(g, moon, 1040, 110, 0.32, '#f3e6c0', 3); g.restore();
  const trees = QD.filter(d => d.word === 'tree');
  const place = [[800, 360, .52], [905, 392, .40], [1000, 350, .6], [1110, 384, .44], [1165, 340, .62]];
  trees.forEach((d, k) => { const [x, y, s] = place[k % place.length]; drawQD(g, d, x, y, s, `rgba(${lerp(40, 22, dusk)},${lerp(40, 26, dusk)},${lerp(60, 44, dusk)},.95)`, 5); });
  // the yard: dark ground beyond the rail
  const g2 = g.createLinearGradient(0, 470, 0, 590); g2.addColorStop(0, '#2f3330'); g2.addColorStop(1, '#1d201e');
  g.fillStyle = g2; g.fillRect(776, 470, W - 776, 120);
}
function drawInterior(g, lit) {
  // the hall seen through the opening: back wall, floor, side walls, a lamp; dark until the light comes on
  const L = DOOR_L, R = DOOR_R, T = DOOR_T, B = YG;
  const bx0 = L + 46, bx1 = R - 30, by0 = T + 52, by1 = B - 64;
  const mix = (c0, c1) => `rgb(${c0.map((v, k) => Math.round(lerp(v, c1[k], lit))).join(',')})`;
  poly(g, [[L, T], [R, T], [R, B], [L, B]], mix([22, 18, 16], [196, 132, 70]));
  poly(g, [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]], mix([30, 25, 22], [246, 206, 132]));
  poly(g, [[L, B], [R, B], [bx1, by1], [bx0, by1]], mix([26, 20, 16], [168, 104, 56]));
  poly(g, [[R, T], [R, B], [bx1, by1], [bx1, by0]], mix([18, 15, 13], [214, 150, 82]));
  // a runner on the floor, a picture on the back wall
  poly(g, [[L + 60, B], [R - 40, B], [bx1 - 18, by1], [bx0 + 18, by1]], mix([30, 18, 18], [150, 52, 40]));
  g.save(); g.globalAlpha = .9; g.strokeStyle = mix([20, 16, 14], [92, 60, 30]); g.lineWidth = 3; g.strokeRect(bx0 + 22, by0 + 40, 40, 30); g.restore();
  // lamp
  if (lit > 0) { const r = g.createRadialGradient(bx0 + 60, by0 + 6, 2, bx0 + 60, by0 + 6, 140); r.addColorStop(0, `rgba(255,248,214,${.95 * lit})`); r.addColorStop(.25, `rgba(255,220,150,${.45 * lit})`); r.addColorStop(1, 'rgba(255,200,120,0)'); g.fillStyle = r; g.fillRect(L, T, R - L, B - T); }
  strokeP(g, [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]], 1.2, 'rgba(0,0,0,.35)', true);
}
function drawDoor(g, th) {
  // hinged on the right jamb, swinging in; its free (left) edge recedes toward the vanishing point
  const Wd = DOOR_R - DOOR_L, Dc = 900, f = 1 / (1 + Math.sin(th) * Wd / Dc);
  const xf = VP[0] + (DOOR_R - Wd * Math.cos(th) - VP[0]) * f;
  const yt = VP[1] + (DOOR_T - VP[1]) * f, yb = VP[1] + (YG - VP[1]) * f;
  if (xf >= DOOR_R - 1) return;
  const Q = [[xf, yt], [DOOR_R, DOOR_T], [DOOR_R, YG], [xf, yb]];
  poly(g, Q, '#2c4638');
  const at = (u, v) => [lerp(lerp(Q[0][0], Q[1][0], u), lerp(Q[3][0], Q[2][0], u), v), lerp(lerp(Q[0][1], Q[1][1], u), lerp(Q[3][1], Q[2][1], u), v)];
  for (const [u0, u1, v0, v1] of [[.14, .46, .07, .45], [.54, .86, .07, .45], [.14, .46, .53, .93], [.54, .86, .53, .93]]) {
    const P = [at(u0, v0), at(u1, v0), at(u1, v1), at(u0, v1)]; poly(g, P, '#24392e'); strokeP(g, P, 1.4, 'rgba(0,0,0,.6)', true);
    strokeP(g, [P[0], P[1]], 1, 'rgba(255,255,255,.12)');
  }
  strokeP(g, Q, 2, INK, true);
  const kn = at(.08, .52); g.beginPath(); g.arc(kn[0], kn[1], 4.5 * f, 0, 7); g.fillStyle = '#c9a54a'; g.fill(); g.lineWidth = 1.2; g.strokeStyle = INK; g.stroke();
  return xf;
}
function drawWindowLight(g, lit, dusk) {
  const wx0 = 512, wx1 = 668, wy0 = 278, wy1 = 452;
  const c0 = [30, 28, 34], c1 = [236, 182, 104];
  g.fillStyle = `rgb(${c0.map((v, k) => Math.round(lerp(v, c1[k], lit * .9))).join(',')})`; g.fillRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
  // curtains
  poly(g, [[wx0, wy0], [wx0 + 40, wy0], [wx0 + 26, wy1], [wx0, wy1]], `rgba(${lerp(60, 160, lit)},${lerp(40, 70, lit)},${lerp(40, 50, lit)},.95)`);
  poly(g, [[wx1, wy0], [wx1 - 40, wy0], [wx1 - 26, wy1], [wx1, wy1]], `rgba(${lerp(60, 160, lit)},${lerp(40, 70, lit)},${lerp(40, 50, lit)},.95)`);
  g.fillStyle = '#e3d8c0'; g.fillRect((wx0 + wx1) / 2 - 4, wy0, 8, wy1 - wy0); g.fillRect(wx0, (wy0 + wy1) / 2 - 4, wx1 - wx0, 8);
  g.strokeStyle = INK; g.lineWidth = 1.5; g.strokeRect(wx0, wy0, wx1 - wx0, wy1 - wy0);
}
function drawLightSpill(g, lit) {
  if (lit <= 0) return;
  g.save(); g.globalCompositeOperation = 'screen';
  // a warm fan on the porch boards, out of the doorway toward us
  const grd = g.createLinearGradient(0, YG, 0, H);
  grd.addColorStop(0, `rgba(250,190,110,${.55 * lit})`); grd.addColorStop(1, `rgba(250,170,90,${.12 * lit})`);
  poly(g, [[DOOR_L, YG], [DOOR_R, YG], [DOOR_R + 190, H], [DOOR_L - 30, H]], grd);
  // a glow around the frame
  const r = g.createRadialGradient((DOOR_L + DOOR_R) / 2, YG - 160, 40, (DOOR_L + DOOR_R) / 2, YG - 160, 420);
  r.addColorStop(0, `rgba(255,190,110,${.28 * lit})`); r.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = r; g.fillRect(0, 60, 900, YG - 60);
  g.restore();
}
function shadow(g, cx, w, a) { g.save(); const r = g.createRadialGradient(cx, YG + 4, 2, cx, YG + 4, w); r.addColorStop(0, `rgba(0,0,0,${a})`); r.addColorStop(1, 'rgba(0,0,0,0)'); g.setTransform(1, 0, 0, 0.16, 0, (YG + 4) * (1 - 0.16)); g.fillStyle = r; g.fillRect(cx - w, YG + 4 - w, 2 * w, 2 * w); g.restore(); }

// ───────────── a frame ─────────────
const SUBS = [[1.0, 2.3, 'Come here.', 'call'], [3.4, 4.6, 'Come here!', 'call'], [7.4, 9.4, 'It’s all right.', 'soft'], [10.4, 11.6, 'It’s all right.', 'soft'], [26.4, 27.4, 'Come in.', 'soft']];
function renderFrame(i, opts = {}) {
  const f = SCORE.frames[i], t = f.t, wd = rig.world(i), lit = wd.open;
  const dusk = wd.dusk;
  // world
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawSky(ctx, dusk);
  ctx.drawImage(houseLayer, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(DOOR_L, DOOR_T, DOOR_R - DOOR_L, YG - DOOR_T - 7); ctx.clip(); drawInterior(ctx, lit); drawDoor(ctx, wd.door);
  // the ajar crack of light before the door opens
  ctx.restore();
  drawWindowLight(ctx, lit, dusk);
  drawLightSpill(ctx, lit);
  // figures: solve
  const dg = rig.dog(i), ps = rig.person(i);
  const sol = stage.solveFrame([...ps.pieces, ...dg.pieces]);
  const amb = [lerp(.86, .70, dusk), lerp(.86, .72, dusk), lerp(.96, .86, dusk)];
  const warmAt = x => { const d = (x - (DOOR_L + DOOR_R) / 2) / 260; const w = lit * Math.exp(-d * d); return [.42 * w, .26 * w, .06 * w]; };
  // shadows on the boards
  const P = sol.pieces;
  const extent = (pc) => { let a = 1e9, b = -1e9; const pl = pc.place, m = pl.mirror ? -1 : 1; for (let k = 0; k < pc.X.length; k += 2) { const x = pl.tx + m * (pc.X[k] - pl.ox) * pl.k; a = Math.min(a, x); b = Math.max(b, x); } return [a, b]; };
  { const e = extent(P.dog_body); shadow(ctx, (e[0] + e[1]) / 2, (e[1] - e[0]) * 0.62, .5); }
  { const e = extent(P.person_body); shadow(ctx, (e[0] + e[1]) / 2, (e[1] - e[0]) * 0.6, .45); }
  // person layer
  gl.viewport(0, 0, W, H); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  const pcx = P.person_body.place.tx;
  for (const id of ['person_body', 'person_arm']) drawPiece(P[id], amb, warmAt(pcx));
  paperLift(); ctx.drawImage(gl_c, 0, 0);
  // dog layer (also measured)
  gl.clear(gl.COLOR_BUFFER_BIT);
  const dcx = P.dog_body.place.tx;
  const buf = {};
  for (const id of ['dog_body', 'dog_head']) buf[id] = Float32Array.from(drawPiece(P[id], amb, warmAt(dcx)));
  const meas = measure(buf, P, dg);
  paperLift(); ctx.drawImage(gl_c, 0, 0);
  // dusk grade and paper
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(${lerp(220, 170, dusk)},${lerp(214, 168, dusk)},${lerp(240, 210, dusk)},1)`; ctx.fillRect(0, 0, W, H); ctx.restore();
  // the doorway light reasserts itself over the grade
  if (lit > 0) { ctx.save(); ctx.globalCompositeOperation = 'screen'; const r = ctx.createRadialGradient(DOOR_L + 70, DOOR_T + 80, 10, DOOR_L + 70, DOOR_T + 80, 260); r.addColorStop(0, `rgba(255,214,150,${.35 * lit})`); r.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = r; ctx.fillRect(DOOR_L - 200, DOOR_T - 60, 600, YG - DOOR_T + 160); ctx.restore(); }
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .22; ctx.drawImage(paperTex, 0, 0); ctx.restore();
  vignette();
  // the person's words, quietly
  for (const [a, b, txt, kind] of SUBS) if (t >= a && t < b + 0.4) {
    const al = clamp((t - a) / 0.15) * clamp((b + 0.4 - t) / 0.3);
    ctx.save(); ctx.globalAlpha = al * (kind === 'soft' ? .62 : .95); ctx.font = (kind === 'soft' ? 'italic 400 25px Literata' : 'italic 600 31px Literata');
    ctx.fillStyle = '#f2e8d2'; ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 6; ctx.fillText(txt, 640, 686); ctx.restore();
  }
  return { meas, diag: sol.diag, dog: { state: dg.state, facing_rig: dg.facing, posture: dg.posture, headLow: dg.headLow, body: P.dog_body.mesh, head: P.dog_head.mesh }, person: ps.posture };
}
function paperLift() { ctx.save(); ctx.filter = 'blur(2.5px) brightness(0)'; ctx.globalAlpha = .38; ctx.drawImage(gl_c, 4, 5); ctx.restore(); }
function vignette() { const r = ctx.createRadialGradient(640, 380, 300, 640, 380, 860); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = r; ctx.fillRect(0, 0, W, H); }

const px = new Uint8Array(W * H * 4);
function measure(buf, P, dg) {
  // read the dog layer back: alpha centroid and extent, as rendered
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sa = 0, sx = 0, sy = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    const a = px[4 * ((H - 1 - y) * W + x) + 3]; if (a < 40) continue;
    sa += a; sx += a * x; sy += a * y; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  // facing from the rendered head: where its muzzle is relative to its neck socket
  const hm = MESH[P.dog_head.mesh], hb = buf.dog_head;
  const mean = (vs) => { let x = 0, y = 0; for (const v of vs) { x += hb[2 * v]; y += hb[2 * v + 1]; } return [x / vs.length, y / vs.length]; };
  const muz = mean(hm.handles.muzzle), neck = mean(hm.handles.neck), skull = mean(hm.handles.skull);
  const bm = MESH[P.dog_body.mesh], bb = buf.dog_body;
  const bmean = (vs) => { let x = 0, y = 0; for (const v of vs) { x += bb[2 * v]; y += bb[2 * v + 1]; } return [x / vs.length, y / vs.length]; };
  const withers = bmean(bm.handles.withers), hip = bmean(bm.handles.hip);
  const backTop = Math.min(withers[1], hip[1]);
  const feet = {}; for (const k of ['f1', 'f2', 'h1', 'h2']) if (bm.handles[k]) feet[k] = bmean(bm.handles[k]).map(v => Math.round(v * 100) / 100);
  return { feet, cx: sx / sa, cy: sy / sa, x0, x1, y0, y1, muzzle: muz, neck, skull, withers, hip, facing: muz[0] < neck[0] - 3 ? 1 : (muz[0] > neck[0] + 3 ? -1 : 0), skull_below_back: skull[1] - withers[1] };
}

// ───────────── cards ─────────────
function card(kind, u) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#16151a'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .3; ctx.drawImage(paperTex, 0, 0); ctx.restore();
  const fade = clamp(u / 0.4) * clamp((3 - u) / 0.4);
  ctx.globalAlpha = fade; ctx.textAlign = 'center'; ctx.fillStyle = '#efe4cc';
  if (kind === 'title') {
    ctx.font = '800 64px "Big Shoulders Display"'; ctx.fillText('PAE-02 · SCION 09 · Igarashi', 640, 330);
    ctx.font = 'italic 400 28px Literata'; ctx.fillStyle = '#c9bda4'; ctx.fillText('The threshold, as-rigid-as-possible', 640, 390);
  } else {
    ctx.font = '800 40px "Big Shoulders Display"'; ctx.fillText('What it is made of', 640, 200);
    ctx.font = '400 20px Literata'; ctx.fillStyle = '#d8ccb2';
    const L = ['Six drawings of one dog and two of one person, drawn in code by this swarm (no found image, no model);',
      'each cut into a triangle mesh and moved only by as-rigid-as-possible deformation:',
      'control handles, local rotation estimates and one energy minimised per frame, with the eye, nose,',
      'collar tag and buttons weighted stiff. Turns are draw swaps between whole drawings, never a squash.',
      'The house, door and dusk are drawn in canvas; moon and trees are Quick, Draw! drawings (CC BY 4.0,',
      'Google Creative Lab and contributors). Voice: flite speech synthesis; all other sound synthesized.',
      'The dog’s choices keep the PAELEO score’s times.'];
    L.forEach((s, k) => ctx.fillText(s, 640, 270 + k * 34));
  }
  ctx.globalAlpha = 1;
}

async function init(data) {
  SCORE = data.score; MESH = data.mesh; QD = data.qd;
  rig = RIG.Rig(SCORE, MESH); stage = RIG.Stage(MESH, ARAP);
  makePaper(); makeHouse();
  for (const name of Object.keys(MESH)) {
    const img = new Image(); img.src = '../' + MESH[name].texture; await img.decode(); glMesh(name, img);
  }
  await document.fonts.load('800 40px "Big Shoulders Display"'); await document.fonts.load('italic 400 20px Literata'); await document.fonts.load('400 20px Literata'); await document.fonts.load('italic 600 31px Literata');
  return Object.keys(MESH).length;
}
function grab(q = 0.9) { return out.toDataURL('image/jpeg', q); }
</script>
