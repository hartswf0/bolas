<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wittgenstein's Backpack: Six Games</title>
<meta name="description" content="Six language-games played with the cut-outs from the film Wittgenstein's Backpack.">
<style>
:root{--paper:#ece2ca;--kraft:#be9868;--ink:#1c1612;--red:#b3261a;--dim:#6a5f4f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--ink);font:15px/1.3 ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:2px solid var(--ink);border-radius:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
#hub{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px;gap:10px}
#hub h1{font:900 22px/1 Impact,"Arial Black",sans-serif;letter-spacing:.03em;text-transform:uppercase}
#hub h1 small{display:block;font:400 12px/1.4 ui-monospace,Menlo,monospace;letter-spacing:0;text-transform:none;color:var(--dim);margin-top:5px}
#tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px}
#tiles button{position:relative;padding:0;min-height:0;overflow:hidden;background:var(--ink) center/cover no-repeat;text-align:left}
#tiles button div{position:absolute;left:0;right:0;bottom:0;background:var(--kraft);border-top:2px solid var(--ink);padding:5px 8px}
#tiles b{display:block;font:900 14px/1.1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;text-transform:uppercase}
#tiles span{display:block;font-size:11px}
#hub a{color:var(--ink);font-size:12px}
@media (orientation:landscape) and (max-height:520px){#tiles{grid-template-columns:repeat(6,1fr)}}
#game{flex:1;min-height:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:2px solid var(--ink)}
#exit{padding:8px 10px;font-size:13px}
#name{flex:1;font:900 14px/1 Impact,"Arial Black",sans-serif;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{font-size:13px;font-weight:700;white-space:nowrap}
#stage{flex:1;min-height:0;position:relative;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#foot{border-top:2px solid var(--ink);padding:8px 10px 10px}
#say{font-size:13px;min-height:2.6em;margin-bottom:8px}
#acts{display:grid;gap:6px}
#acts button{min-height:46px;padding:4px 2px;font:900 14px/1 Impact,"Arial Black",sans-serif;letter-spacing:.05em;background:var(--kraft);color:var(--ink)}
#acts button.q{background:none}
#acts button.s{font-size:12px;letter-spacing:.02em}
#acts button.u{background:var(--red);color:var(--paper)}
#acts button:active{transform:translateY(1px)}
</style>
</head>
<body>
<div id="app">
  <main id="hub">
    <h1>Wittgenstein's Backpack<small>Six games played with the film's own cut-outs. In each one the box does a different job.</small></h1>
    <div id="tiles"></div>
    <a href="../">The film and its readings</a>
  </main>
  <main id="game" hidden>
    <div id="bar"><button id="exit" aria-label="Leave this game">Games</button><div id="name"></div><div id="score" aria-live="polite"></div></div>
    <div id="stage"><canvas id="cv" role="img" aria-label="Game stage"></canvas></div>
    <div id="foot"><div id="say" aria-live="polite"></div><div id="acts"></div></div>
  </main>
</div>
<script>
'use strict';
const M={"hand_giant":[0,0,184,472,77.0,461.0],"beetle_big":[186,0,444,324,174.0,162.0],"bottle":[632,0,178,302,89.0,291.0],"n_head":[812,0,109,216,48.7,196.6],"f_head":[923,0,109,216,48.7,196.6],"n_torso":[1034,0,140,212,66.2,161.0],"f_torso":[1176,0,140,212,66.2,161.0],"boxhead":[1318,0,153,212,73.4,203.2],"frog_dial":[0,474,310,212,155.0,106.0],"frog_blue":[312,474,261,202,130.5,101.0],"frog_dj":[575,474,178,182,89.0,176.0],"card_boxback":[755,474,252,182,126.0,91.0],"fragile_box":[1009,474,325,168,162.5,162.0],"boxscore":[1336,474,142,162,71.0,81.0],"frog_green":[0,688,191,162,95.5,156.0],"frog_boxed":[193,688,121,132,60.5,126.0],"handlecare":[316,688,230,132,115.0,66.0],"backpack":[548,688,129,130,64.5,65.0],"n_thigh":[679,688,52,127,26.0,26.0],"f_thigh":[733,688,52,127,26.0,26.0],"n_shin":[787,688,46,122,23.0,23.0],"f_shin":[835,688,46,122,23.0,23.0],"duckrabbit":[883,688,166,118,117.0,107.0],"n_upper":[1051,688,46,104,23.0,23.0],"f_upper":[1099,688,46,104,23.0,23.0],"cassette":[1147,688,155,102,77.5,51.0],"n_fore":[1304,688,43,98,21.5,21.5],"f_fore":[1349,688,43,98,21.5,21.5],"label_6":[0,852,236,89,118.0,83.0],"label_5":[238,852,229,85,114.5,79.0],"label_7":[469,852,242,85,121.0,79.0],"label_8":[713,852,248,84,124.0,78.0],"label_3":[963,852,217,83,108.5,77.0],"label_4":[1182,852,224,83,112.0,77.0],"label_2":[0,943,212,81,106.0,75.0],"label_1":[214,943,206,79,103.0,73.0],"label_0":[422,943,200,73,100.0,67.0],"beetle":[624,943,90,70,37.0,35.0],"smallbox":[716,943,70,68,35.0,62.0],"n_foot":[788,943,74,44,23.0,19.0],"n_hand":[864,943,44,44,21.0,13.0],"f_foot":[910,943,74,44,23.0,19.0],"f_hand":[986,943,44,44,21.0,13.0],"fly":[1032,943,37,38,18.0,24.0]};
const $=s=>document.querySelector(s);
const INK='#1c1612',KR='#be9868',PAPER='#ece2ca',RED='#b3261a',GRN='#39ff7a';
const cv=$('#cv'),g=cv.getContext('2d');
let W=1,H=1,U=1,cur=null,S=null,raf=0,last=0;
const now=()=>performance.now()/1000;
const R=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const IM={};function img(n){if(!IM[n]){const i=new Image();i.src='a/'+n;IM[n]=i}return IM[n]}
const AT=img('atlas.png');

function fit(){const r=$('#stage').getBoundingClientRect(),d=window.devicePixelRatio||1;W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);U=Math.min(W,H)/100}
function say(t){$('#say').textContent=t}
function score(t){$('#score').textContent=t}
function acts(list,cols){const a=$('#acts');a.innerHTML='';a.style.gridTemplateColumns='repeat('+(cols||list.length||1)+',1fr)';
  list.forEach(b=>{const e=document.createElement('button');e.textContent=b.t;if(b.k)e.className=b.k;if(b.off){e.style.visibility='hidden';e.disabled=true}e.onclick=b.f;a.appendChild(e)})}
function done(text){S.over=1;say(text+'  '+cur.ref);acts([{t:'AGAIN',k:'q',f:()=>start(cur.id)}])}

/* ---------- cut-out kit: the film's sprites ---------- */
function sp(n,x,y,rot,sx,sy,al){const m=M[n];if(!m||!AT.complete)return;if(sx===undefined)sx=1;if(sy===undefined)sy=Math.abs(sx);
  g.save();g.translate(x,y);if(rot)g.rotate(rot*Math.PI/180);g.scale(sx,sy);if(al!==undefined)g.globalAlpha*=al;
  g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=4;g.shadowOffsetX=2;g.shadowOffsetY=3;
  g.drawImage(AT,m[0],m[1],m[2],m[3],-m[4],-m[5],m[2],m[3]);g.restore()}
const hk=(n,h)=>h/M[n][3], wk=(n,w)=>w/M[n][2];
function bg(n,dim){const i=img('bg_'+n+'.jpg');g.fillStyle=INK;g.fillRect(0,0,W,H);if(i.complete&&i.naturalWidth){const k=Math.max(W/i.naturalWidth,H/i.naturalHeight),w=i.naturalWidth*k,h=i.naturalHeight*k;g.drawImage(i,(W-w)/2,(H-h)/2,w,h)}
  if(dim){g.fillStyle='rgba(20,14,10,'+dim+')';g.fillRect(0,0,W,H)}}
function floor(y,c){g.fillStyle=c||'#d2c4a6';g.fillRect(0,y,W,H-y);g.strokeStyle=INK;g.lineWidth=Math.max(2,U*.6);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();
  g.strokeStyle='rgba(90,74,56,.35)';g.lineWidth=1;for(let yy=y+5;yy<H;yy+=5){g.beginPath();g.moveTo(0,yy);g.lineTo(W,yy);g.stroke()}}
const FONT='Impact,"Arial Black",sans-serif';
function txt(s,x,y,size,o={}){g.font=(o.w||900)+' '+size+'px '+(o.f||FONT);g.textAlign=o.a||'center';g.textBaseline='middle';g.fillStyle=o.c||INK;g.fillText(s,x,y)}
function tag(s,x,y,size,o={}){g.font='900 '+size+'px '+FONT;const w=g.measureText(s).width+size*1.1,h=size*1.6;g.save();g.translate(x,y);g.rotate((o.r||0)*Math.PI/180);
  g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=4;g.shadowOffsetY=3;g.fillStyle=PAPER;g.fillRect(-w/2-3,-h/2-3,w+6,h+6);g.shadowColor='transparent';
  g.fillStyle=o.bg||KR;g.fillRect(-w/2,-h/2,w,h);g.strokeStyle=INK;g.lineWidth=2;g.strokeRect(-w/2,-h/2,w,h);txt(s,0,size*.06,size,{c:o.c||INK});g.restore();return w}
function fitSize(s,maxW,maxS){return Math.min(maxS,maxW/(s.length*.62+1.1))}

/* ---------- the dignitary rig, ported from cast.py ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const rotv=(v,d)=>{const t=d*Math.PI/180;return[v[0]*Math.cos(t)-v[1]*Math.sin(t),v[0]*Math.sin(t)+v[1]*Math.cos(t)]};
const dv=(d,l)=>{const t=d*Math.PI/180;return[-Math.sin(t)*l,Math.cos(t)*l]};
const segA=(a,b)=>Math.atan2(-(b[0]-a[0]),b[1]-a[1])*180/Math.PI;
const MH=524,PY=-184;
function fk(pel,face,lean,hip,knee,sh,el){const cw=f=>-f*face,J={pelvis:pel,face,tc:lean*face};
  J.neck=add(pel,rotv([0,-150],J.tc));J.shoulder=add(pel,rotv([6*face,-138],J.tc));J.back=add(pel,rotv([-62*face,-92],J.tc));
  ['n','f'].forEach((s,i)=>{const at=cw(hip[i]),k=add(pel,dv(at,90));J['knee_'+s]=k;J['ankle_'+s]=add(k,dv(at+cw(knee[i]),88));
    const au=J.tc+cw(sh[i]),e=add(J.shoulder,dv(au,70));J['elbow_'+s]=e;J['hand_'+s]=add(e,dv(au+cw(el[i]),66))});return J}
function walk(ph,face,stride){const s=Math.sin(ph),st=stride===undefined?24:stride;
  return fk([0,PY-Math.abs(Math.cos(ph))*5+4],face||1,4,[st*s,-st*s],[-Math.max(0,30*Math.sin(ph+1.3)),-Math.max(0,30*Math.sin(ph+1.3+Math.PI))],[-18*s,18*s],[14,14])}
function stand(face,lean,sh,el){return fk([0,PY],face||1,lean||0,[4,-6],[0,0],sh||[6,-4],el||[10,10])}
function man(x,fy,k,J,o={}){const fx=J.face>0?1:-1,hide=o.hide||'';
  g.save();g.translate(x,fy);g.scale(k,k);if(o.rot){g.translate(0,-262);g.rotate(o.rot);g.translate(0,262)}if(o.al!==undefined)g.globalAlpha*=o.al;
  const seg=(n,a,b)=>sp(n,a[0],a[1],segA(a,b),fx,1);
  if(!hide.includes('fa')){seg('f_upper',J.shoulder,J.elbow_f);seg('f_fore',J.elbow_f,J.hand_f);sp('f_hand',J.hand_f[0],J.hand_f[1],segA(J.elbow_f,J.hand_f),fx,1)}
  seg('f_thigh',J.pelvis,J.knee_f);seg('f_shin',J.knee_f,J.ankle_f);sp('f_foot',J.ankle_f[0],J.ankle_f[1],0,fx,1);
  if(o.pack)sp('backpack',J.back[0],J.back[1],J.tc,1);
  sp('n_torso',J.pelvis[0],J.pelvis[1],J.tc,fx,1);
  if(o.pack){const a=add(J.pelvis,rotv([14*fx,-140],J.tc)),b=add(J.pelvis,rotv([-8*fx,-64],J.tc));g.strokeStyle='#1e1a16';g.lineWidth=9;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
  const hs=o.head||'n_head',ho=hs==='boxhead'?6:hs==='beetle'?-30:0,hsc=(o.hs||1)*(hs==='duckrabbit'?1.25:1);
  sp(hs,J.neck[0],J.neck[1]+ho,J.tc,fx*hsc,hsc);
  seg('n_thigh',J.pelvis,J.knee_n);seg('n_shin',J.knee_n,J.ankle_n);sp('n_foot',J.ankle_n[0],J.ankle_n[1],0,fx,1);
  if(o.held)sp(o.held,J.hand_n[0]+10*fx,J.hand_n[1]+20,0,o.heldk||1.3);
  if(!hide.includes('na')){seg('n_upper',J.shoulder,J.elbow_n);seg('n_fore',J.elbow_n,J.hand_n);sp('n_hand',J.hand_n[0],J.hand_n[1],segA(J.elbow_n,J.hand_n),fx,1)}
  g.restore()}

const G={};

/* ---------- 1 the stairs: a word is an order ---------- */
const ITEMS=['BOX','BAG','PACK','BELT'];
G.stairs={name:'The stairs',ref:'PI §1, §2, §107',line:'A word is an order.',art:'t1.jpg',
  init(){S={me:0,st:0,call:[],i:0,t0:0,dur:7,fl:-9,vx:0};this.next()},
  next(){const n=S.me<4?1:S.me<8?2:3;S.call=shuf(ITEMS).slice(0,n);S.i=0;S.t0=now();S.dur=7-S.me*.3;this.ui()},
  ui(){score('ME '+S.me+' / STAIRS '+S.st);say('Fetch what is called, in the order called, before the bar runs out.');acts(ITEMS.map(w=>({t:w,f:()=>this.tap(w)})))},
  tap(w){if(S.over)return;if(w===S.call[S.i]){S.i++;if(S.i===S.call.length){S.me++;if(S.me===12){score('ME 12 / STAIRS '+S.st);return done('Top floor. Nobody asked what BOX names. It was an order every time.')}this.next()}}else this.miss()},
  miss(){S.st++;S.fl=now();if(S.st===12){score('ME '+S.me+' / STAIRS 12');return done('The stairs win. Back to the rough ground.')}this.next()},
  draw(t,dt){
    if(!S.over&&t-S.t0>S.dur)this.miss();
    bg('stairs',.25);
    const fl=H*.95,x0=W*.14,sx=W*.8/13,sy=H*.46/12;
    g.fillStyle=KR;g.strokeStyle=INK;g.lineWidth=Math.max(2,U*.6);g.beginPath();g.moveTo(x0,fl);g.lineTo(x0+sx,fl);
    for(let i=0;i<12;i++){g.lineTo(x0+(i+1)*sx,fl-(i+1)*sy);g.lineTo(x0+(i+2)*sx,fl-(i+1)*sy)}
    g.lineTo(x0+13*sx,fl);g.closePath();g.fill();g.stroke();
    g.strokeStyle='rgba(60,40,20,.4)';g.lineWidth=1;for(let i=1;i<12;i++){g.beginPath();g.moveTo(x0+(i+1)*sx,fl-i*sy);g.lineTo(x0+(i+1)*sx,fl);g.stroke()}
    S.vx+=(S.me-S.vx)*Math.min(1,dt*8);const mv=Math.abs(S.me-S.vx)>.03;
    const k=Math.min(H*.25,W*.36)/MH;man(x0+(S.vx+.5)*sx,fl-S.vx*sy,k,mv?walk(t*14):stand(1,4),{pack:1});
    sp('boxscore',W-U*11,H*.34,6,hk('boxscore',Math.min(H*.16,U*20)));
    if(S.over)return;
    const str=S.call.join(' IN '),size=fitSize(str,W*.86,H*.075);g.font='900 '+size+'px '+FONT;
    const full=g.measureText(str).width;tag(str,W/2,H*.1,size,{r:-1.5});
    if(S.i){const dw=g.measureText(S.call.slice(0,S.i).join(' IN ')).width;g.strokeStyle=RED;g.lineWidth=size*.12;g.beginPath();g.moveTo(W/2-full/2,H*.1);g.lineTo(W/2-full/2+dw,H*.1);g.stroke()}
    const f=clamp(1-(t-S.t0)/S.dur,0,1);g.fillStyle=PAPER;g.fillRect(W*.2,H*.1+size*1.25,W*.6*f,Math.max(4,U*1.2));
    if(t-S.fl<.8)tag('STAIRS +1',W/2,H*.27,Math.min(H*.035,W*.05),{bg:RED,c:PAPER,r:3});
  }};

/* ---------- 2 everyone has a box: the contents cancel out ---------- */
const INBOX=['a bug','the word BEETLE','a frog','a smaller box','nothing'];
G.beetle={name:'Everyone has a box',ref:'PI §293',line:'What is inside drops out.',art:'t2.jpg',
  init(){S={steps:0,t0:now(),P:.7,last:-1,looks:[],asked:0,open:null,bub:null,stum:-9,hit:-9};
    score('STEP 0 / 16');say('Press MARCH as the ring closes. Tap any box to look inside.');acts([{t:'MARCH',f:()=>this.march()}])},
  march(){if(S.over)return;const bt=now()-S.t0,k=Math.round(bt/S.P),err=Math.abs(bt-k*S.P);
    if(err<.19&&k!==S.last){S.last=k;S.steps++;S.hit=now();score('STEP '+S.steps+' / 16');
      if(S.steps===16)done('The line arrived. In your box you saw: '+(S.looks.join(', ')||'you never looked')+'. You asked '+S.asked+' other'+(S.asked===1?'':'s')+'; each said BEETLE.')}
    else{S.stum=now();say('Out of step. Press as the ring closes.')}},
  down(x){if(S.over)return;const i=clamp(Math.floor(x/W*5),0,4),t=now();
    if(i===2){const c=R(INBOX);S.looks.push(c);S.open={c,u:t+1.8};S.bub=null;say('Your box holds '+c+'. Look again and it may not.')}
    else{S.asked++;S.bub={i,u:t+1.3};S.open=null;say('That box stays shut. Its owner says: BEETLE.')}},
  draw(t){
    bg('pallets',.5);const fl=H*.88;floor(fl);
    const k=Math.min(W/5/215,H*.5/MH),bt=t-S.t0,d=1-((bt/S.P)%1);
    const ph=S.steps*Math.PI/2+Math.max(0,1-(t-S.hit)*4)*-.8,off=(S.steps*W/16)%(W/6);
    g.strokeStyle=INK;g.lineWidth=2;for(let x=-off;x<W;x+=W/6){g.beginPath();g.moveTo(x,fl+U*3);g.lineTo(x+U*5,fl+U*3);g.stroke()}
    for(let i=0;i<5;i++){const x=W*(i+.5)/5-k*40,st=i===2&&t-S.stum<.4?Math.sin(t*40)*U:0,J=walk(ph+i*.0,1,20);
      J.elbow_n=add(J.shoulder,dv(-40,70));J.hand_n=add(J.elbow_n,dv(-95,66));J.elbow_f=add(J.shoulder,dv(-30,70));J.hand_f=add(J.elbow_f,dv(-90,66));
      man(x+st,fl,k,J,{held:'smallbox',heldk:1.5});
      if(i===2)tag('YOU',x,fl+U*6,Math.max(11,U*3.2),{bg:RED,c:PAPER})}
    if(!S.over){const R0=Math.min(U*6,H*.06),cy=H*.11;g.strokeStyle=PAPER;g.lineWidth=Math.max(3,U*.8);g.beginPath();g.arc(W/2,cy,R0,0,7);g.stroke();
      if(t-S.hit<.15){g.fillStyle=PAPER;g.fill()}g.lineWidth=2;g.beginPath();g.arc(W/2,cy,R0*(1+d*1.3),0,7);g.stroke()}
    const ps=Math.min(W*.3,H*.2),py=fl-k*MH-ps*.62;
    if(S.open&&t<S.open.u){const x=W/2;g.fillStyle=PAPER;g.strokeStyle=INK;g.lineWidth=3;g.fillRect(x-ps/2,py-ps/2,ps,ps);g.strokeRect(x-ps/2,py-ps/2,ps,ps);const c=S.open.c;
      if(c==='a bug')sp('beetle',x-ps*.05,py,-90,hk('beetle',ps*.5));else if(c==='a frog')sp('frog_green',x,py+ps*.42,0,hk('frog_green',ps*.8));
      else if(c==='a smaller box')sp('smallbox',x,py+ps*.3,0,hk('smallbox',ps*.55));else if(c!=='nothing')tag('BEETLE',x,py,ps*.17,{r:-4})}
    if(S.bub&&t<S.bub.u)tag('BEETLE.',clamp(W*(S.bub.i+.5)/5,W*.2,W*.8),py+ps*.2,Math.max(13,ps*.2),{r:S.bub.i%2?3:-3});
  }};

/* ---------- 3 the word-stairs: climb it, kick it away ---------- */
const RH=['KNOX','FOX','SOCKS','CLOCKS','BLOCKS','ROCKS','LOCKS','KNOCKS'];
const DEC=['BAG','BACK','BOOKS','BIKES','BEAKS','TAPE','TRUCK','STAIR','BELT','BOSS','BOAT','BUCKS','FIX','SACKS','LICKS','BRICK','FAX','COAT'];
G.ladder={name:'The word-stairs',ref:'Tractatus 6.54; Culture and Value',line:'Climb it, then kick it away.',art:'t3.jpg',
  init(){S={r:['BOX'],ph:0,t0:0,sh:-9};this.ui()},
  ui(){score(S.r.length+' / 9');
    if(S.r.length===9){S.ph=1;say('You are at the top.');return acts([{t:'THROW AWAY THE LADDER',k:'u',f:()=>{S.ph=2;S.t0=now();say('');acts([])}}])}
    say('Add the word that rhymes with BOX. A wrong word breaks a rung.');
    const want=RH[S.r.length-1];acts(shuf([want,...shuf(DEC).slice(0,2)]).map(w=>({t:w,f:()=>this.tap(w,want)})))},
  tap(w,want){if(S.ph)return;if(w===want)S.r.push(w);else{S.sh=now();if(S.r.length>1)S.r.pop()}this.ui()},
  draw(t){
    bg('stage');const fl=H*.95,rh=Math.min(H*.066,W*.105),rw=rh*2.75,x0=W*.5-rh*1.2,dt=t-S.t0,k=Math.min(H*.22,W*.34)/MH;
    floor(fl);
    if(S.ph<2){const jig=t-S.sh<.3?Math.sin(t*50)*U:0;
      S.r.forEach((w,i)=>sp('label_'+i,x0+i*rh*.3+jig,fl-i*rh,(i%2?1.5:-1.5),wk('label_'+i,rw)));
      const n=S.r.length;man(x0+(n-1)*rh*.3+jig,fl-n*rh+rh*.08,k,stand(1,0,[10+Math.sin(t*3)*6,-8]),{pack:1})}
    else{const q=Math.min(dt,1.4);
      S.r.forEach((w,i)=>{const x=x0+i*rh*.3+(i%2?1:-1)*q*W*.42*(.5+i/9),y=Math.min(fl-rh*.3,fl-i*rh+q*q*H*.4*(1+i*.1));sp('label_'+i,x,y,(i%2?1:-1)*q*(40+i*14),wk('label_'+i,rw))});
      const top=fl-9*rh,py=Math.min(fl,top+Math.max(0,dt-.25)**2*H*1.6);
      man(x0+8*rh*.3,py,k,py<fl?fk([0,PY],1,-8,[30,-20],[-40,-10],[150,-140],[20,-20]):stand(1,0),{pack:1});
      if(dt>1.6&&!S.over)done('You are standing where you began. The rungs were nonsense, and they held.')}
  }};

/* ---------- 4 rabbit, duck, fly: the drawing does not change ---------- */
G.aspect={name:'Rabbit, duck, fly',ref:'PI II xi, §309',line:'The drawing does not change.',art:'t4.jpg',
  init(){S={st:0,n:0,calls:0,asp:null,it:null,ang:180,fx:0,fy:60,out:0,res:'',rt:-9,drag:null};this.spawn();this.ui()},
  spawn(){S.it={k:R(['CARROT','BREAD']),t0:now(),dur:Math.max(1.5,2.8-S.n*.15)}},
  ui(){if(S.st===0){score(S.n+' / 8');say('A carrot is for a rabbit. Bread is for a duck. Call what you see before it lands.');
      acts([{t:'RABBIT!',f:()=>this.call('RABBIT')},{t:'DUCK!',f:()=>this.call('DUCK')}])}
    else{score('');say('Show the fly the way out. It only flies up. Drag the bottle or press TURN.');acts([{t:'TURN',f:()=>{S.ang+=30}}])}},
  call(a){if(S.over)return;if(S.asp!==a)S.calls++;S.asp=a},
  down(x,y){if(S.st===1)S.drag={a:Math.atan2(y-H/2,x-W/2),g:S.ang}},
  move(x,y){if(S.st===1&&S.drag)S.ang=S.drag.g+(Math.atan2(y-H/2,x-W/2)-S.drag.a)*180/Math.PI},
  up(){S.drag=null},
  draw(t,dt){
    bg('stage');floor(H*.84);
    if(S.st===0){const k=Math.min(W*.8/166,H*.42/118),cx=W/2,cy=H*.62;sp('duckrabbit',cx+k*34-k*0,cy+k*52,0,k);
      tag(S.asp?'SEEN AS: '+S.asp:'SEEN AS:',W/2,H*.92,Math.max(12,U*4));
      const it=S.it,q=(t-it.t0)/it.dur,u=Math.min(U,H/70),iy=H*.07+(cy-k*50-H*.07)*Math.min(q,1);
      if(it.k==='CARROT'){g.fillStyle='#d2691e';g.strokeStyle=INK;g.lineWidth=2.5;g.beginPath();g.moveTo(W/2-u*3.5,iy-u*6);g.lineTo(W/2+u*3.5,iy-u*6);g.lineTo(W/2,iy+u*7);g.closePath();g.fill();g.stroke();g.strokeStyle='#3d6b2a';g.lineWidth=u*1.2;g.beginPath();g.moveTo(W/2,iy-u*6);g.lineTo(W/2-u*2.5,iy-u*11);g.moveTo(W/2,iy-u*6);g.lineTo(W/2+u*2.5,iy-u*11);g.stroke()}
      else{g.fillStyle='#d9b26a';g.strokeStyle=INK;g.lineWidth=2.5;g.beginPath();g.ellipse(W/2,iy,u*7,u*4.5,0,0,7);g.fill();g.stroke();g.lineWidth=1.5;for(const d of[-3,0,3]){g.beginPath();g.moveTo(W/2+d*u-u,iy-u*2);g.lineTo(W/2+d*u+u,iy+u*1);g.stroke()}}
      txt(it.k,W/2+u*10,iy,Math.max(11,u*3.6),{a:'left'});
      if(t-S.rt<.7)tag(S.res,W/2,H*.3,Math.max(12,u*4),{bg:S.res==='EATEN'?KR:RED,c:S.res==='EATEN'?INK:PAPER,r:-3});
      if(q>=1){const ok=(it.k==='CARROT'&&S.asp==='RABBIT')||(it.k==='BREAD'&&S.asp==='DUCK');S.res=ok?'EATEN':'REFUSED';S.rt=t;if(ok)S.n++;
        if(S.n===8){S.st=1;this.ui()}else{score(S.n+' / 8');this.spawn()}}
      return}
    // bottle in the film's design units: neck up at y=-150, base at y=120, drawn about (0,-15)
    const k=Math.min(W*.42/178,H*.5/302),cx=W/2,cy=H/2,a=S.ang*Math.PI/180;
    const mx=y=>y>-60?56:y>-110?8+(y+110)*.96:8;
    if(!S.out){const spd=110*dt,lx=-Math.sin(a),ly=-Math.cos(a);
      let ny=Math.min(S.fy+ly*spd+(Math.random()-.5)*3,105),nx=S.fx+lx*spd+(Math.random()-.5)*6;
      if(ny<-60&&Math.abs(S.fx)>mx(ny)+6)ny=S.fy;S.fy=ny;S.fx=clamp(nx,-mx(ny),mx(ny));
      if(S.fy<-150){S.out=t;const p=rotv([S.fx,S.fy+15],S.ang);S.ox=cx+p[0]*k;S.oy=cy+p[1]*k}}
    g.save();g.translate(cx,cy);g.rotate(a);g.scale(k,k);
    const m=M.bottle;g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=6;g.shadowOffsetY=4;g.drawImage(AT,m[0],m[1]+25,m[2],m[3]-25,-m[4],-m[5]+25+135,m[2],m[3]-25);g.restore();
    if(!S.out)sp('fly',S.fx,S.fy+15,-S.ang+Math.sin(t*30)*10,1.5);
    g.restore();
    if(S.out){const y=S.oy-(t-S.out)*H*.5;sp('fly',S.ox+Math.sin(t*9)*U*3,y,Math.sin(t*30)*10,k*1.5);
      if(!S.over&&t-S.out>1)done('The fly is out. The neck was open the whole time. Before that, the drawing never changed; what you called it changed '+S.calls+' times.')}
  }};

/* ---------- 5 constraint mode: nothing stretches ---------- */
G.rig={name:'Constraint mode',ref:'PI §193–194; Sketchpad',line:'Nothing stretches.',art:'t5.jpg',
  B:[[.64,-330],[.93,-400],[.07,-250],[.82,-200],[.4,-440]],
  init(){S={got:0,steps:0,px:W*.3,vx:W*.3,want:null,tg:null,ok:true,face:1};this.ui()},
  ui(){score('BOX '+S.got+' / 5');say('Reach the box. Drag the hand or press REACH. If it will not solve, move the pinned feet.');
    acts([{t:'STEP LEFT',k:'s',f:()=>this.step(-1)},{t:'REACH',f:()=>{S.want=this.bx()}},{t:'STEP RIGHT',k:'s',f:()=>this.step(1)}])},
  k(){return Math.min(H*.6/MH,W/420)},
  bx(){const b=this.B[S.got];return[W*b[0],H*.9+b[1]*this.k()]},
  step(d){if(S.over)return;const nx=clamp(S.px+d*this.k()*60,W*.06,W*.94);if(nx===S.px)return;S.px=nx;S.steps++;S.want=null},
  down(x,y){if(!S.over)S.want=[x,y]},move(x,y){if(!S.over&&S.want)S.want=[x,y]},
  solve(tx,ty){ // design units, man at origin; PIN ankles, LENGTH exact, ATTACH soft
    const face=tx>=0?1:-1;let best=null;
    for(let i=0;i<=10;i++){const lean=i*3*face,sh=add([0,PY],rotv([6*face,-138],lean)),d=Math.hypot(tx-sh[0],ty-sh[1]);
      if(d<=136&&d>=4){best={lean,sh,d,ok:true};break}if(!best||d<best.d)best={lean,sh,d,ok:false}}
    const J=fk([0,PY],face,best.lean*face,[4,-6],[0,0],[6,-4],[10,10]),sh=best.sh,ang=Math.atan2(ty-sh[1],tx-sh[0]),L=clamp(best.d,5,135.9);
    const ca=(70*70+L*L-66*66)/(2*70*L),e1=ang+face*Math.acos(clamp(ca,-1,1));
    J.elbow_n=[sh[0]+70*Math.cos(e1),sh[1]+70*Math.sin(e1)];const hx=sh[0]+L*Math.cos(ang),hy=sh[1]+L*Math.sin(ang);
    J.hand_n=[hx,hy];J.ok=best.ok;J.reach=best.d;return J},
  draw(t,dt){
    const k=this.k(),fl=H*.9;g.fillStyle='#050805';g.fillRect(0,0,W,H);
    S.vx+=(S.px-S.vx)*Math.min(1,dt*9);const moving=Math.abs(S.px-S.vx)>1;
    const rest=[S.vx+60*k*S.face,fl-250*k],want=S.want||rest;if(!S.tg)S.tg=rest.slice();
    S.tg[0]+=(want[0]-S.tg[0])*Math.min(1,dt*10);S.tg[1]+=(want[1]-S.tg[1])*Math.min(1,dt*10);
    const J=this.solve((S.tg[0]-S.vx)/k,(S.tg[1]-fl)/k);S.face=J.face;
    man(S.vx,fl,k,moving?walk(t*14,J.face):J,{al:.3,pack:1});
    g.save();g.translate(S.vx,fl);g.scale(k,k);g.strokeStyle=GRN;g.fillStyle=GRN;g.lineWidth=2.5/k;g.lineCap='round';
    const P=(...a)=>{g.beginPath();a.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();a.forEach(q=>{g.beginPath();g.arc(q[0],q[1],4/k,0,7);g.fill()})};
    if(!moving){P(J.ankle_n,J.knee_n,J.pelvis,J.knee_f,J.ankle_f);P(J.pelvis,J.neck);P(J.shoulder,J.elbow_n,J.hand_n);
      for(const an of[J.ankle_n,J.ankle_f]){g.beginPath();g.moveTo(an[0]-10,an[1]+18);g.lineTo(an[0],an[1]);g.lineTo(an[0]+10,an[1]+18);g.closePath();g.stroke()}}
    g.restore();
    g.strokeStyle=GRN;g.lineWidth=2;g.beginPath();g.moveTo(0,fl);g.lineTo(W,fl);g.stroke();
    const fs=Math.max(10,Math.min(U*3.2,13)),mono={a:'left',c:GRN,w:400,f:'ui-monospace,Menlo,monospace'};
    if(!S.over){const b=this.bx(),tb=this.solve((b[0]-S.px)/k,(b[1]-fl)/k),bs=U*9;
      sp('smallbox',b[0],b[1]+bs*.45,0,hk('smallbox',bs),undefined,tb.ok?1:.55);
      g.strokeStyle=GRN;g.setLineDash(tb.ok?[]:[5,5]);g.strokeRect(b[0]-bs*.6,b[1]-bs*.6,bs*1.2,bs*1.2);g.setLineDash([]);
      const near=S.want&&Math.hypot(S.want[0]-b[0],S.want[1]-b[1])<U*8,bad=!tb.ok&&near;
      txt('SKETCHPAD // CONSTRAINT MODE',8,fs,fs,mono);txt('PIN ankle_n = plant_n   PIN ankle_f = plant_f',8,fs*2.4,fs,mono);
      txt('reach '+Math.round(tb.reach)+' / 136   steps '+S.steps,8,fs*3.8,fs,mono);
      if(bad)txt('UNSOLVABLE: nothing stretched',8,fs*5.4,fs*1.15,{a:'left',c:'#fff',w:700,f:mono.f});
      if(J.ok&&!moving&&near&&Math.hypot(S.vx+J.hand_n[0]*k-b[0],fl+J.hand_n[1]*k-b[1])<U*3){S.got++;S.want=null;score('BOX '+S.got+' / 5');
        if(S.got===5)done('Five boxes, '+S.steps+' steps. No limb changed length. The feet moved instead.')}}
  }};

/* ---------- 6 ten verbs: one rule changes per stamp ---------- */
const VERBS=['DETACH','INVERT','ENLARGE','REPLACE','HATCH','SWALLOW','EMERGE','ENTER','INTERRUPT','PACK'];
const RULE={DETACH:'An arm unpins. It is still the same man.',INVERT:'Gravity turns about one point. The hat is now the floor.',ENLARGE:'Sizes stop holding still. The beetle no longer fits a box.',
  REPLACE:'A new head in the same socket. The slot decides the role.',HATCH:'The box was an egg. A new player arrives with new rules.',SWALLOW:'Container and carrier change places.',
  EMERGE:'Tape becomes marching bodies by one rule of projection.',ENTER:'A whole mover becomes one box in the truck.',INTERRUPT:'Stopped from outside the frame. The stage is as it was.'};
const HEADS=[null,'boxhead','duckrabbit','frog_dj'];
G.verbs={name:'Ten verbs',ref:'Tractatus 5.632, 7',line:'One rule changes per stamp.',art:'t6.jpg',
  fresh(){return{arm:0,inv:0,bee:0,head:0,frog:0,sw:0,ent:0}},
  init(){S={s:this.fresh(),c:{arm:0,inv:0,bee:0,frog:0,sw:0,ent:0,pack:0},used:new Set(),ft:-9,ct:-9,pt:-9,pk:0,msg:'Stamp a verb. Each one changes one rule of the stage.'};this.ui()},
  vis(){return!S.s.sw&&!S.s.ent},
  ok(v){const s=S.s,vis=this.vis();if(S.pk)return false;
    return v==='DETACH'?vis&&!s.arm:v==='INVERT'||v==='REPLACE'||v==='ENTER'?vis:v==='ENLARGE'?!s.bee:v==='HATCH'?!s.frog:v==='SWALLOW'?s.frog&&vis:v==='EMERGE'?!!s.sw:v==='INTERRUPT'?true:S.used.size===9&&vis},
  ui(){score(S.used.size+' / 9');say(S.msg);acts(VERBS.map(v=>({t:v,k:'s'+(S.used.has(v)?' q':'')+(v==='PACK'?' u':''),off:!this.ok(v),f:()=>this.go(v)})),innerWidth>600?10:5)},
  go(v){const s=S.s,t=now();if(!this.ok(v))return;
    if(v==='DETACH')s.arm=1;else if(v==='INVERT')s.inv=s.inv?0:1;else if(v==='ENLARGE')s.bee=1;else if(v==='REPLACE')s.head=(s.head+1)%4;
    else if(v==='HATCH')s.frog=1;else if(v==='SWALLOW')s.sw=1;else if(v==='EMERGE'){s.sw=0;S.ct=t}else if(v==='ENTER')s.ent=1;
    else if(v==='INTERRUPT'){S.s=this.fresh();S.ft=t}
    else{S.pk=1;S.pt=t;say('');acts([],5);return}
    S.used.add(v);S.msg=RULE[v]+(S.used.size===9?' Nine stamped. One verb is left.':'');this.ui()},
  draw(t,dt){
    const s=S.s,c=S.c,kk=Math.min(1,dt*7),fl=H*.9,ps=Math.min(H*.52,W*.62),k=ps/MH,px=W*.5;
    for(const key of['arm','inv','bee','frog','sw','ent'])c[key]+=(s[key]-c[key])*kk;
    c.pack+=(S.pk-c.pack)*Math.min(1,dt*3);
    bg('truck',.45);floor(fl);
    const bk=hk('beetle',U*7)+c.bee*(Math.min(W*.95/444,H*.6/324)-hk('beetle',U*7)*.74)/.74*.74;
    if(c.bee>.5)sp('beetle_big',px,fl-H*.42*c.bee,-90,Math.min(W*.9/324,H*.75/444)*c.bee);else sp('beetle',W*.3+(px-W*.3)*c.bee*2,fl-U*4-c.bee*H*.4,-90,hk('beetle',U*7)*(1+c.bee*6));
    const ex=W*.16,es=Math.min(W*.3,ps*.5),ek=wk('fragile_box',es);
    sp('fragile_box',ex,fl+2,c.frog>.3?-4:0,ek);
    if(c.frog>.05&&c.sw<.3)sp('frog_dj',ex,fl-es*.42,0,hk('frog_dj',es*.75)*Math.min(1,c.frog));
    const a=(1-c.sw)*(1-c.ent);
    if(a>.04){const tx=W*.72,ty=fl-H*.2,x=px+(tx-px)*c.ent,y=fl+(ty-fl)*c.ent,sc=k*(1-c.ent*.85)*(1-c.sw*.6);
      const J=stand(1,2,[6+Math.sin(t*2)*5,-4]);
      if(c.arm>.05&&a>.5){const ay=Math.min(1,c.arm*1.3);g.save();g.translate(px-k*70,fl-k*20-(1-ay)*k*300);g.scale(k,k);sp('n_upper',0,0,90);sp('n_fore',-70,0,90);sp('n_hand',-136,0,90);g.restore()}
      man(x,y,sc,J,{rot:c.inv*Math.PI,hide:s.arm?'na':'',head:HEADS[s.head],pack:1,al:clamp(a*1.6,0,1)});
      if(c.ent>.5)sp('smallbox',tx,ty,0,hk('smallbox',U*9)*c.ent)}
    else if(s.ent)sp('smallbox',W*.72,fl-H*.2,0,hk('smallbox',U*9));
    if(c.sw>.05){const fs=es*(.75+c.sw*1.6);sp('frog_boxed',ex+(px-ex)*c.sw,fl,0,hk('frog_boxed',fs))}
    const ce=t-S.ct;if(ce<2.4){const cx=W*.26,cy=H*.24,cw=Math.min(W*.4,ps*.7);sp('cassette',cx,cy,-6,wk('cassette',cw));
      for(let i=0;i<4;i++){const q=ce*.5-i*.12;if(q>0&&q<1)man(cx+q*(W*.9-cx),cy+cw*.3+q*(fl-cy-cw*.3),k*.38,walk(t*13+i),{pack:1,head:i%2?'boxhead':null})}}
    const fe=t-S.ft;if(fe<1.4){const fy=fe<.2?fe/.2:fe<.9?1:Math.max(0,1-(fe-.9)/.4),hkk=Math.min(W*.5/184,H*.7/472);
      sp('hand_giant',W*.5,-H*.1+fy*(fl-H*.25+H*.1),0,hkk);if(fe>.2)sp('handlecare',W*.5,H*.2,-7,wk('handlecare',Math.min(W*.7,H*.6)))}
    if(c.pack>.01){const bh=ps*1.25*Math.min(1,c.pack*1.3);sp('boxhead',px,fl+bh*.03,0,hk('boxhead',bh));
      if(t-S.pt>1.8&&!S.over)done('WHEREOF ONE CANNOT SPEAK, THEREOF ONE MUST PACK. The mover is inside his own box.')}
  }};

/* ---------- shell ---------- */
const ORDER=['stairs','beetle','ladder','aspect','rig','verbs'];
ORDER.forEach((id,i)=>{const G_=G[id];G_.id=id;const b=document.createElement('button');b.style.backgroundImage='url(a/'+G_.art+')';
  b.innerHTML='<div><b></b><span></span></div>';b.querySelector('b').textContent=(i+1)+'  '+G_.name;b.querySelector('span').textContent=G_.line;b.onclick=()=>{location.hash=id};$('#tiles').appendChild(b)});
function start(id){cur=G[id];$('#hub').hidden=true;$('#game').hidden=false;$('#name').textContent=cur.name;
  fit();S=null;cur.init();last=now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function home(){cancelAnimationFrame(raf);cur=null;S=null;$('#game').hidden=true;$('#hub').hidden=false}
function loop(){if(!cur)return;const t=now(),dt=Math.min(.05,t-last);last=t;g.clearRect(0,0,W,H);cur.draw(t,dt);raf=requestAnimationFrame(loop)}
function route(){const id=location.hash.slice(1);if(G[id])start(id);else home()}
$('#exit').onclick=()=>{location.hash=''};
addEventListener('hashchange',route);addEventListener('resize',()=>{if(cur)fit()});
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{if(cur&&cur.down&&S){cv.setPointerCapture(e.pointerId);cur.down(...pos(e))}});
cv.addEventListener('pointermove',e=>{if(cur&&cur.move&&S&&(e.buttons||e.pointerType==='touch'))cur.move(...pos(e))});
cv.addEventListener('pointerup',()=>{if(cur&&cur.up&&S)cur.up()});
route();
</script>
