<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Who Did What · The Abominable House on One Page</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Every film of the Abominable House on one page: pick one from the row under the screen or let them play in order with voices.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: no page scroll. The screen is on top and already playing. Under it: one row of numbered films to tap, then one row of pages to use by hand. Nothing covers the screen. */
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14110e;color:#f4eedd;font:600 12px "JetBrains Mono",ui-monospace,Menlo,monospace;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden}
#top{display:flex;gap:6px;align-items:center;padding:6px 8px}
#top b{font:800 clamp(18px,5vw,28px)/1 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,a.b{font:inherit;letter-spacing:.05em;color:#f4eedd;background:#1d1812;border:1px solid #6f6456;padding:8px 10px;cursor:pointer;text-decoration:none;text-align:left}
button[aria-pressed="true"]{background:#ffdc00;color:#1d1812;border-color:#ffdc00}button:focus-visible,a:focus-visible{outline:2px solid #ffdc00;outline-offset:2px}
#snd[aria-pressed="false"]{background:#e0603f;color:#14110e;border-color:#e0603f}
#stage{position:relative;min-height:0;border-top:1px solid #3a332b;border-bottom:1px solid #3a332b}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#14110e}
#films{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:1px;background:#3a332b}
#films button{border:0;padding:8px 8px 9px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center}
#films button i{font:800 30px/1 "Big Shoulders Display",Impact,sans-serif;font-style:normal;grid-row:span 2}
#films button b{font:800 clamp(13px,3.3vw,19px)/1.05 "Big Shoulders Display",Impact,sans-serif;text-transform:uppercase}
#films button span{color:#958a7a;font-size:11px}#films button[aria-pressed="true"] span{color:#1d1812}
#more{display:flex;gap:4px;align-items:center;padding:6px 8px;overflow-x:auto;white-space:nowrap}#more span{color:#958a7a}#more a{padding:6px 8px;font-size:11px}
@media (max-width:560px){#films{grid-template-columns:repeat(2,minmax(0,1fr))}#films button span{display:none}}
</style></head><body>
<div id="top"><b>Who did what</b><button id="snd" aria-pressed="false">TAP FOR SOUND</button><button id="auto" aria-pressed="true">PLAY IN ORDER</button></div>
<div id="stage"><iframe id="fr" title="Current film" allow="autoplay"></iframe></div>
<div id="films" role="group" aria-label="Films"></div>
<div id="more"><a class="b" id="alone" href="#">OPEN THIS FILM ALONE</a><span>USE BY HAND:</span></div>
<script>
// WATCH is read by each film page (through live/flow.js) to know it is being shown here and whether to speak.
window.WATCH={voice:false};
const M=window.WATCH_MAP||{},A=window.WATCH_ALONE||{},SKIP=window.WATCH_SKIP||[],u=f=>M[f]||('live/'+f),$=id=>document.getElementById(id);
const PL=[['rerereorder.html','The List Has No Names','2 min · the case in ten lines',0],['abom.html','The Story, Drawn in Code','1 min 36 s · the first film',98],['reorder.html','Re:Order in Crime','13 min · nine episodes on the program',0],['rereorder.html','Six Readings','6 min · six theories, one tower',0]].filter(p=>!SKIP.includes(p[0]));
const HANDS=[['film.html','FILM BANK'],['player.html','DEED BANK'],['guide.html','GUIDE'],['numbers.html','THE COUNT'],['policies.html','THE POLICIES'],['array.html','THE ARRAY'],['flow.html','ALL TEN STOPS']];
let i=0,timer=0,auto=true;
$('films').style.setProperty('--n',PL.length);
$('films').innerHTML=PL.map((p,k)=>'<button data-k="'+k+'" aria-pressed="false"><i>'+(k+1)+'</i><b>'+p[1]+'</b><span>'+p[2]+'</span></button>').join('');
$('more').insertAdjacentHTML('beforeend',HANDS.map(h=>'<a class="b" href="'+(M[h[0]]||(h[0]==='flow.html'?'flow.html':'live/'+h[0]))+'">'+h[1]+'</a>').join(''));
function play(k){clearTimeout(timer);i=((k%PL.length)+PL.length)%PL.length;const p=PL[i];$('fr').src='about:blank';setTimeout(()=>{$('fr').src=u(p[0])},30);[...$('films').children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i));$('alone').href=A[p[0]]||u(p[0]);if(p[3]&&auto)timer=setTimeout(()=>play(i+1),p[3]*1000)}
addEventListener('message',e=>{if(e.data==='film:end'&&e.source===$('fr').contentWindow&&auto&&i<PL.length-1)play(i+1)});
function sound(on){WATCH.voice=on;$('snd').setAttribute('aria-pressed',on);$('snd').textContent=on?'SOUND ON':'TAP FOR SOUND'}
$('films').onclick=e=>{const b=e.target.closest('button');if(!b)return;sound(true);play(+b.dataset.k)};
$('snd').onclick=()=>{sound(!WATCH.voice);play(i)};
$('auto').onclick=()=>{auto=!auto;$('auto').setAttribute('aria-pressed',auto)};
play(0);
</script></body></html>
