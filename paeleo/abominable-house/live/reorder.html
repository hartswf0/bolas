 {s:'W',sc:'tower',x:'All 8,916,100,448,256 specks weigh about 1,462 kilograms. That is sixty-four fifty-pound sacks, which is one loaded pallet.'},
 {s:'W',sc:'time',x:'It is small to store and long to watch. At one film in every frame, twenty-four frames a second, the projector would run for 11,772 years.'},
