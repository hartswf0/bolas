// Re:Order in Crime. Each episode is a list of lines. A line names who speaks, what they say, which deed plays
// behind them, and one drawing (fx) put on the picture. The deeds are drawn by the same modules as the deed bank;
// every number and every thought shown is read from the film bank's own code for film 1,541,585,241,617.
const $=id=>document.getElementById(id),IDS=LEDGER.IDS,PAIRS=LEDGER.PAIRS,ORDER=LEDGER.ORDER,NAMES=STORY.NAMES,WHO={R:'Roessler',B:'Belindo',I:'Inigo',O:'Ogiva'},ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

const SPK={W:'WALDEMAR · programmer',S:'SKILLER · insurer',AU:'THE WATCHERS',R:'ROESSLER',B:'BELINDO',I:'INIGO',O:'OGIVA'};

const EP=[
{t:'1 · The index',sum:'What Waldemar is given, and who gave it to him.',b:[
 {s:'W',k:5,fx:'index',x:'All I have is a list of twelve headings. No names, and no order.'},

 {s:'S',k:5,fx:'index',sk:1,x:'I brought him the list.'},
 {s:'W',k:5,fx:'noise',sk:1,x:'In my last hypothesis Skiller chose what reached me, and some of the headings are only noise. The story does not say which.'},
 {s:'W',k:5,fx:'two',sk:1,x:'So there are two questions. What happened in the house? And what would someone with an interest write in the index?'},
 {s:'W',k:5,fx:'two',sk:1,x:'The program on this site answers only the first. It treats the index as honest.'}]},
{t:'2 · Programming a sack',sum:'What Waldemar sets, and what the sack then does with it.',b:[
 {s:'W',k:0,fx:'card',x:()=>'I do not move a sack. I punch a card for it: a goal, a temperament, and one sentence it lives by. For '+WHO[L.ev[0].A]+': "'+STORY.CAST[L.ev[0].A].lie+'"'},
 {s:'W',k:3,fx:'think',x:'After every deed it knows of, the sack writes a line in its memory, scored by how much it felt.'},
 {s:()=>L.ev[3].V,k:3,fx:'think',x:()=>{const r=MINDS.per[4].recall.A.concat(MINDS.per[4].recall.V).find(q=>q)||{text:'nothing yet'};return 'I remember: '+r.text}},
 {s:'W',k:4,fx:'think',x:'When the scores add up to 14 it draws a conclusion, and it may commit to one plan.'},
 {s:()=>[L.ev[5].A,L.ev[5].V].find(q=>MINDS.per[5].intent[q])||L.ev[5].A,k:5,fx:'think',x:()=>{const q=[L.ev[5].A,L.ev[5].V].find(z=>MINDS.per[5].intent[z])||L.ev[5].A;return 'My plan now: '+plan(q,5)+'.'}},
 {s:'W',k:5,fx:'think',x:'A plan makes the deeds that carry it out 2.2 times as likely. That is all the control I have over what it does next.'}]},
{t:'3 · The debate',sum:'The watchers, the house and the sack give three accounts of one deed.',b:[
 {s:'AU',k:5,fx:'guess',ph:0,x:()=>'Before this deed we thought '+WHO[L.ev[5].A]+' had this in mind: '+AUD[5].before[L.ev[5].A].text+'.'},
 {s:'AU',k:5,fx:'guess',ph:1,x:()=>'Now we think: '+AUD[5].after[L.ev[5].A].text+'.'},
 {s:()=>L.ev[5].A,k:5,fx:'guess',ph:2,x:()=>'In fact: '+plan(L.ev[5].A,5)+'.'},
 {s:'W',k:5,fx:'guess',ph:2,x:()=>'The watchers see only deeds. I can read the plan. The distance between their guess and the fact is what the panel calls irony: '+f2(AUD[5].irony)+' at this deed.'},
 {s:'AU',k:5,fx:'roles',x:()=>{const m=LEDGER.reading(L,5).match;return 'To the house this is '+m[0]+' against '+m[1]+'.'}},
 {s:()=>L.ev[5].V,k:5,fx:'roles',x:()=>'What I tell myself: "'+STORY.CAST[L.ev[5].V].lie+'"'},
 {s:'W',k:5,fx:'roles',x:'A role given by the house, a guess made by the watchers, a sentence kept by the sack. The program computes all three and does not pick one.'}]},
{t:'4 · The rule he cancels',sum:'Strangled, then knifed: why one deed needs three records.',b:[
 {s:'W',d:'strangling',A:'B',V:'I',fx:'names',x:'Suppose Belindo strangles Inigo.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'names',x:'Then, to make it look like suicide, they knife the body.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'refused',x:'My rule said a strangled sack cannot be knifed. The program on this site has the same rule: it refuses any deed on a dead victim.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'fields',n:1,x:'To allow it I have to keep three things apart. First, the act: a knifing.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'fields',n:2,x:'Second, what it did to the body: a wound, and no death, because he was already dead.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'fields',n:3,x:'Third, what the trace is meant to make a reader believe: suicide.'},
 {s:'W',d:'knifing',A:'O',V:'I',fx:'fields',n:3,x:'This program stores the first two as one record and does not store the third. It also runs the deeds in the order of the index, so here a knifing always comes before a strangling.'}]},
