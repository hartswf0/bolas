<script>
const c=document.getElementById('c'),g=c.getContext('2d');const W=1920,H=1080;
const DUR=96;
const RENDER=location.search.includes('render');
const F_BIG="800 100px BSD, 'Big Shoulders Display', sans-serif";
// ---------------- helpers ----------------
const cl=(a,b,x)=>Math.max(a,Math.min(b,x)), lerp=(a,b,u)=>a+(b-a)*u;
const sm=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return u*u*(3-2*u)};
const eo=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return 1-Math.pow(1-u,3)};
const ei=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return u*u*u};
const bump=(u,a,b)=>{const v=cl(0,1,(u-a)/(b-a));return Math.sin(Math.PI*v)};
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function K(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const[t0,v0]=keys[i-1],[t1,v1]=keys[i];return lerp(v0,v1,sm(t0,t1,t))}}return keys[keys.length-1][1]}
let SEED=0;const J=(k,a=2.2)=>(hash(SEED*13.1+k)-.5)*a;
let INK='#15110d', MONO=0;
const GREEN='#86f5aa';
function FC(col){return MONO?'#06200f':col}
function SC(){return MONO?GREEN:INK}
function inkPath(pts,close=true,w=4.5,fill=null,k0=0,stroke=true){g.beginPath();pts.forEach((p,i)=>{const x=p[0]+J(k0+i*2),y=p[1]+J(k0+i*2+1);i?g.lineTo(x,y):g.moveTo(x,y)});if(close)g.closePath();if(fill){g.fillStyle=FC(fill);g.fill()}if(stroke){g.lineWidth=w;g.strokeStyle=SC();g.lineJoin='round';g.lineCap='round';g.stroke()}}
function curve(pts,n=8){const o=[];const L=pts.length;for(let i=0;i<L;i++){const p0=pts[(i-1+L)%L],p1=pts[i],p2=pts[(i+1)%L],p3=pts[(i+2)%L];for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;o.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}return o}
function ell(cx,cy,rx,ry,n=18,a0=0,a1=Math.PI*2){const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return o}
function seg(x0,y0,x1,y1,p,w,col){if(p<=0)return;g.beginPath();g.moveTo(x0,y0);g.lineTo(lerp(x0,x1,p),lerp(y0,y1,p));g.lineWidth=w;g.strokeStyle=MONO?GREEN:col;g.lineCap='butt';g.stroke()}
let CAM={s:1,cx:960,cy:540};
function cam(s,cx,cy,shx=0,shy=0){g.setTransform(s,0,0,s,960-cx*s+shx,540-cy*s+shy);CAM={s,cx,cy}}
function w2s(x,y){return[960+(x-CAM.cx)*CAM.s,540+(y-CAM.cy)*CAM.s]}
function hopP(t,t0,t1,x0,x1,n,hg){if(t<=t0)return{x:x0,y:0,sq:1};if(t>=t1){const d=t-t1;return{x:x1,y:0,sq:1-.16*Math.exp(-d*9)*Math.cos(d*26)}}
  const p=(t-t0)/(t1-t0)*n,k=Math.floor(p),u=p-k;return{x:lerp(x0,x1,(k+sm(0,1,u))/n),y:-Math.sin(Math.PI*u)*hg,sq:1+.12*Math.sin(Math.PI*u)-.18*Math.max(0,1-u/.14)-.18*Math.max(0,1-(1-u)/.1)}}
const CUES=[];function cue(t,type,v=0){CUES.push({t:+t.toFixed(3),type,v})}

// ---------------- the cast ----------------
// R: Widow Roessler, wide and low with a shawl; B: Belindo Kid, huge, belted, stencilled;
// I: Inigo, half empty, ears hanging; O: Ogiva, tall and narrow, wigs; S: Skiller, hat and satchel; W: Waldemar.
const CAST={
 R:{w:168,h:122,fill:'#d6bf96',band:'#6e3a33',bandY:.8,bandH:.2},
 B:{w:244,h:214,fill:'#e8d5ae',band:'#2a2622',bandY:.4,bandH:.07,stencil:1},
 I:{w:128,h:98,fill:'#e2cea5',droop:1},
 O:{w:80,h:184,fill:'#f0e4c8'},
 S:{w:104,h:136,fill:'#c9c1b2',hat:1},
 W:{w:118,h:138,fill:'#d6c9ae'}
};
const CAPS=[['bob','#7a3b8f'],['hive','#2f6b4f'],['spike','#b8352a'],['long','#7a3b8f']];
function sack(o){
 const C=CAST[o.id];const sq=o.sq??1,emp=o.empty??0,c=o.cinch??0,G=o.g??1;if(G<=.02)return;
 const w=C.w*G,h=C.h*G;const hw=w/2/Math.sqrt(sq)*(1+.75*emp),hh=h*sq*(1-.62*emp);
 const x=o.x,b=o.b,tl=o.tilt||0,ct=Math.cos(tl),st=Math.sin(tl);
 const T=(px,py)=>[x+px*ct-py*st,b+px*st+py*ct];
 const eL=o.eL||[0,0],eR=o.eR||[0,0],eu=o.earUp||0,dr=C.droop?1:0,nk=1-.5*c;
 const earH=dr?6:Math.max(2,14+eu*24);
 const L=[[-hw*1.04,0],[-hw*1.12,-hh*.42],[-hw*.9*(1-.35*c),-hh*.8],[-hw*.95*nk+(dr?0:eL[0]),-hh-earH+(dr?0:eL[1])-c*14],[-hw*.42*nk,-hh*.9],[0,-hh*.95-c*8],[hw*.42*nk,-hh*.9],[hw*.95*nk+(dr?0:eR[0]),-hh-earH+(dr?0:eR[1])-c*14],[hw*.9*(1-.35*c),-hh*.8],[hw*1.12,-hh*.42],[hw*1.04,0],[0,4]];
 const pts=curve(L.map(p=>T(p[0],p[1])),8);const k0={R:40,B:140,I:240,O:340,S:440,W:540}[o.id];
 const ch=o.char||0;
 g.save();g.globalAlpha*=(o.alpha??1);
 if(!o.noShadow){const gy=o.gy??b;const lift=cl(0,1,(gy-b)/160);g.fillStyle=MONO?'rgba(0,40,10,.5)':'rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,gy+3,hw*1.2*(1-.4*lift),9,0,0,7);g.fill()}
 const fill=ch>0?mix(o.fill||C.fill,'#1a1512',ch):(o.fill||C.fill);
 g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=FC(fill);g.fill();
 g.save();g.clip();
 if(C.band&&!MONO){const by=-hh*C.bandY,bh=hh*C.bandH;g.beginPath();[T(-hw*1.4,by-bh/2),T(hw*1.4,by-bh/2),T(hw*1.4,by+bh/2),T(-hw*1.4,by+bh/2)].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.fillStyle=ch?mix(C.band,'#1a1512',ch):C.band;g.fill()}
 if(C.stencil){const p=T(0,-hh*.62);g.beginPath();g.arc(p[0],p[1],hw*.3,0,7);g.lineWidth=3;g.strokeStyle=MONO?GREEN:'rgba(40,30,20,.55)';g.stroke();for(let k=-1;k<=1;k++){const a=T(k*hw*.12,-hh*.5),bq=T(k*hw*.05,-hh*.74);g.beginPath();g.moveTo(...a);g.lineTo(...bq);g.stroke()}}
 if(!MONO){g.fillStyle='rgba(70,45,20,.13)';g.beginPath();[T(-hw*1.5,-hh*.28),T(hw*1.5,-hh*.28),T(hw*1.5,10),T(-hw*1.5,10)].forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.fill();
   g.fillStyle='rgba(255,250,235,.22)';g.beginPath();const q=T(-hw*.45,-hh*.6);g.ellipse(q[0],q[1],hw*.22,hh*.2,tl,0,7);g.fill()}
 g.restore();
 inkPath(pts,true,o.lw||4.5,null,k0);
 const fold=(a,bb)=>inkPath([T(...a),T(...bb)],false,2.4,null,k0+80);
 fold([-hw*.5,-hh*.2],[-hw*.25,-hh*.44]);fold([hw*.35,-hh*.14],[hw*.5,-hh*.34]);
 if(dr){for(const s of[-1,1]){const e=s<0?eL:eR;const a=T(s*hw*.86,-hh*.88),m=T(s*hw*.5,-hh*.96),tp=T(s*(hw*1.08+10)+e[0]*.8,-hh*.9+56+e[1]*.6);inkPath(curve([a,[(a[0]+tp[0])/2+s*14,(a[1]+tp[1])/2],tp,[(m[0]+tp[0])/2,(m[1]+tp[1])/2],m],4),true,3.6,fill,k0+120+s*10)}}
 if(c>.05){const y=-hh*.8,xx=hw*.9*(1-.35*c);const a=T(-xx-6,y),bb=T(xx+6,y);g.lineCap='round';g.beginPath();g.moveTo(...a);g.lineTo(...bb);g.lineWidth=9;g.strokeStyle=MONO?GREEN:'#8a6a3a';g.globalAlpha*=cl(0,1,c*2);g.stroke();g.lineWidth=2;g.strokeStyle=SC();g.stroke();const k=T(xx+6,y),k2=T(xx+22,y+26),k3=T(xx+12,y+30);inkPath([k,k2],false,6,null,k0+150);inkPath([k,k3],false,5,null,k0+160);g.globalAlpha/=cl(0,1,c*2)||1}
 if(o.slit){const a=T(-hw*.5,-hh*.45),bb=T(hw*.4,-hh*.3);g.globalAlpha*=cl(0,1,o.slit*3);inkPath([a,[(a[0]+bb[0])/2,(a[1]+bb[1])/2+4],bb],false,4,null,k0+170);g.globalAlpha=o.alpha??1}
 if(o.cap!=null){const[ty,col]=CAPS[o.cap];const top=-hh*.95;let P;
   if(ty==='bob')P=[...ell(0,top+6,hw*1.25,38,14,Math.PI,2*Math.PI),[hw*1.25,top+44],[hw*.8,top+30],[-hw*.8,top+30],[-hw*1.25,top+44]];
   else if(ty==='hive')P=ell(0,top-34,hw*.95,56,18);
   else if(ty==='spike'){P=[];for(let i=0;i<=10;i++){const u=i/10,xx=lerp(-hw*1.1,hw*1.1,u);P.push([xx,top+8-(i%2?52:10)])}P.push([hw*1.1,top+24],[-hw*1.1,top+24])}
   else P=[...ell(0,top+4,hw*1.2,30,12,Math.PI,2*Math.PI),[hw*1.35,top+hh*.55],[hw*.9,top+hh*.5],[hw*.8,top+26],[-hw*.8,top+26],[-hw*.9,top+hh*.5],[-hw*1.35,top+hh*.55]];
   inkPath(P.map(p=>T(...p)),true,3.6,ch?mix(col,'#1a1512',ch):col,k0+200)}
 if(C.hat){const top=-hh*.95;inkPath([T(-hw*.95,top+10),T(hw*.95,top+10),T(hw*.95,top+2),T(-hw*.95,top+2)],true,3.5,'#25211d',k0+220);inkPath([T(-hw*.5,top+3),T(hw*.5,top+3),T(hw*.45,top-40),T(-hw*.45,top-40)],true,3.5,'#25211d',k0+230);
   inkPath([T(hw*.9,-hh*.6),T(hw*1.45,-hh*.6),T(hw*1.45,-hh*.18),T(hw*.9,-hh*.18)],true,3.5,'#5a3d27',k0+240);inkPath([T(hw*.95,-hh*.6),T(hw*.6,-hh*.92)],false,3,null,k0+250)}
 for(let i=0;i<(o.tags||0);i++){const s=i?-1:1,sw=(o.tagSwing||0)*Math.sin((o.tt||0)*5+i);const a=T(s*hw*.55,-hh*.8),tp=T(s*hw*.85+sw*10,-hh*.42+i*8);inkPath([a,tp],false,2,null,k0+260+i*9);g.save();g.translate(tp[0],tp[1]);g.rotate(tl+sw*.2);inkPath([[-15,0],[15,0],[15,24],[-15,24]],true,2.6,'#f3ead2',k0+270+i*9);inkPath([[-8,8],[8,8]],false,2,null,k0+280);inkPath([[-8,15],[4,15]],false,2,null,k0+290);g.restore()}
 g.restore();
}
function mix(a,b,u){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(lerp(pa>>16,pb>>16,u)),gg=Math.round(lerp(pa>>8&255,pb>>8&255,u)),bl=Math.round(lerp(pa&255,pb&255,u));return'#'+((1<<24)+(r<<16)+(gg<<8)+bl).toString(16).slice(1)}
function topOf(o){const C=CAST[o.id];const G=o.g??1;const hh=C.h*G*(o.sq??1)*(1-.62*(o.empty||0));return[o.x+hh*Math.sin(o.tilt||0),o.b-hh*Math.cos(o.tilt||0)]}
function drawSacks(L,P){const pm={};(P||[]).forEach(p=>pm[p.id]=p);
 for(const o of L){const p=pm[o.id];if(p){const a=topOf(o),b=topOf(p);const dx=cl(-46,46,(b[0]-a[0])*1.1),dy=cl(-34,34,(b[1]-a[1])*1.1);o.eL=[dx,dy];o.eR=[dx,dy]}sack(o)}}

// ---------------- icons (the index, drawn) ----------------
function icon(type,x,y,s=1,a=1){g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha*=a;const k=900+type.length*7;
 switch(type){
 case'letter':inkPath([[-30,-20],[30,-20],[30,20],[-30,20]],true,4,'#efe6d3',k);inkPath([[-30,-20],[0,4],[30,-20]],false,4,null,k+20);break;
 case'cup':inkPath([[-22,-16],[22,-16],[16,22],[-16,22]],true,4,'#efe6d3',k);inkPath(ell(26,2,9,10,10,-Math.PI/2,Math.PI/2),false,4,null,k+30);for(let i=-1;i<=1;i++)inkPath([[i*10,-24],[i*10+5,-32],[i*10-3,-40],[i*10+3,-48]],false,3,null,k+40+i*9);break;
 case'blot':{const P=[];for(let i=0;i<14;i++){const an=i/14*6.283;const r=22+hash(i*3.3+s)*12;P.push([Math.cos(an)*r*1.2,Math.sin(an)*r*.8])}inkPath(curve(P,4),true,3,MONO?'#06200f':'#0e0c0a',k);break}
 case'knife':inkPath([[-30,4],[16,4],[34,-2],[16,-9],[-30,-9]],true,4,'#dfe4e8',k);inkPath([[-56,-10],[-30,-10],[-30,6],[-56,6]],true,4,'#8a5a33',k+30);break;
 case'gun':inkPath([[-32,-16],[30,-16],[30,-4],[-32,-4]],true,4,'#4a4642',k);inkPath([[-32,-4],[-14,-4],[-20,24],[-36,24]],true,4,'#4a4642',k+20);inkPath(ell(-6,2,7,7,8,0,Math.PI),false,3,null,k+40);break;
 case'rope':for(let i=0;i<3;i++)inkPath(ell(-4+i*5,0,24-i*3,15-i*2,16),true,4.5,null,k+i*30);inkPath([[18,8],[34,22],[30,30]],false,4.5,null,k+100);break;
 case'flower':for(let i=0;i<5;i++){const an=i/5*6.283-1.57;inkPath(ell(Math.cos(an)*15,Math.sin(an)*15,11,11,10),true,3,'#c25a8a',k+i*20)}inkPath(ell(0,0,8,8,10),true,3,'#e8c34a',k+120);break;
 case'torn':inkPath([[-26,-24],[18,-24],[26,-14],[16,-4],[26,6],[16,16],[24,24],[-26,24]],true,4,'#efe6d3',k);inkPath([[-16,-10],[8,-10]],false,3,null,k+30);inkPath([[-16,2],[4,2]],false,3,null,k+40);inkPath([[-16,13],[10,13]],false,3,null,k+50);break;
 case'key':inkPath([[-24,-30],[24,-30],[24,30],[-24,30]],true,4,'#b08a4a',k);inkPath(ell(0,-6,8,8,10),true,3,MONO?GREEN:INK,k+20);inkPath([[-5,0],[5,0],[8,18],[-8,18]],true,3,MONO?GREEN:INK,k+40);break;
 case'cord':inkPath(ell(0,-4,20,20,18),false,4,null,k);inkPath([[-14,10],[8,30]],false,4,null,k+40);inkPath([[14,10],[-8,30]],false,4,null,k+50);break;
 case'flame':inkPath(curve([[0,-36],[16,-8],[18,12],[0,26],[-18,12],[-14,-6]],5),true,4,'#e8743a',k);inkPath(curve([[0,-10],[8,6],[0,18],[-8,6]],4),true,2.5,'#f3c04a',k+40);break;
 }g.restore()}
// alphabetical, as the index printed them
const INDEX=['letter','cup','blot','knife','blot','gun','rope','blot','flower','torn','key','cord'];

// ---------------- the world ----------------
function sky(t,dark=0){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0d1016');gr.addColorStop(.55,'#20252d');gr.addColorStop(1,'#383d44');g.setTransform(1,0,0,1,0,0);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function fog(t,a=1,front=0){g.save();g.setTransform(1,0,0,1,0,0);for(let k=0;k<6;k++){const y=(front?700:300)+k*(front?70:110)+Math.sin(t*.2+k)*10;const x=((t*(18+k*6)+k*400)%2600)-400;g.globalAlpha=a*(front?.06:.09);g.fillStyle='#b8c0c8';g.beginPath();g.ellipse(x,y,900,60+k*8,0,0,7);g.ellipse(x-1500,y+20,800,50,0,0,7);g.fill()}g.restore()}
const HUMP=[[-3200,1060],[-1400,1000],[-300,930],[300,900],[520,884],[1400,884],[1700,900],[2500,960],[3600,1040]];
function groundY(x){for(let i=1;i<HUMP.length;i++){if(x<=HUMP[i][0]){const[a,b]=[HUMP[i-1],HUMP[i]];return lerp(a[1],b[1],sm(a[0],b[0],x))}}return 1040}
function ground(t){const P=[];for(let x=-3200;x<=3600;x+=80)P.push([x,groundY(x)]);P.push([3600,2400],[-3200,2400]);inkPath(P,true,4.5,'#17171a',10);
 for(let i=0;i<40;i++){const x=-3000+hash(i*5.1)*6400;if(x>480&&x<1440)continue;const y=groundY(x);inkPath([[x,y],[x-6,y-18-hash(i)*14]],false,2.5,null,60+i);inkPath([[x+6,y],[x+10,y-14-hash(i+1)*10]],false,2.5,null,70+i)}
 // rails
 for(const ry of[1010,1050]){g.save();g.strokeStyle='#4a4d52';g.lineWidth=5;g.beginPath();g.moveTo(-3200,ry+60);g.lineTo(-200,ry);g.stroke();g.restore()}
 for(let i=0;i<30;i++){const u=i/30;const x=lerp(-3200,-200,u);inkPath([[x,lerp(1070,1010,u)],[x+10,lerp(1110,1050,u)]],false,5,null,90+i)}
 // iron stockyard and dead cars
 for(let i=0;i<5;i++){const x=-2400+i*180,y=groundY(x);for(let j=0;j<3+i%2;j++)inkPath([[x-80+j*8,y-j*26],[x+80+j*8,y-j*26],[x+80+j*8,y-j*26-20],[x-80+j*8,y-j*26-20]],true,3.5,'#2a2826',100+i*20+j)}
 for(let i=0;i<4;i++){const x=1950+i*230,y=groundY(x);inkPath(curve([[x-90,y],[x-95,y-40],[x-40,y-80],[x+50,y-78],[x+95,y-36],[x+90,y]],4),true,3.5,'#24211f',200+i*13);inkPath(ell(x-50,y,18,18,10),true,3,'#111',230+i);inkPath(ell(x+50,y,18,18,10),true,3,'#111',240+i)}}
function bridge(t){const dy=600;inkPath([[-3000,dy],[100,dy],[100,dy+26],[-3000,dy+26]],true,4,'#2f2a26',300);for(let i=0;i<16;i++){const x=-2900+i*190;inkPath([[x,dy],[x+95,dy-110],[x+190,dy]],false,4,null,320+i*3)}inkPath([[-2900,dy-110],[ -2900+16*190-95,dy-110]],false,4,null,380);
 inkPath([[100,dy],[430,groundY(430)],[430,groundY(430)+20],[100,dy+26]],true,4,'#2f2a26',390);for(const x of[-2400,-1600,-800,0])inkPath([[x,dy+26],[x,groundY(x)],[x+40,groundY(x)],[x+40,dy+26]],true,4,'#25221f',400+x/100)}
// ---- house: section cut, four rooms ----
