<title>Abominable House Slides</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Twenty slides, one per journal entry on The Burning of the Abominable House. Each has a graphic drawn from the project's files and a short explanation.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;gap:10px 16px;align-items:baseline;flex-wrap:wrap;padding:10px 16px 8px;border-bottom:2px solid var(--ink)}
#num{font:700 22px var(--mono);color:var(--cut)}
h1{font:400 clamp(22px,4.2vw,34px)/1.05 var(--display);margin:0;flex:1 1 12ch;text-wrap:balance}
#when{font:12px var(--mono);color:var(--grey)}
main{display:grid;grid-template-rows:minmax(0,1.25fr) minmax(0,1fr);min-height:0}
#stagewrap{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;padding:8px 16px 4px;gap:6px}
#stage{min-height:0;position:relative}
#stage svg{position:absolute;inset:0;width:100%;height:100%}
#ctl{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font:12px var(--mono);min-height:30px}
#words{overflow:auto;padding:8px 16px 10px;border-top:1px solid var(--rule);background:var(--card)}
#claim{font:21px/1.25 var(--display);margin:0 0 6px;max-width:40ch;text-wrap:balance}
#words p{margin:0 0 6px;max-width:62ch}
#src,#un{font:11.5px/1.45 var(--mono);color:var(--grey)}
#un b{color:var(--cut);font-weight:700;letter-spacing:.06em}
#try{font:12px var(--mono)}
#try::before{content:"";display:inline-block;width:8px;height:8px;background:var(--hl);border:1px solid var(--ink);margin-right:6px}
footer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;border-top:2px solid var(--ink)}
button,.b{font:700 11px var(--mono);letter-spacing:.06em;color:var(--ink);background:transparent;border:1.5px solid var(--ink);padding:6px 9px;cursor:pointer;text-decoration:none}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible,.b:focus-visible{outline:2px solid var(--cut);outline-offset:2px}
#ticks{display:flex;gap:3px;align-items:center}
#ticks button{flex:1;height:14px;padding:0;border-width:1px;min-width:0}
#ticks button[aria-current="true"]{background:var(--cut);border-color:var(--cut)}
input[type=range]{accent-color:var(--cut);width:min(46vw,240px)}
input[type=text]{font:13px var(--mono);padding:5px 7px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);width:15em}
svg text{font-family:var(--mono);font-size:11px;fill:var(--ink)}
svg .g{fill:var(--grey)} svg .c{fill:var(--cut)} svg .big{font-size:15px;font-weight:700} svg .d{font-family:var(--display);font-size:17px}
svg .ln{stroke:var(--ink);stroke-width:1.2;fill:none} svg .th{stroke:var(--rule);stroke-width:1;fill:none}
svg .bx{fill:var(--paper);stroke:var(--ink);stroke-width:1.2} svg .fc{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
svg .ink{fill:var(--ink)} svg .cut{fill:var(--cut)} svg .cl{stroke:var(--cut);stroke-width:1.6;fill:none} svg .hl{fill:var(--hl)} svg .ok{fill:var(--ok)}
svg .tap{cursor:pointer}
@media (min-width:900px){main{grid-template-rows:none;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}#words{border-top:0;border-left:1px solid var(--rule);padding:18px 20px}#claim{font-size:26px}}
</style></head><body>
