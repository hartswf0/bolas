<!doctype html><meta charset=utf-8><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAE-03 · Cel tower opening</title>
<style>@font-face{font-family:BSD;src:url(fonts/BigShouldersDisplay.ttf)}@font-face{font-family:JBM;src:url(fonts/JetBrainsMono.ttf)}html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id=c width=1920 height=1080></canvas><img id=atlas src="atlas.jpg" style="display:none">
<script>
const c=document.getElementById('c'),g=c.getContext('2d');const W=1920,H=1080;
const cl=(a,b,x)=>Math.max(a,Math.min(b,x)),lerp=(a,b,u)=>a+(b-a)*u;
const sm=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return u*u*(3-2*u)};
const eo=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return 1-Math.pow(1-u,3)};
const ei=(a,b,x)=>{const u=cl(0,1,(x-a)/(b-a));return u*u};
function h(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const FLOOR=905, GR=2600;
// ---- times ----
const T={pourA:0.7,pourB:3.2,pack:3.45,flipA:4.15,flipB:4.85,penny:5.25,cuts:[6.0,6.75,7.5,8.25],wobble:8.7,fall:9.75,white:10.5,clear:11.4,hopA:13.2,rise:15.6,end:18.8};
// ---- sample letters ----
function sample(lines,size,cx,cy,lh,step){const o=document.createElement('canvas');o.width=W;o.height=H;const q=o.getContext('2d');q.fillStyle='#fff';q.textAlign='center';q.textBaseline='middle';q.font=`900 ${size}px BSD`;
  lines.forEach((s,i)=>q.fillText(s,cx,cy+(i-(lines.length-1)/2)*lh));
  const d=q.getImageData(0,0,W,H).data,P=[];let minY=1e9,maxY=-1e9,minX=1e9,maxX=-1e9;
  for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){const jx=x+(h(x*7+y)-.5)*step*.8,jy=y+(h(x+y*3)-.5)*step*.8;const i=(Math.round(jy)*W+Math.round(jx))*4;if(d[i+3]>140){P.push([jx,jy]);minY=Math.min(minY,jy);maxY=Math.max(maxY,jy);minX=Math.min(minX,jx);maxX=Math.max(maxX,jx)}}
  return {P,minY,maxY,minX,maxX}}
let A,B,TL,TB;const AT=document.getElementById('atlas');
function tiles(lines,size,cx,cy,lh,cell){const o=document.createElement('canvas');o.width=W;o.height=H;const q=o.getContext('2d');q.fillStyle='#fff';q.textAlign='center';q.textBaseline='middle';q.font=`900 ${size}px BSD`;
  lines.forEach((s,i)=>q.fillText(s,cx,cy+(i-(lines.length-1)/2)*lh));const d=q.getImageData(0,0,W,H).data,P=[];
  for(let y=cell/2;y<H;y+=cell)for(let x=cell/2;x<W;x+=cell){let n=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const i=(Math.round(y+b*cell*.33)*W+Math.round(x+a*cell*.33))*4;if(d[i+3]>140)n++}if(n>=5)P.push([x,y])}return P}
function cel(x,y,size,rot,sy,fi,fr,lit,alpha=1){const n=fi*24+((fr%24)+24)%24;const sx=(n%12)*128,syy=Math.floor(n/12)*128;
  g.save();g.globalAlpha=alpha;g.translate(x,y);g.rotate(rot);g.scale(1,sy);const hs=size/2;
  g.fillStyle=`rgb(${Math.round(240*lit)},${Math.round(230*lit)},${Math.round(212*lit)})`;g.fillRect(-hs-2,-hs-2,size+4,size+4);
  g.drawImage(AT,sx,syy,128,128,-hs,-hs,size,size);if(lit<1){g.fillStyle=`rgba(0,0,0,${(1-lit)*.8})`;g.fillRect(-hs-2,-hs-2,size+4,size+4)}g.restore()}
function build(){
  A=sample(['THE','FLOUR','TOWER'],232,960,540,205,4.0);       // the tower block (we will place it so its base sits on the floor)
  const shift=FLOOR-6-A.maxY;A.P.forEach(p=>p[1]+=shift);A.minY+=shift;A.maxY+=shift;
  A.cy=(A.minY+A.maxY)/2; A.cx=960;
  // per-grain constants
  A.G=A.P.map(([x,y],i)=>{const ym=2*A.cy-y;const fill=(A.maxY-ym)/(A.maxY-A.minY);  // mirrored target (upside-down letters)
    return {x,y,ym,i,s:T.pourA+(1-fill)*0+fill*(T.pourB-T.pourA-.5)+h(i*3.1)*.35, lx:(h(i*5.3)-.5)*9, ly:(h(i*9.7)-.5)*7-4, vx:(h(i*2.2)-.5), vy:h(i*4.4), r:h(i*8.8), c:205+h(i*1.7)*50}});
  A.G.forEach(q=>{q.removed=1e9;for(let k=0;k<T.cuts.length;k++){const ct=T.cuts[k];const side=k%2?-1:1;const xc=CUTX[k];if(q.removed>1e8&&(side>0?q.x>xc:q.x<xc))q.removed=ct+.05+(Math.abs(q.x-xc))*.0006;q.side=side}});
  const CELL=22;const P=tiles(['THE','FLOUR','TOWER'],250,960,540,214,CELL);let mx=-1e9,mn=1e9;P.forEach(p=>{mx=Math.max(mx,p[1]);mn=Math.min(mn,p[1])});const sh2=FLOOR-6-CELL/2-mx;
  TL=P.map(([x,y],i)=>{y+=sh2;return {x,y,i,c:CELL}});const tmin=mn+sh2,tmax=mx+sh2;A.minY=tmin-CELL/2;A.maxY=tmax+CELL/2;A.cy=(A.minY+A.maxY)/2;
  TL.forEach(q=>{q.ym=2*A.cy-q.y;const fill=(A.maxY-q.ym)/(A.maxY-A.minY);q.s=T.pourA+fill*(T.pourB-T.pourA-.55)+h(q.i*3.1)*.22;q.fi=Math.floor(h(q.i*1.9)*6);q.off=Math.floor(h(q.i*7.7)*24);
    q.sw=(h(q.i*4.1)-.5);q.r=h(q.i*8.3);q.vx=h(q.i*2.6)-.5;q.vy=h(q.i*5.9);q.removed=1e9;q.side=1;
    for(let k=0;k<T.cuts.length;k++){const side=k%2?-1:1;if(q.removed>1e8&&(side>0?q.x>CUTX[k]:q.x<CUTX[k])){q.removed=T.cuts[k]+.05+Math.abs(q.x-CUTX[k])*.0006;q.side=side}}});
  window.LANDS=TL.map(q=>[q.s+.5,(A.maxY-q.ym)/(A.maxY-A.minY)]);window.CUTN=T.cuts.map((c,k)=>TL.filter(q=>Math.abs(q.removed-c-.05)<.2).length);
  const PB=tiles(['THE FLOUR TOWER'],176,960,300,0,15);
  TB=PB.map(([x,y],i)=>({x,y,fx:300+h(i*3.3)*1320,fy:FLOOR-h(i*7.1)*40,s:T.rise+h(i*2.9)*.9+(x-500)/2600,fi:Math.floor(h(i*1.1)*6),off:Math.floor(h(i*5.5)*24)}));
  window.RISE=TB.map(q=>q.s+1.0);
  B=sample(['THE FLOUR TOWER'],168,960,300,0,3.4);
  B.G=B.P.map(([x,y],i)=>({x,y,fx:300+h(i*3.3)*1320,fy:FLOOR-h(i*7.1)*60,s:T.rise+h(i*2.9)*1.1+ (x-500)/2400,c:215+h(i*1.3)*40}));
}
const CUTX=[1120,800,1075,845];
// ---- background ----
function stage(alpha=1){
  g.fillStyle='#0b0907';g.fillRect(0,0,W,H);
  let gr=g.createRadialGradient(960,-160,40,960,300,1100);gr.addColorStop(0,`rgba(255,214,150,${.42*alpha})`);gr.addColorStop(.45,`rgba(150,96,48,${.18*alpha})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  // floor
  gr=g.createLinearGradient(0,FLOOR,0,H);gr.addColorStop(0,'#2a2018');gr.addColorStop(1,'#0e0b08');g.fillStyle=gr;g.fillRect(0,FLOOR,W,H-FLOOR);
  gr=g.createRadialGradient(960,FLOOR+10,10,960,FLOOR+10,700);gr.addColorStop(0,`rgba(255,200,130,${.25*alpha})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.save();g.scale(1,.18);g.fillStyle=gr;g.fillRect(0,(FLOOR-700)/.18,W,1400/.18);g.restore();
  g.fillStyle='rgba(255,220,170,.12)';g.fillRect(0,FLOOR,W,2);
}
function dust(cx,cy,d,n,sp,seed,alpha){g.save();for(let i=0;i<n;i++){const an=Math.PI+h(i+seed)*Math.PI,v=(.3+h(i*3+seed))*sp;const r=v*d*(1-d*.35);
  const x=cx+Math.cos(an)*r*1.7,y=cy+Math.sin(an)*r*.55+40*d*d*h(i+seed*2);g.globalAlpha=alpha*(1-d)*(.25+.75*h(i*7+seed));g.fillStyle='#f6ecda';const z=1.2+h(i*5+seed)*2.6;g.fillRect(x,y,z,z)}
  const gr=g.createRadialGradient(cx,cy,10,cx,cy,120+sp*d);gr.addColorStop(0,`rgba(246,236,218,${alpha*.16*(1-d)})`);gr.addColorStop(1,'rgba(246,236,218,0)');g.globalAlpha=1;g.fillStyle=gr;g.fillRect(cx-1200,cy-700,2400,1400);g.restore()}
function grain(x,y,c,r=2.6,a=1){g.fillStyle=`rgba(${c},${c-8},${c-22},${a})`;g.fillRect(x-r/2,y-r/2,r,r)}
function label(text,t0,t1,t,col='#f3e6cf'){const a=sm(t0,t0+.12,t)*(1-sm(t1-.2,t1,t));if(a<=0)return;g.save();g.globalAlpha=a;g.font='600 30px JBM';g.letterSpacing='10px';g.textAlign='center';g.fillStyle=col;g.fillText(text,960,1010);g.restore()}
function penny(x,y,rot,s=1){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.beginPath();g.ellipse(0,0,30,10,0,0,7);const gr=g.createLinearGradient(-30,-10,30,10);gr.addColorStop(0,'#f2b072');gr.addColorStop(.5,'#b9622a');gr.addColorStop(1,'#6e3414');g.fillStyle=gr;g.fill();g.fillStyle='#d98a4c';g.fillRect(-30,0,60,5);g.restore()}
function knife(x,y0,y1,a){ // fast vertical stroke with motion smear
  g.save();for(let k=0;k<6;k++){const yy=lerp(y0,y1,k/5);g.globalAlpha=a*(k===5?1:.12);const gr=g.createLinearGradient(x-14,0,x+14,0);gr.addColorStop(0,'#7f8890');gr.addColorStop(.5,'#ffffff');gr.addColorStop(1,'#9aa3aa');g.fillStyle=gr;g.beginPath();g.moveTo(x-13,yy-640);g.lineTo(x+13,yy-640);g.lineTo(x+13,yy-40);g.lineTo(x,yy);g.lineTo(x-13,yy-40);g.closePath();g.fill()}
  g.globalAlpha=a;g.fillStyle='#3b2516';g.fillRect(x-19,y1-860,38,230);g.restore()}
// ---- sack ----
function sackPath(x,b,w,hh,sq,ear){const hw=w/2/Math.sqrt(sq),H2=hh*sq,e=ear;
  const P=[[-hw*1.06,0],[-hw*1.14,-H2*.42],[-hw*.9,-H2*.82],[-hw*.98-e*12,-H2-18-e*30],[-hw*.42,-H2*.9],[0,-H2*.96],[hw*.42,-H2*.9],[hw*.98+e*12,-H2-18-e*30],[hw*.9,-H2*.82],[hw*1.14,-H2*.42],[hw*1.06,0],[0,8]];
  g.beginPath();P.forEach((p,i)=>{const q=P[(i+1)%P.length];const mx=(p[0]+q[0])/2+x,my=(p[1]+q[1])/2+b;i?g.quadraticCurveTo(p[0]+x,p[1]+b,mx,my):g.moveTo(mx,my)});g.closePath();return H2}
function sack(x,b,w,hh,sq,ear){
  g.save();g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.ellipse(x,FLOOR+6,w*.7/Math.sqrt(sq),16,0,0,7);g.fill();g.restore();
  const H2=sackPath(x,b,w,hh,sq,ear);g.save();g.clip();
  let gr=g.createLinearGradient(x-w,b-H2,x+w*.6,b);gr.addColorStop(0,'#e9c98f');gr.addColorStop(.55,'#a77c48');gr.addColorStop(1,'#4a3220');g.fillStyle=gr;g.fillRect(x-w,b-H2-80,w*2,H2+100);
  g.globalAlpha=.16;g.strokeStyle='#2a1a0c';g.lineWidth=1.4;for(let k=-40;k<40;k++){g.beginPath();g.moveTo(x+k*7,b-H2-80);g.lineTo(x+k*7+3,b+20);g.stroke();g.beginPath();g.moveTo(x-w,b-H2+k*7);g.lineTo(x+w,b-H2+k*7+3);g.stroke()}
  g.globalAlpha=.5;g.strokeStyle='#3b2412';g.lineWidth=3;g.beginPath();g.moveTo(x-w*.25,b-H2*.2);g.quadraticCurveTo(x-w*.15,b-H2*.45,x-w*.05,b-H2*.55);g.stroke();
  g.restore();g.save();sackPath(x,b,w,hh,sq,ear);g.lineWidth=3;g.strokeStyle='rgba(255,226,170,.55)';g.stroke();g.restore();
  // stencil on the sack
  g.save();g.globalAlpha=.55;g.fillStyle='#3a2414';g.font=`900 ${Math.round(34*Math.sqrt(1/sq))}px BSD`;g.textAlign='center';g.fillText('FLOUR',x,b-H2*.42);g.restore();
}
// ---- the frame ----
function draw(t){
  const shake=(()=>{let s=0;for(const k of [T.pack,T.flipB,...T.cuts,T.fall])if(t>k&&t<k+.3)s+=Math.exp(-(t-k)*14)*(k===T.fall?14:7);return s})();
  g.setTransform(1,0,0,1,Math.sin(t*93)*shake,Math.cos(t*71)*shake);
  stage(sm(0,.7,t));
  const flipU=sm(T.flipA,T.flipB,t);const sy=-Math.cos(Math.PI*flipU);const arc=Math.sin(Math.PI*flipU)*120;
  const wob=t>T.wobble&&t<T.fall?Math.sin((t-T.wobble)*26)*(t-T.wobble)*.018:0;
  // ---- tower of cels ----
  if(t<T.white+.6){
    const FR=Math.floor(t*8);
    for(const q of TL){
      if(t<q.s)continue;let x,y,rot=0,sc=1,lit;
      if(t<T.flipA){const dt=t-q.s,ft=.5;const loose=1-eo(T.pack,T.pack+.1,t);
        if(dt<ft){const u=dt/ft;x=q.x+q.sw*90*(1-u)*Math.cos(u*7);y=lerp(-60-q.r*120,q.ym,u*u);rot=q.sw*2.4*(1-u)}
        else{const b=dt<ft+.14?Math.sin((dt-ft)/.14*Math.PI)*5:0;x=q.x+loose*q.sw*4;y=q.ym-b+loose*(q.r-.5)*5;rot=loose*q.sw*.12}
        sc=-1;
      } else if(t<T.fall){
        const flipU=sm(T.flipA,T.flipB,t),sy=-Math.cos(Math.PI*flipU),arc=Math.sin(Math.PI*flipU)*120;
        y=flipU>=1?q.y:A.cy+(q.y-A.cy)*sy-arc;x=q.x+(A.maxY-y)*wob;sc=sy;
        if(t>q.removed){const d=t-q.removed;x=q.x+q.side*(60+q.vx*140)*Math.min(d,.6);y=q.y+.5*GR*d*d;rot=q.side*d*7*(.5+q.r);
          const rest=FLOOR-q.c/2-q.r*q.c*1.2;if(y>rest){y=rest;rot=q.side*(1.2+q.r*1.6)}}
      } else {
        if(q.removed<T.fall){const d=Math.min(1.2,T.fall-q.removed);x=q.x+q.side*(60+q.vx*140)*Math.min(d,.6);y=FLOOR-q.c/2-q.r*q.c*1.2;rot=q.side*(1.2+q.r*1.6)}
        else{const d=t-T.fall-(A.maxY-q.y)*.0003;if(d<0){x=q.x+(A.maxY-q.y)*wob;y=q.y}
          else{x=q.x+((q.x-960)*1.1+q.vx*700)*Math.min(d,1.6)*.7+Math.sin(d*6+q.i)*40*Math.min(1,d);y=q.y-q.vy*420*d+.5*1300*d*d;rot=(q.vx*8+q.sw*4)*d;
            const rest=FLOOR-q.c/2-q.r*30;if(y>rest){y=rest;rot=q.sw*3}}}
      }
      lit=cl(.45,1,1.05-(Math.abs(x-960)/1400)-(y<200?.0:0));
      cel(x,y,q.c-3,rot,sc,q.fi,q.off+FR,lit);
      // flour puff on landing
      const ld=t-(q.s+.5);if(ld>0&&ld<.35&&t<T.flipA){for(let k=0;k<6;k++){const an=Math.PI+h(q.i*13+k)*Math.PI;const r=ld*(30+h(q.i+k*7)*60);grain(q.x+Math.cos(an)*r,q.ym+q.c*.4+Math.sin(an)*r*.4,240,2.2,(1-ld/.35)*.8)}}
    }
  }
  // pour stream glow
  if(t>T.pourA-.1&&t<T.pourB){g.save();g.globalAlpha=.25*sm(T.pourA-.1,T.pourA+.2,t)*(1-sm(T.pourB-.4,T.pourB,t));const gr=g.createLinearGradient(600,0,1320,0);gr.addColorStop(0,'rgba(255,240,210,0)');gr.addColorStop(.5,'rgba(255,240,210,.5)');gr.addColorStop(1,'rgba(255,240,210,0)');g.fillStyle=gr;g.fillRect(600,0,720,A.maxY);g.restore()}
  // pack thump dust
  for(const [k,s,sd] of [[T.pack,320,11],[T.flipB,520,23],...T.cuts.map((c,i)=>[c,220,40+i])]){if(t>k&&t<k+1.1){dust(960,FLOOR-30,(t-k)/1.1,900,s,sd,.9)}}
  // penny
  const topY=A.minY-12;
  if(t>T.penny-.6&&t<T.white){
    if(t<T.fall){const d=eo(T.penny-.6,T.penny,t);const bounce=t>T.penny&&t<T.penny+.25?Math.sin((t-T.penny)/.25*Math.PI)*14:0;penny(960+(A.maxY-topY)*wob,lerp(-60,topY,d*d*(3-2*d))-bounce,t>T.penny?Math.sin(t*12)*0.02*(t>T.wobble?8:1):0)}
    else{const d=t-T.fall;penny(960+d*260,topY-140*d+.5*GR*d*d,d*14)}
  }
  // knife strokes
  T.cuts.forEach((ct,k)=>{const d=t-ct+.12;if(d>0&&d<.45){const down=eo(0,.12,d);const up=sm(.2,.45,d);knife(CUTX[k],lerp(A.minY-200,FLOOR,down)-up*700,lerp(A.minY-200,FLOOR,down)-up*700,1-up)}});
  // final knife through the middle
  {const d=t-T.fall+.12;if(d>0&&d<.45){const down=eo(0,.12,d);knife(960,lerp(A.minY-200,FLOOR,down)-sm(.2,.45,d)*700,0,1-sm(.2,.45,d))}}
  // collapse cloud to white
  if(t>T.fall){const d=Math.min(1,(t-T.fall)/1.4);dust(960,FLOOR-60,d,4000,1400,77,1);
    const R=80+sm(T.fall,T.white+.2,t)*1900;const gr=g.createRadialGradient(960,FLOOR-80,0,960,FLOOR-80,R);const wa=1-sm(T.clear,T.clear+1.6,t);
    gr.addColorStop(0,`rgba(248,242,230,${.95*wa})`);gr.addColorStop(.6,`rgba(248,242,230,${.7*wa})`);gr.addColorStop(1,'rgba(248,242,230,0)');g.fillStyle=gr;g.fillRect(-50,-50,W+100,H+100);
    const fa=sm(T.fall+.3,T.white,t)*(1-sm(T.clear,T.clear+1.6,t));g.fillStyle=`rgba(247,240,228,${fa})`;g.fillRect(-50,-50,W+100,H+100)}
  // ---- the sack in the drift ----
  if(t>T.white){
    const a=1-sm(T.clear,T.clear+1.6,t);
    // drift mound
    g.save();g.fillStyle='#e9e0d0';g.beginPath();g.moveTo(-50,FLOOR+10);for(let x=-50;x<=W+50;x+=40){g.lineTo(x,FLOOR-8-34*Math.exp(-Math.pow((x-960)/520,2))-6*h(x))}g.lineTo(W+50,H);g.lineTo(-50,H);g.closePath();g.fill();g.restore();
    if(true){
      let sq=1,ear=0,lift=0,x=960;
      const d=t-T.hopA;
      if(d>0&&d<.32)sq=lerp(1,.7,ei(0,.32,d));
      else if(d>=.32&&d<1.02){const u=(d-.32)/.7;lift=4*230*u*(1-u);sq=u<.5?lerp(.7,1.32,eo(0,.5,u)):lerp(1.32,1.08,(u-.5)/.5)}
      else if(d>=1.02&&d<1.3)sq=lerp(.64,1,eo(1.02,1.3,d));
      else if(d>=1.3)sq=1+.06*Math.sin((d-1.3)*15)*Math.exp(-(d-1.3)*5);
      ear=d<0?lerp(-.6,.2,sm(T.clear,T.clear+1.2,t)):d<.32?-.6:d<1.02?1:d<1.5?-.7:lerp(-.7,.5,sm(1.5,2.2,d));
      if(t>T.rise)ear=lerp(ear,1,sm(T.rise,T.rise+.6,t));
      const fade=1;g.save();g.globalAlpha=fade;sack(x,FLOOR-6-lift,250,300,sq,ear);g.restore();
      if(d>1.0&&d<2.0){g.save();for(let i=0;i<40;i++){const an=Math.PI+h(i+9)*Math.PI,r=(d-1.0)*(150+h(i)*300);g.globalAlpha=(1-(d-1.0))*.35;g.fillStyle='#f6ead6';g.beginPath();g.arc(x+Math.cos(an)*r*1.4,FLOOR-10+Math.sin(an)*r*.3,8+h(i)*16,0,7);g.fill()}g.restore()}
    }
    if(a>0){g.fillStyle=`rgba(247,240,228,${a})`;g.fillRect(-50,-50,W+100,H+100)}
  }
  // ---- flour rises into the title ----
  if(t>T.rise){
