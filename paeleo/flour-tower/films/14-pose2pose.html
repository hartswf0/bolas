function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return[
 .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
 .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)];}

function samplePath(o,n){n=n||7;const N=o.length,isC=i=>!!o[i][2]&&o[i][2]!=='k';let s=o.findIndex((p,i)=>isC(i));if(s<0)s=0;

 do{let j=(i+1)%N;const run=[i];while(!isC(j)&&j!==s){run.push(j);j=(j+1)%N;}run.push(j);
  for(let k=0;k<run.length-1;k++){const P=q=>o[run[Math.max(0,Math.min(run.length-1,q))]];
   at[run[k]]=pts.length;for(let u=0;u<n;u++)pts.push(cr(P(k-1),P(k),P(k+1),P(k+2),u/n));}
  i=j;}while(i!==s&&++guard<200);
 return{pts,at};}
function area(p){let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1];}return Math.abs(a)/2;}

 ['volume, half-empty',pct(CHK.volumeHalf),Math.abs(CHK.volumeHalf[0])<=.06&&Math.abs(CHK.volumeHalf[1])<=.06],
 ['volume, full',pct(CHK.volumeFull),Math.abs(CHK.volumeFull[0])<=.06&&Math.abs(CHK.volumeFull[1])<=.06],
 ['gather: sack gain / pile loss',`${CHK.gatherSackGain.toFixed(4)} / ${CHK.gatherPileLoss.toFixed(4)} m²`,Math.abs(CHK.gatherSackGain-CHK.gatherPileLoss)<.005],
 ['flour total, whole film',pct(CHK.flourRange),Math.abs(CHK.flourRange[0])<.03&&Math.abs(CHK.flourRange[1])<.03],
 ['base slide while held',(CHK.heldSlide*1000).toFixed(1)+' mm',CHK.heldSlide<1e-6],
 ['shortest hold',CHK.minHoldFrames+' frames',CHK.minHoldFrames>=2],
 ['ear lag behind travel',CHK.earLagFrames+' frames',CHK.earLagFrames>=1],
 ['brace keeps place',(CHK.braceHoldsPlace*1000).toFixed(0)+' mm',CHK.braceHoldsPlace<.01],
 ['end x (0.80)',CHK.endX.toFixed(3)+' m',Math.abs(CHK.endX-.8)<.05],
 ['end height (0.95)',CHK.endTop.toFixed(3)+' m',Math.abs(CHK.endTop-.95)<.04],
 ['penny on top at end',CHK.endPennyOn?'yes':'no',CHK.endPennyOn],
 ['knife clearance at hover',(CHK.knifeClearance*100).toFixed(0)+' cm',CHK.knifeClearance>0],
 ['out-of-family picks (info)',CHK.outOfFamilyFrames+' frames; family is a hard filter',null],
 ['longest hold, prop + brace',CHK.maxHoldPropBrace+' frames ('+CHK.propBraceDrawings.length+' drawings)',CHK.maxHoldPropBrace<=12&&CHK.propBraceDrawings.length>=6],
 ['tower lean at 7.0 s',CHK.leanDegAt7.toFixed(1)+'°',CHK.leanDegAt7>=4],
 ['collapse width jump',(CHK.collapseWidthJump*100).toFixed(0)+'% per frame',CHK.collapseWidthJump<=.2],
 ['approach: base over top width','+'+(CHK.approachBaseOverTop*100).toFixed(0)+'%',CHK.approachBaseOverTop>=.15],
 ['approach: height jump per frame',(CHK.approachHeightJump*100).toFixed(0)+'%',CHK.approachHeightJump<=.15],
 ['longest hold (not F1/F2)',CHK.longestHoldOther+' frames ('+CHK.longestHoldOtherId+')',CHK.longestHoldOther<=24],
 ['collapse: shortest drawing run',CHK.collapseShortestRun+' frames',CHK.collapseShortestRun>=2],
 ['shuffle: ears trail the shoulder',CHK.shuffleShape?'all 8':'no',CHK.shuffleShape],
 ['full: base over waist',CHK.fullBaseOverWaist.map(v=>'+'+(v*100).toFixed(0)+'%').join(' / '),CHK.fullBaseOverWaist.every(v=>v>=.08)],
 ['drawings used / bank',CHK.drawingsUsed+' / '+CHK.bankSize,true]];
html+='<tr><th colspan="4" style="padding-top:10px">invariants</th></tr>';
extra.forEach(r=>{html+=`<tr><td>${r[0]}</td><td colspan="2">${r[1]}</td><td class="${r[2]===null?'':r[2]?'H':'B'}">${r[2]===null?'info':r[2]?'HOLDS':'BREAKS'}</td></tr>`;});
document.getElementById('checks').innerHTML=html;

/* model sheet */
const sh=document.getElementById('sheet'),sg=sh.getContext('2d');
const COLS=11,CW=760/COLS,ROWS=Math.ceil(SACK.length/COLS),RH=300/ROWS;
function drawSheet(cur){sg.fillStyle='#efe6d1';sg.fillRect(0,0,760,300);
 SACK.forEach((d,i)=>{const cx=(i%COLS+.5)*CW,by=(Math.floor(i/COLS)+1)*RH-12;
  if(i===cur){sg.fillStyle='rgba(176,72,32,.18)';sg.fillRect(cx-CW/2+1,by-RH+13,CW-2,RH-2);sg.strokeStyle='#b04820';sg.lineWidth=2;sg.strokeRect(cx-CW/2+1,by-RH+13,CW-2,RH-2);}
  const sc=Math.min(56,(RH-22)/Math.max(.6,d.top-d.bot));
  drawSack(sg,d,cx-d.cx*sc,by+d.bot*sc,sc,1.1);
  sg.fillStyle=i===cur?'#8a3b1c':'#6b6257';sg.font='9px "IBM Plex Mono",monospace';sg.textAlign='center';sg.fillText(d.id,cx,by+10);});}

/* ------------------------- PLAYBACK --------------------------------- */
let frame=0,playing=true,last=performance.now(),acc=0,lastSheet=-1;
const scrub=document.getElementById('scrub'),tc=document.getElementById('tc'),idx=document.getElementById('idx');
function show(f){frame=((f%NF)+NF)%NF;const st=render(frame);scrub.value=frame;
 tc.textContent=`f${String(frame).padStart(3,'0')} ${(frame/FPS).toFixed(2)}s`;
 const d=st.sk.d;if(d.i!==lastSheet){drawSheet(d.i);lastSheet=d.i;}
 idx.textContent=`sack ${d.id} (#${d.i+1}/${SACK.length}) · exposure ${st.sk.e+1}/${EXPO.length} · tower ${st.tw==='PILE'?'P'+st.pileK:st.tw}${st.kn?' · knife '+st.kn.k:''} · penny ${st.pen.k}`;}
function loop(now){const dt=now-last;last=now;if(playing){acc+=dt;const step=1000/FPS;if(acc>=step){const n=Math.floor(acc/step);acc-=n*step;show(frame+n);}}requestAnimationFrame(loop);}
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('icoPause').style.display=playing?'':'none';document.getElementById('icoPlay').style.display=playing?'none':'';};
scrub.oninput=()=>{playing=false;document.getElementById('icoPause').style.display='none';document.getElementById('icoPlay').style.display='';show(+scrub.value);};
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';};
window.PAE_SEEK=t=>{playing=false;document.getElementById('icoPause').style.display='none';document.getElementById('icoPlay').style.display='';show(Math.round(t*FPS));};
show(0);requestAnimationFrame(loop);
</script>
</body>
</html>
