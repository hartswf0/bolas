ing. Treat retries idempotently and preserve noncommuting alternatives as named branches. On a broken hard invariant, quarantine the affected candidate, resume from the last accepted state, and record the evidence.\n\n## 5 · Swarm assignments\n\nA reading designer selects a short original or authorized poem. A cue designer controls when sound, spelling, or an image appears. A recording or staging unit captures responses. An editor traces their change without rewriting the evidence. An independent reviewer audits whether the interpretation follows the released cue.\n\nUse real agents when available. Combine coupled tasks under one owner and fork independent candidates against the same input revision. Each assignment has a specific playable, readable, or otherwise inspectable output and a bounded budget. If separate review is unavailable, execute the checks you can and record which judgments remain pending.\n\n## 6 · Hard proof\n\nMake a one-minute study of a short original poem with an unfamiliar animal or object name. Give readers sound first, then text, then an image. Record or stage two plausible guesses and one reconsideration. Use adults with consent or clearly fictional performers when appropriate for the resources.\n\nProduce the smallest working artifact that makes the formal claim testable. For screen work use actual playback, purposeful sound or a declared silence, and a saved assembly. For page work provide the complete readable sequence and any route, physical action, or viewing condition the proof needs.\n\n## 7 · Verification fixture and independent critique\n\nA response recorded before cue Q cannot claim that Q was available at the time. Moving the image earlier defines a new condition. A reader’s words may be shortened only if their meaning and attribution remain auditable.\n\nAsk which clue shifted the reading, whether an alternate remained possible, and whether the cut preserves the order in which clues became available.\n\nGive a fresh critic the brief, real output, and stable acceptance bar. Review in the intended reading or viewing condition before diagnostics. Return verdict, exact evidence, largest gap, falsifiable acceptance condition, and what to protect. Label evidence measured, structurally verified, perceptually judged, or unknown.\n\n## 8 · Repair and recursive inquiry\n\nIf readers jump to one answer, hold text and delay or reduce the strongest visual cue. If no shift is visible, keep the cue order and add a chance for the reader to state why the new cue matters.\n\nCompare listening-first and reading-first conditions using the same poem, and preserve separate response traces.\n\nAfter two meaningfully different repairs fail, state two explanations and run the smallest comparison that can decide between them. Record the result against its exact revision and recheck the whole work. Retain the strongest accepted checkpoint. Stop when the quality bar is met, the operator stops, the budget is used, or remaining work cannot resolve the failure in scope.\n\n## 9 · Deliverable and start\n\nPlayable reading study, cue and response timeline, short poem or cleared source, consent/fiction ledger, and a reader-response audit.\n\nLink the output and evidence to their revisions. Expose the current preview, decisive review, and remaining failure in a readable status view when a run warrants it. Start now with the creative thesis, theory, and hard proof. Report what was actually built and inspected.\n\n## 10 · Optional common seed\n\nA visitor arrives at an empty station carrying a sealed envelope. A bell rings. The visitor opens the envelope, finds a brass key, leaves it on the bench, and walks away. The service door stays closed.\n\nGive readers a brief original poem built around the bench, envelope, and bell. Release the image of the key after their first reading. Keep interpretations distinct from what physically happened.\n\n## Source anchors\n\n- Identifies Roubaud’s poem, Ribot’s film, and the reading exer
