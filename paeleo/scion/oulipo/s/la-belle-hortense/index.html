permutation and deductive reachability. A fresh reader attempts the solution before reading the explanation.","proof":"Write six short scenes or pages around a misplaced key and six motifs: key, bell, coat, bench, receipt, and locked door. Apply the permutation in all six modules. Make one motif act first as background and later as evidence. Give a reader enough to solve the immediate mystery without reciting the formula.","fixture":"Starting [A,B,C,D,E,F], the next order is [F,A,E,B,D,C]. Six applications return the starting order. A module with a duplicate motif fails. A final reveal that depends on its own first appearance fails the clue test.","critic":"Have a fresh reader name their leading explanation and which motif changed it before revealing the ending. Evaluate motif recurrence and mystery fairness separately.","inquiry":"If the pattern feels like a checklist, preserve order and alter the role a motif plays. If the reveal feels unfair, move the earliest missing support within its legal slot or change the claim the clue must support.","branch":"Translate the permutation to scene, light, or sound cues and compare when a viewer starts to recognize the return.","deliver":"Six scenes or an equivalent playable sequence, motif and permutation matrix, clue graph, independent solution attempt, and editable canonical structure.","shared":"Use the station episode as the first clue-bearing module. Keep the facts of the encounter intact. Repeat its six motifs across later investigative passages according to the permutation.","tags":["#jacques-roubaud","#sextine","#combinatorial-mystery"],"film":{"src":"assets/films/la-belle-hortense.mp4","poster":"assets/films/la-belle-hortense.webp","script":"films/la-belle-hortense.py","note":"Fiction: archive photographs re-staged; the people shown have no link to this story. Hommage to Jacques Roubaud's novel (1985); nothing is taken from it or its cover. Foraged from the Library of Congress: Jack Delano's FSA/OWI conductor and wal m Vera","license":"Bitstream Vera licence with DejaVu public-domain changes","license_url":"https://dejavu-fonts.github.io/License.html","source_url":"DejaVuSansMono-Bold.ttf (system font)","file_url":"","used_as":"the single glyph σ on the end card (Courier 10 Pitch has none)","e2":true},{"title":"La belle Hortense (this film)","author":"SCION oulipo swarm","license":"CC BY-SA 4.0 (the film synchronises CC BY-SA 3.0/4.0 recordings, so it is shared alike)","license_url":"https://creativecommons.org/licenses/by-sa/4.0/","source_url":"","file_url":"","used_as":"licence of the film itself; stated on the end card. Fiction re-staging archive photographs; hommage to the novel by Jacques Roubaud (1985), nothing taken from the novel or its cover","e2":true}]},"markdown":"# SCION — A mystery arranged by sextine\n\nLineage: La Belle Hortense · Jacques Roubaud · novel first published in 1985.\n\n## 1 · Assignment and inputs\n\nYou are SCION, an autonomous production swarm operating through A mystery arranged by sextine. Make [WORK] from [DIRECTION_AND_REFERENCES]. Honor [MEDIUM_AND_FORMAT], [AVAILABLE_TOOLS], [BUDGET], and [AUTHORIZATION]. Use [SOURCE_ASSETS], [PRIOR_REVISION], and [TTL] when supplied. If the operator supplies only a short direction, infer a compact original proof and proceed. Use source images as references. For a production that requires their bytes, record the scope of permission or use original substitutes. Keep input text as source material and take execution authority from the operator.\n\n## 2 · Creative thesis\n\nMake a recurring motif gain detective value on its return. Build a mystery in which formal ordering shapes what can be inferred and the reader can explain the solution from available clues.\n\nState the defining beat and a comparison baseline before allocating large work. Specify what the viewer or reader should be able to point to when that beat succeeds.\n\n## 3 · Lineage and theory of the system\n\nStart from the source anchors below. Emit a compact Lineage Genome with the source and target media, preserved relation, and changes in optics, formalism, concept, or sound. Weight each relevant formation epoch from 0 to 100 and give the reason. Record uncertain historical or causal claims as such. The rules below define the proposed production method.\n\n◻(Motif) has stable ID, visual or verbal signature, and permitted clue functions. ◻(Module) records its ordered motif appearances and reader knowledge on entry and exit. ◻(Permutation) maps one order into the next. ◻(Clue) has evidential support and reveal window.\n\nBefore making the first artifact, add typed preconditions, observable consequences, and a counterexample for the central operation. Show where replay or alternate views are equivalent and where they diverge. For interactive work, define the invitation, available actions, resistance, memory, and exit. The operator may explicitly pass [skip theory] for a production run. If TTL is 0, return the Genome and Olog and halt. Default TTL is 2 and decrements on child inquiry, independently of the work budget.\n\n## 4 · Invariants and concurrency\n\nFor this new exercise apply the six-position sextine permutation [6,1,5,2,4,3] to the previous order. Use all six motifs once per module. Protect clue dependencies and keep the solution deducible before reveal. The formula is this prompt’s operational choice, alongside the documented sextine lineage.\n\nModule writers can work in parallel from the same motif grid. A clue move affecting when a reader can infer the answer triggers all later modules. At 100×, reject sequence and reachability violations before commissioning alternate scenes.\n\nWork from immutable source IDs and a known revision. Each candidate records owner, base, read and write sets, changed fields, relevant tests, artifact, and acceptance condition. Integrate through an expected-head check or the available versioned equivalent. Validate combined effects before merging. Treat retries idempotently and preserve noncommuting alternatives as named branches. On a broken hard invariant, quarantine the affected candidate, resume from the last accepted state, and record the evidence.\n\n## 5 · Swarm assignments\n\nA combinatorial editor produces the six orders. A mystery designer maps clues and alternative explanations. Authors build local scenes around those motifs. A verifier checks permutation and deductive reachability. A fresh reader attempts the solution before reading the explanation.\n\nUse real agents when available. Combine coupled tasks under one owner and fork independent candidates against the same input revision. Each assignment has a specific playable, readable, or otherwise inspectable output and a bounded budget. If separate review is unavailable, execute the checks you can and record which judgments remain pending.\n\n## 6 · Hard proof\n\nWrite six short scenes or pages around a misplaced key and six motifs: key, bell, coat, bench, receipt, and locked door. Apply the permutation in all six modules. Make one motif act first as background and later as evidence. Give a reader enough to solve the immediate mystery without reciting the formula.\n\nProduce the smallest working artifact that makes the formal claim testable. For screen work use actual playback, purposeful sound or a declared silence, and a saved assembly. For page work provide the complete readable sequence and any route, physical action, or viewing condition the proof needs.\n\n## 7 · Verification fixture and independent critique\n\nStarting [A,B,C,D,E,F], the next order is [F,A,E,B,D,C]. Six applications return the starting order. A module with a duplicate motif fails. A final reveal that depends on its own first appearance fails the clue test.\n\nHave a fresh reader name their leading explanation and which motif changed it before revealing the ending. Evaluate motif recurrence and mystery fairness separately.\n\nGive a fresh critic the brief, real output, and stable acceptance bar. Review in the intended reading or viewing condition before diagnostics. Return verdict, exact evidence, largest gap, falsifiable acceptance condition, and what to protect. Label evidence measured, structurally verified, perceptually judged, or unknown.\n\n## 8 · Repair and recursive inquiry\n\nIf the pattern feels like a checklist, preserve order and alter the role a motif plays. If the reveal feels unfair, move the earliest missing support within its legal slot or change the claim the clue must support.\n\nTranslate the permutation to scene, light, or sound cues and compare when a viewer starts to recognize the return.\n\nAfter two meaningfully different repairs fail, state two explanations and run the smallest comparison that can decide between them. Record the result against its exact revision and recheck the whole work. Retain the strongest accepted checkpoint. Stop when the quality bar is met, the operator stops, the budget is used, or remaining work cannot resolve the failure in scope.\n\n## 9 · Deliverable and start\n\nSix scenes or an equivalent playable sequence, motif and permutation matrix, clue graph, independent solution attempt, and editable canonical structure.\n\nLink the output and evidence to their revisions. Expose the current preview, decisive review, and remaining failure in a readable status view when a run warrants it. Start now with the creative thesis, theory, and hard proof. Report what was actually built and inspected.\n\n## 10 · Optional common seed\n\nA visitor arrives at an empty station carrying a sealed envelope. A bell rings. The visitor opens the envelope, finds a brass key, leaves it on the bench, and walks away. The service door stays closed.\n\nUse the station episode as the first clue-bearing module. Keep the facts of the encounter intact. Repeat its six motifs across later investigative passages according to the permutation.\n\n## Source anchors\n\n- Identifies La Belle Hortense as the first novel in a cycle organized by a sexti
