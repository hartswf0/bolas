<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050403">
<title>VIDEOTEXT</title>
<style>
/* One full-screen canvas; nothing else. You are the jellyfish from the contaminant film. */
html,body{margin:0;height:100%;background:#050403;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
</style></head><body>
<canvas id="cv" aria-label="VIDEOTEXT: swim as the jellyfish. Touch or drag to swim; catch archive frames that rhyme with the one you hold; keep out of the censor's beam while you hold a touch."></canvas>
<script>
(() => {
'use strict';
// ---------------------------------------------------------------- the archive: fourteen public-domain frames and their joints
// Visible features by which two shots rhyme (located on the frame, 0..1), and touch: the censor's evidence. From the
// contaminant jellyfish film (../contaminant.html); rights in ../contaminant/mood/sources.json.
const H = '../../handmade/';

  ['kit/archive-door/frames/f031.jpg', {door: [.6, .45]}],
  ['03-ernst/src/lion/f022.jpg', {animal: [.27, .45], ground: [.5, .85]}],
  ['kit/archive-door/frames/f013.jpg', {hand: [.43, .6], door: [.6, .4], touch: [.43, .6]}],
  ['kit/archive-dog/frames/f030.jpg', {animal: [.45, .5], ground: [.5, .85]}],
  ['52-gilliam-ephemera/sources/yoga_f024.jpg', {body: [.48, .45], up: [.48, .2]}],
  ['54-provenance-graph/sources/lantern-sam/f020.jpg', {glow: [.47, .42], hand: [.42, .8], touch: [.42, .8]}],
  ['01-gilliam/sources/butterfly/f060.jpg', {hand: [.4, .5], touch: [.4, .5]}],
  ['31-alpha-matting/sources/cloud/f020.jpg', {up: [.5, .35]}],
  ['53-civic-footage/sources/door/frames/f010.jpg', {door: [.6, .4], person: [.6, .45], hand: [.52, .62], touch: [.52, .62]}],
  ['53-civic-footage/sources/dog/frames/f025.jpg', {person: [.7, .2], animal: [.45, .55]}],
  ['53-civic-footage/sources/seated/frames/f025.jpg', {person: [.45, .5], body: [.45, .5], ground: [.5, .85], touch: [.45, .5]}],
  ['52-gilliam-ephemera/sources/yoga_f000.jpg', {body: [.47, .45], up: [.47, .25]}]

const FEATS = c => Object.keys(c.joints).filter(t => t !== 'touch');
const shared = (a, b) => FEATS(a).find(t => b.joints[t]);
// small drawn marks for the features, shown over a frame when it rhymes with what you hold
const GLYPH = {glow: '<circle cx="12" cy="12" r="4.5" fill="#f6c47a"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="#f6c47a" stroke-width="1.8" stroke-linecap="round"/>',
  hand: '<path d="M8 21v-7l-2-3a1.3 1.3 0 012-1.5L9 11V4.5a1.2 1.2 0 012.4 0V10V3.5a1.2 1.2 0 012.4 0V10V4.6a1.2 1.2 0 012.4 0V11V7a1.2 1.2 0 012.4 0v7c0 4-2.5 7-6.2 7z" fill="none" stroke="#f6c47a" stroke-width="1.7" stroke-linejoin="round"/>',
  door: '<rect x="6" y="3" width="12" height="18" rx="1" fill="none" stroke="#f6c47a" stroke-width="1.8"/><circle cx="15" cy="12.5" r="1.4" fill="#f6c47a"/>',
  person: '<circle cx="12" cy="6.5" r="3" fill="none" stroke="#f6c47a" stroke-width="1.8"/><path d="M5.5 21c.5-5 3-8 6.5-8s6 3 6.5 8" fill="none" stroke="#f6c47a" stroke-width="1.8"/>',
  animal: '<path d="M4 15c1-4 4-5 8-5h4l2-3 1.5 1-1 3c1 1 1.5 2 1.5 4M6 15v5M10 15v5M15 15v5M19 15v5" fill="none" stroke="#f6c47a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  ground: '<path d="M2 17h20M5 20h14" stroke="#f6c47a" stroke-width="1.8" stroke-linecap="round"/><path d="M6 17c2-4 4-6 6-6s4 2 6 6" fill="none" stroke="#f6c47a" stroke-width="1.8"/>',
  body: '<circle cx="12" cy="4.5" r="2.2" fill="#f6c47a"/><path d="M12 7v7M12 14l-4 7M12 14l4 7M5 9l7 2 7-2" fill="none" stroke="#f6c47a" stroke-width="1.8" stroke-linecap="round"/>',
  up: '<path d="M12 21V4M5 11l7-7 7 7" fill="none" stroke="#f6c47a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'};

// ---------------------------------------------------------------- canvas
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, Hh = 0, D = 1, S = 1;   // css size, device ratio, scale unit

addEventListener('resize', fit); fit();

  hist = []; reel = []; held = null; insert = null; flash = 0; after = null; target = null;

reset();

let pressed = false;
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio.wake(); pressed = true; target = point(e);
  if (phase === 'title' || (phase === 'end' && T - phaseT > 1)) begin(); });

addEventListener('pointerup', () => { pressed = false; });
const keys = new Set(); addEventListener('keydown', e => { keys.add(e.key); audio.wake(); if ((phase === 'title' || phase === 'end') && (e.key === ' ' || e.key === 'Enter')) begin(); });

  f.state = 'held'; held = f; reel.push({c: f.c, link: tag, burned: false, rescued: false, f});

  audio.note(reel.length); flash = .35;
}
function bounce(f) {
  const dx = f.x - J.x, dy = f.y - J.y, d = Math.hypot(dx, dy) || 1;
  f.vx += dx / d * 160; f.vy += dy / d * 160; J.vx -= dx / d * 120; J.vy -= dy / d * 120; audio.thud();
}
function burnHeld() {   // the censor: a touch held in the beam burns from the hand and sinks
  const f = held; if (!f || f.state !== 'held' || !f.c.joints.touch) return;
  f.state = 'burning'; f.burn = 0; held = null; J.flinch = 1;
  reel[reel.length - 1].burned = true; audio.bell(); flash = -.6;
}
function rescue(f) {
  const r = reel.find(e => e.f === f); if (r) r.rescued = true;
  f.state = 'reel'; insert = {c: f.c, at: T, joint: f.c.joints.touch, rescued: true}; audio.harp(); flash = .3;
}
function inBeam(x, y) {
  const ox = W * .5, oy = -Hh * .05, ang = Math.atan2(x - ox, y - oy);
  return beam.on && Math.abs(ang - beam.a) < .16;
}
function update(dt) {

  J.ph += dt / .85; const st = J.ph % 1, stroke = st < .2 ? Math.sin(st / .2 * Math.PI / 2) : 1 - (st - .2) / .8;

  if (target && phase !== 'reel' && phase !== 'end') {
    const dx = target.x - J.x, dy = target.y - J.y, d = Math.hypot(dx, dy);
    if (d > 4) { const p = (st < .2 ? 900 : 120) * dt * Math.min(1, d / 80); J.vx += dx / d * p; J.vy += dy / d * p; }
  }
  J.vx *= Math.pow(.18, dt); J.vy *= Math.pow(.18, dt); J.x = clamp(J.x + J.vx * dt, 20, W - 20); J.y = clamp(J.y + J.vy * dt, 20, Hh - 20);
  J.tilt += (clamp(J.vx / 400, -.5, .5) - J.tilt) * Math.min(1, dt * 4); J.flinch = Math.max(0, J.flinch - dt * 2);

  if (phase === 'hot' || phase === 'cool') {
    // frames drift; free ones wander, burned ones sink to the floor

      if (f.state === 'free') {
        f.vx += (Math.sin(T * .3 + f.wob) * 8) * dt; f.vy += (Math.cos(T * .27 + f.wob) * 8) * dt;
        f.vx *= Math.pow(.5, dt); f.vy *= Math.pow(.5, dt); f.x += f.vx * dt; f.y += f.vy * dt;
        if (f.x < cardW() / 2) { f.x = cardW() / 2; f.vx = Math.abs(f.vx); } if (f.x > W - cardW() / 2) { f.x = W - cardW() / 2; f.vx = -Math.abs(f.vx); }
        if (f.y < Hh * .14) { f.y = Hh * .14; f.vy = Math.abs(f.vy); } if (f.y > FLOOR() - cardH()) { f.y = FLOOR() - cardH(); f.vy = -Math.abs(f.vy); }
      } else if (f.state === 'held') { const p = hist[Math.min(hist.length - 1, 10)]; f.x += (p[0] - f.x) * Math.min(1, dt * 6); f.y += (p[1] + jR() * 1.9 - f.y) * Math.min(1, dt * 6); }
      else if (f.state === 'burning') { f.burn = Math.min(1, f.burn + dt * 1.2); if (f.burn >= 1) { f.state = 'sinking'; } }
      else if (f.state === 'sinking') { f.y += 70 * dt; f.x += Math.sin(T * 2 + f.wob) * 10 * dt; if (f.y >= FLOOR() + cardH() * .2) { f.y = FLOOR() + cardH() * .2; f.state = 'sunk'; } }
      // contact

    const c = beam.cycle % len; beam.warn = c < .8 ? 1 : 0; beam.on = c >= .8 && c < len * .62;
    if (c < dt) beam.a = (rnd() - .5) * 1.4;

  } else if (phase === 'cool') {

  }

const score = () => reel.filter(r => !r.burned || r.rescued).length;

// ---------------------------------------------------------------- drawing
const heat = () => phase === 'cool' ? 0 : 1;
function drawPic(c, x, y, w, h, joint, opt = {}) {   // an archive frame; with a joint and an anchor, the joint lands on the anchor
  const im = c.img; if (!im.naturalWidth) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();

  if (opt.anchor && joint) { ox = opt.anchor[0] - joint[0] * iw; oy = opt.anchor[1] - joint[1] * ih; }
  ctx.filter = opt.cool ? 'grayscale(1) brightness(.85) contrast(1.1)' : 'sepia(.85) saturate(1.2) contrast(1.08) brightness(.95)';
  ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha; ctx.drawImage(im, ox, oy, iw, ih); ctx.filter = 'none';
  if (opt.cool) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#9fb4ff'; ctx.fillRect(x, y, w, h); ctx.globalCompositeOperation = 'source-over'; }
  if (opt.burn > 0) {   // burns from the touch, with a ragged edge
    const t = c.joints.touch || [.5, .5], cx = ox + t[0] * iw, cy = oy + t[1] * ih, R = Math.max(w, h) * .95 * opt.burn;
    const rag = k => { ctx.beginPath(); for (let i = 0; i <= 48; i++) { const a = i / 48 * 2 * Math.PI, n = .16 * Math.sin(a * 5 + 1) + .08 * Math.sin(a * 11 + T * 3); const r = R * k * (1 + n); i ? ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r) : ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } ctx.closePath(); };
    const g = ctx.createRadialGradient(cx, cy, R * .5, cx, cy, R); g.addColorStop(0, '#070403'); g.addColorStop(.72, 'rgba(255,140,40,.95)'); g.addColorStop(1, 'rgba(255,210,140,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; rag(1); ctx.fill(); ctx.fillStyle = '#060403'; rag(.62); ctx.fill();
  }

}
function drawWorld() {
  const hot = heat(), w = W, h = Hh;
  const bg = ctx.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, hot ? '#120c07' : '#070a12'); bg.addColorStop(1, hot ? '#050302' : '#020306');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  // the tank floor: gold ridge lines that swell where something burned
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let r = 0; r < 7; r++) {
    const y = FLOOR() + r * (h - FLOOR()) / 7; ctx.beginPath();
    for (let x = 0; x <= w; x += 8) { const yv = y - 4 * Math.max(0, Math.sin(x * .02 + r + T * .4)) * (1 - r / 8); x ? ctx.lineTo(x, yv) : ctx.moveTo(x, yv); }
    ctx.strokeStyle = hot ? `rgba(233,184,106,${.28 - r * .03})` : `rgba(150,180,255,${.3 - r * .03})`; ctx.lineWidth = 1; ctx.stroke();
  }
  // marine snow
  ctx.fillStyle = 'rgba(220,230,240,.35)';
  for (let i = 0; i < 50; i++) { const x = ((i * 97.3) % w + Math.sin(T * .3 + i) * 6), y = ((i * 53.7 + T * (6 + i % 7)) % h); ctx.fillRect(x, y, 1.3, 1.3); }

    ctx.save(); ctx.translate(ox, oy); ctx.rotate(-beam.a);

      const g = ctx.createLinearGradient(0, 0, 0, L); g.addColorStop(0, 'rgba(255,205,130,.42)'); g.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.tan(.16) * L, L); ctx.lineTo(-Math.tan(.16) * L, L); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#000'; ctx.fillRect(x - 3, y - 3, cw + 6, ch + 6); ctx.shadowBlur = 0;

}
function drawJelly(hot) {

    for (let i = 0; i < 14; i++) { const p = hist[Math.min(hist.length - 1, i * 3)] || [J.x, J.y]; const x = p[0] + ax * (1 - i / 22) + Math.sin(T * 3 + k + i * .6) * (2 + i * .5), y = p[1] + r * .25 + i * r * .13; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(J.x, J.y - r * .3, r * 2.6, 0, 7); ctx.fill();
